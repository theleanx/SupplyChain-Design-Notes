<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Iterative delivery: accepted scope versus release gate</title><desc id="desc">Iteration 2 accepted 10 of 12 features with no critical defects; iteration 3 accepted 9 of 10 but has one critical defect and is not ready for affected release.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1000" height="103" rx="0" fill="#173e56" stroke="none" stroke-width="1.5"/><text x="32" y="42" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Technology Trends</text><text x="32" y="79" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" fill="#fff">Iterative delivery: accepted scope versus release gate</text> <text x="62" y="157" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#173d51" font-weight="700">Accepted features are not equivalent to release permission</text><rect x="56" y="196" width="885" height="132" rx="12" fill="#e5f4e9" stroke="none" stroke-width="1.5"/><text x="77" y="230" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#205c48" font-weight="700">Iteration 2</text><text x="77" y="272" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" fill="#153b51">10 / 12 accepted (83.3%)</text><rect x="683" y="230" width="234" height="35" rx="18" fill="#d8efe0" stroke="none" stroke-width="1.5"/><text x="800" y="254" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="middle" fill="#24634d" font-weight="700">0 critical · eligible</text><rect x="56" y="353" width="885" height="132" rx="12" fill="#f9e6df" stroke="none" stroke-width="1.5"/><text x="77" y="388" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#8e4437" font-weight="700">Iteration 3</text><text x="77" y="430" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" fill="#153b51">9 / 10 accepted (90%)</text><rect x="683" y="389" width="234" height="35" rx="18" fill="#f1d5cc" stroke="none" stroke-width="1.5"/><text x="800" y="413" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="middle" fill="#a04a37" font-weight="700">1 critical · blocked</text><text x="497" y="539" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" fill="#a04938" font-weight="700">Iterative delivery does not waive mandatory safety or security tests</text><line x1="32" y1="564" x2="968" y2="564" stroke="#d4e0e8" stroke-width="2"/><text x="500" y="587" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#466475">AlderGate Motion Products · fictional training data · check every mandatory gate</text></svg>