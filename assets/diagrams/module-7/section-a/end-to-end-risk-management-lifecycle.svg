<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc"><title id="title">End-to-End Risk Management Lifecycle: Discover, Evaluate, Act, Learn</title><desc id="desc">Continuous verification and reassessment prevent premature administrative closure.losure.</desc><rect width="1160" height="690" fill="#ffffff"/><rect width="1160" height="12" fill="#0b6a89"/><text x="56" y="54" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">End-to-End Risk Management Lifecycle: Discover,</text><text x="56" y="86" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">Evaluate, Act, Learn</text><text x="56" y="118" fill="#647786" font-size="16" font-family="Arial,sans-serif">Continuous verification and reassessment prevent premature administrative closure.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#50889b" stroke-width="1.5"/></marker></defs><text x="56" y="660" fill="#607481" font-size="15" font-family="Arial,sans-serif">Stonebridge Industrial Components  ·  Original fictional risk-control model  ·  Module 7 / A02</text><rect x="50" y="255" width="194" height="150" rx="17" fill="#eaf4f8" stroke="#0b7189" stroke-width="2.3"/><text x="147.0" y="309.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Detect and</text><text x="147.0" y="336.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">describe</text><text x="147.0" y="363.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">uncertain event</text><path d="M248,330 L275,330" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="278" y="255" width="194" height="150" rx="17" fill="#e5f4ef" stroke="#0b7189" stroke-width="2.3"/><text x="375.0" y="323.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Assess evidence</text><text x="375.0" y="350.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">and urgency</text><path d="M476,330 L503,330" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="506" y="255" width="194" height="150" rx="17" fill="#fff0d6" stroke="#0b7189" stroke-width="2.3"/><text x="603.0" y="309.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Approve</text><text x="603.0" y="336.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">response</text><text x="603.0" y="363.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">and funding</text><path d="M704,330 L731,330" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="734" y="255" width="194" height="150" rx="17" fill="#e9edfb" stroke="#0b7189" stroke-width="2.3"/><text x="831.0" y="323.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Implement and</text><text x="831.0" y="350.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">test control</text><path d="M932,330 L959,330" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="962" y="255" width="194" height="150" rx="17" fill="#fdeee8" stroke="#0b7189" stroke-width="2.3"/><text x="1059.0" y="323.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Review residual</text><text x="1059.0" y="350.1" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">exposure</text><path d="M1035,430 L1035,490" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><path d="M1035