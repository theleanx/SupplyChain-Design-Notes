<text x="55" y="82" class="title" text-anchor="start"><tspan x="55" y="82">Routing and Lot-Sizing for Dependent Demand</tspan></text>
<text x="55" y="111" class="subtitleSm" text-anchor="start"><tspan x="55" y="111">Original decision visual for routing and lot-sizing for dependent demand, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
<text x="55" y="150" class="h" text-anchor="start"><tspan x="55" y="150">Routing answers “where”; lot sizing answers “how much”</tspan></text>
