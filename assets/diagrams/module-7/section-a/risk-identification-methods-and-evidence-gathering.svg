<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc"><title id="title">Risk Identification Methods: Discovering What Routine Dashboards Miss</title><desc id="desc">Identification triangulates documents, people, process maps and independent verification.</desc><rect width="1160" height="690" fill="#ffffff"/><rect width="1160" height="12" fill="#0b6a89"/><text x="56" y="54" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">Risk Identification Methods: Discovering What Routine</text><text x="56" y="86" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">Dashboards Miss</text><text x="56" y="118" fill="#647786" font-size="16" font-family="Arial,sans-serif">Identification triangulates documents, people, process maps and independent verification.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#50889b" stroke-width="1.5"/></marker></defs><text x="56" y="660" fill="#607481" font-size="15" font-family="Arial,sans-serif">Stonebridge Industrial Components  ·  Original fictional risk-control model  ·  Module 7 / A09</text><rect x="33" y="165" width="265" height="130" rx="17" fill="#eaf4f8" stroke="#0b7189" stroke-width="2.3"/><text x="165.5" y="223.79" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">Documents and</text><text x="165.5" y="248.09" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">assumptions</text><path d="M165,299 L580,403" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="320" y="165" width="265" height="130" rx="17" fill="#e5f2ee" stroke="#0b7189" stroke-width="2.3"/><text x="452.5" y="223.79" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">Frontline interviews</text><text x="452.5" y="248.09" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">and expert rounds</text><path d="M452,299 L580,403" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="607" y="165" width="265" height="130" rx="17" fill="#fff1d8" stroke="#0b7189" stroke-width="2.3"/><text x="739.5" y="223.79" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">Process maps</text><text x="739.5" y="248.09" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">and checklists</text><path d="M739,299 L580,403" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="894" y="165" width="265" height="130" rx="17" fill="#e9edfb" stroke="#0b7189" stroke-width="2.3"/><text x="1026.5" y="223.79" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">Independent</text><text x="1026.5" y="248.09" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">evidence challenge</text><path d="M1026,299 L580,403" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="375" y="421" width="410" height="105" rx="17" fill="#fdeee8" stroke="#0b7189" stroke-width="2.3"/><text x="580.0" y="466.255" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Testable event</text><text x="580.0" y="494.605" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">and owner</text><text x="390" y="579" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#12677c">Unverified claim → evidence request → assessed event</text></svg>