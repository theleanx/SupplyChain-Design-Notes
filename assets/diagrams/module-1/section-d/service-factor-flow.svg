<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc"><title id="title">Service target to safety-stock decision flow</title><desc id="desc">A four-step flow connects the service target, approved factor, variability basis, and resulting safety stock.</desc><rect width="980" height="520" fill="white"/><style>.text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.muted{font-family:Arial,Helvetica,sans-serif;fill:#596579}.small{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.sub{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.axis{stroke:#606b7d;stroke-width:2}</style><text class="title" x="50" y="45">Turning a service target into safety stock</text><rect class="blue" x="70" y="180" width="170" height="125" rx="14"/><text class="sub" x="155" y="218" text-anchor="middle">Service target</text><text class="muted" x="155" y="247" text-anchor="middle" font-size="13">How often should demand be covered?</text><rect class="gold" x="300" y="180" width="170" height="125" rx="14"/><text class="sub" x="385" y="218" text-anchor="middle">Approved factor</text><text class="muted" x="385" y="247" text-anchor="middle" font-size="13">Chosen from the company method</text><rect class="green" x="530" y="180" width="170" height="125" rx="14"/><text class="sub" x="615" y="218" text-anchor="middle">Variability basis</text><text class="muted" x="615" y="247" text-anchor="middle" font-size="13">MAD or standard deviation</text><rect class="red" x="760" y="180" width="170" height="125" rx="14"/><text class="sub" x="845" y="218" text-anchor="middle">Safety stock</text><text class="muted" x="845" y="247" text-anchor="middle" font-size="13">Buffer carried to protect service</text><path d="M245 242 L290 242" stroke="#526172" stroke-width="3"/><path d="M290 242 l-10 -7 v14 z" fill="#526172"/><path d="M475 242 L520 242" stroke="#526172" stroke-width="3"/><path d="M520 242 l-10 -7 v14 z" fill="#526172"/><path d="M705 242 L750 242" stroke="#526172" stroke-width="3"/><path d="M750 242 l-10 -7 v14 z" fill="#526172"/><rect class="green" x="260" y="365" width="460" height="78" rx="12"/><text class="sub" x="490" y="395" text-anchor="middle">Safety stock = factor × variability measure</text><text class="muted" x="490" y="421" text-anchor="middle" font-size="14">Match the time basis of the variability measure to the risk period.</text></svg>