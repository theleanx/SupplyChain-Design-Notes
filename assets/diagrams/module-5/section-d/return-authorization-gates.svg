<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Return authorization gates</title><desc id="desc">Five gates from a return request through receipt verification.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#17324D">Return Authorization Gates</text><rect x="40" y="250" width="180" height="120" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="130" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17324D">Request</text><text x="130" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="130" dy="0">why / when / proof</tspan></text><line x1="220" y1="310" x2="255" y2="310" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="260" y="250" width="180" height="120" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="350" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17324D">Eligibility</text><text x="350" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="350" dy="0">policy / warranty</tspan></text><line x1="440" y1="310" x2="475" y2="310" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="480" y="250" width="180" height="120" rx="16" fill="#FFF4D8" stroke="#C98516" stroke-width="2"/><text x="570" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17324D">Avoidable return?</text><text x="570" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="570" dy="0">support /</tspan><tspan x="570" dy="20">troubleshooting</tspan></text><line x1="660" y1="310" x2="695" y2="310" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="700" y="250" width="180" height="120" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="790" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17324D">Authorization</text><text x="790" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="790" dy="0">RMA + routing</tspan></text><line x1="880" y1="310" x2="915" y2="310" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="920" y="250" width="180" height="120" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="1010" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17324D">Receipt</text><text x="1010" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="1010" dy="0">verify identity /</tspan><tspan x="1010" dy="20">condition</tspan></text><rect x="330" y="470" width="500" height="90" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="580" y="505" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#17324D"><tspan x="580" dy="0">Customer-friendly does not mean control-free:</tspan><tspan x="580" dy="26">make the right return easy and the wrong return visible</tspan></text></svg>