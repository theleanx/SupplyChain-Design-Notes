<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Recycling · Weighted network rate</title><desc id="desc">Two sites have 70 and 60 percent verified recycling. Network combined is 13200 over 20000 kg = 66%, not simply averaging site A percentage.</desc><rect x="0" y="0" width="1000" height="100" fill="#173d55" stroke="#173d55" stroke-width="2" rx="0"/><text x="35" y="45" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="26" font-weight="700">CSCP Module 8 · Section B</text><text x="35" y="79" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="23" font-weight="400">Recycling · Weighted network rate</text><g><text x="74" y="176" fill="#17374b" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="700">Site A</text><rect x="215" y="137" width="670" height="60" fill="#edf1f5" stroke="#245f77" stroke-width="2" rx="15"/><rect x="215" y="137" width="469" height="60" fill="#d6f0e3" stroke="#245f77" stroke-width="2" rx="15"/><text x="900" y="176" fill="#17374b" font-family="Arial, sans-serif" text-anchor="end" font-size="23" font-weight="700">70%</text><text x="219" y="223" fill="#17374b" font-family="Arial, sans-serif" text-anchor="start" font-size="17" font-weight="400">8,400 / 12,000 kg</text><text x="74" y="295" fill="#17374b" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="700">Site B</text><rect x="215" y="256" width="670" height="60" fill="#edf1f5" stroke="#245f77" stroke-width="2" rx="15"/><rect x="215" y="256" width="402" height="60" fill="#d6f0e3" stroke="#245f77" stroke-width="2" rx="15"/><text x="900" y="295" fill="#17374b" font-family="Arial, sans-serif" text-anchor="end" font-size="23" font-weight="700">60%</text><text x="219" y="342" fill="#17374b" font-family="Arial, sans-serif" text-anchor="start" font-size="17" font-weight="400">4,800 / 8,000 kg</text><text x="74" y="414" fill="#17374b" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="700">Network</text><rect x="215" y="375" width="670" height="60" fill="#edf1f5" stroke="#245f77" stroke-width="2" rx="15"/><rect x="215" y="375" width="442.2" height="60" fill="#d9e8fa" stroke="#245f77" stroke-width="2" rx="15"/><text x="900" y="414" fill="#17374b" font-family="Arial, sans-serif" text-anchor="end" font-size="23" font-weight="700">66%</text><text x="219" y="461" fill="#17374b" font-family="Arial, sans-serif" text-anchor="start" font-size="17" font-weight="400">13,200 / 20,000 kg</text><text x="500" y="548" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="17" font-weight="400">Verify both plants' underlying waste mass and proof</text></g></svg>