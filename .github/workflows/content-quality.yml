name: Content quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate learning content and assets
        run: python3 scripts/validate_repository.py
      # The shared validator runs the released Modules 1–7 gates,
      # Module 8 A/B/C, the integrated capstone and cross-module inventory.
      # Keep one authoritative run instead of executing Module 8 four times.
