<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Worker remediation must be verified</title><desc id="desc">Two horizontal progress rows show eight of twelve Q1 issues and nine of ten Q2 issues closed, with grievance-access audit as a mandatory check.</desc><rect x="0" y="0" width="1000" height="100" fill="#173d55" stroke="#173d55" stroke-width="2" rx="0"/><text x="35" y="45" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="26" font-weight="700">CSCP Module 8 · Section B</text><text x="35" y="79" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="23" font-weight="400">Worker remediation must be verified</text><g><text x="85" y="180" fill="#15374c" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="400">Q1: 8 of 12 verified closures</text><rect x="85" y="203" width="790" height="65" fill="#f1e0d7" stroke="#245f77" stroke-width="2" rx="15"/><rect x="85" y="203" width="527" height="65" fill="#cde8df" stroke="#245f77" stroke-width="2" rx="15"/><text x="854" y="246" fill="#17374b" font-family="Arial, sans-serif" text-anchor="end" font-size="25" font-weight="700">66.7%</text><text x="85" y="332" fill="#15374c" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="400">Q2: 9 of 10 verified closures</text><rect x="85" y="355" width="790" height="65" fill="#f1e0d7" stroke="#245f77" stroke-width="2" rx="15"/><rect x="85" y="355" width="711" height="65" fill="#cde8df" stroke="#245f77" stroke-width="2" rx="15"/><text x="854" y="397" fill="#17374b" font-family="Arial, sans-serif" text-anchor="end" font-size="25" font-weight="700">90%</text><rect x="85" y="474" width="790" height="61" fill="#e8eef8" stroke="#245f77" stroke-width="2" rx="15"/><text x="480" y="512" fill="#14394c" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="400">Closure rate is NOT a measure of reporting accessibility</text></g></svg>