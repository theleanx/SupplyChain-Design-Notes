<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Customer value and Pareto prioritization</title><desc id="desc">A value-concentration view separates relationship priority from revenue alone and protects against over-serving low-value activity.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Customer value and Pareto prioritization</text><rect x="140" y="205" width="130" height="310" rx="10" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="205" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="205" dy="0">Top-value</tspan><tspan x="205" dy="23">group</tspan></text><text x="205" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="205" dy="0">high relationship</tspan><tspan x="205" dy="19">attention</tspan></text><rect x="330" y="325" width="130" height="190" rx="10" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="395" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="395" dy="0">Middle-value</tspan><tspan x="395" dy="23">group</tspan></text><text x="395" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="395" dy="0">selective</tspan><tspan x="395" dy="19">differentiated</tspan><tspan x="395" dy="19">service</tspan></text><rect x="520" y="420" width="130" height="95" rx="10" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="585" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="585" dy="0">Long tail</tspan></text><text x="585" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="585" dy="0">standardized</tspan><tspan x="585" dy="19">efficient service</tspan></text><line x1="690" y1="220" x2="950" y2="220" stroke="#c9d6df" stroke-width="2"/><rect x="720" y="150" width="330" height="110" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="885.0" y="166.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="885.0" dy="0">Priority rule</tspan></text><text x="885.0" y="203.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4f6475"><tspan x="885.0" dy="0">Value concentration informs</tspan><tspan x="885.0" dy="20">attention; it does not excuse</tspan><tspan x="885.0" dy="20">poor service or create an</tspan><tspan x="885.0" dy="20">automatic CLV formula.</tspan></text><rect x="720" y="330" width="330" height="120" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="885.0" y="361.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="885.0" dy="0">Governance check</tspan></text><text x="885.0" y="398.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4f6475"><tspan x="885.0" dy="0">Are relationship resources</tspan><tspan x="885.0" dy="20">producing incremental customer</tspan><tspan x="885.0" dy="20">and enterprise value?</tspan></text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Prioritize evidence and relationship effort; do not confuse revenue concentration with unconditional importance.</text></svg>
