<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sourcing Requirements and Timing</title>
  <desc id="desc">Cascade business intent into a timed, testable sourcing package.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">REQUIREMENT CASCADE</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Sourcing Requirements and Timing</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Cascade business intent into a timed, testable sourcing package.</tspan>
  </text>
  <rect x="420" y="165" width="360" height="90" rx="16" fill="#dceef2" stroke="#587d96" stroke-width="2" />
  <text x="444" y="199" class="label" text-anchor="start">
    <tspan x="444" y="199">Business need</tspan>
  </text>
  <text x="444" y="230" class="small" text-anchor="start">
    <tspan x="444" y="230">Demand, service promise, risk appetite</tspan>
  </text>
  <path d="M600 257 V279" class="arrow" />
  <rect x="320" y="285" width="560" height="90" rx="16" fill="#e7f5f2" stroke="#587d96" stroke-width="2" />
  <text x="344" y="319" class="label" text-anchor="start">
    <tspan x="344" y="319">Category requirement</tspan>
  </text>
  <text x="344" y="350" class="small" text-anchor="start">
    <tspan x="344" y="350">Scope, volumes, constraints, target economics</tspan>
  </text>
  <path d="M600 377 V399" class="arrow" />
  <rect x="220" y="405" width="760" height="90" rx="16" fill="#fff4d6" stroke="#587d96" stroke-width="2" />
  <text x="244" y="439" class="label" text-anchor="start">
    <tspan x="244" y="439">Supplier specification</tspan>
  </text>
  <text x="244" y="470" class="small" text-anchor="start">
    <tspan x="244" y="470">Technical, quality, logistics, compliance</tspan>
  </text>
  <path d="M600 497 V519" class="arrow" />
  <rect x="120" y="525" width="960" height="90" rx="16" fill="#fde9e4" stroke="#587d96" stroke-width="2" />
  <text x="144" y="559" class="label" text-anchor="start">
    <tspan x="144" y="559">Sourcing calendar</tspan>
  </text>
  <text x="144" y="590" class="small" text-anchor="start">
    <tspan x="144" y="590">Market test, award, qualification, launch</tspan>
  </text>
</svg>
