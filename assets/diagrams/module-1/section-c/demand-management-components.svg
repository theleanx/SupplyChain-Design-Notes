<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
<title id="title">Four components of demand management</title><desc id="desc">Original educational visualization showing planning, communicating, influencing, and prioritizing demand around a balanced supply-demand objective.</desc>

<style>
.text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
.muted{font-family:Arial,Helvetica,sans-serif;fill:#596579}
.small{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}
.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}
.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}
.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}
.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}
.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}
.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}
.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}
.line{stroke:#526172;stroke-width:2.2;fill:none}
.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:8 7}
.axis{stroke:#606b7d;stroke-width:2}
</style>
<rect width="980" height="560" fill="white"/>
<text class="title" x="55" y="45">Demand management balances what the market wants with what the supply chain can deliver</text>
<rect class="blue" x="370" y="205" width="240" height="120" rx="18"/><text class="text" x="490" y="245" text-anchor="middle" font-size="19" font-weight="700">Balanced demand plan</text><text class="muted" x="490" y="276" text-anchor="middle" font-size="15">Profitable, realistic, actionable</text>
<rect class="green" x="75" y="95" width="220" height="105" rx="14"/><text class="text" x="185" y="132" text-anchor="middle" font-size="18" font-weight="700">Plan demand</text><text class="muted" x="185" y="160" text-anchor="middle" font-size="14">Forecast + planned demand creation</text>
<rect class="gold" x="685" y="95" width="220" height="105" rx="14"/><text class="text" x="795" y="132" text-anchor="middle" font-size="18" font-weight="700">Communicate demand</text><text class="muted" x="795" y="160" text-anchor="middle" font-size="14">Share changes early and clearly</text>
<rect class="purple" x="75" y="365" width="220" height="105" rx="14"/><text class="text" x="185" y="402" text-anchor="middle" font-size="18" font-weight="700">Influence demand</text><text class="muted" x="185" y="430" text-anchor="middle" font-size="14">Shape timing, mix, price, channel</text>
<rect class="red" x="685" y="365" width="220" height="105" rx="14"/><text class="text" x="795" y="402" text-anchor="middle" font-size="18" font-weight="700">Manage / prioritize</text><text class="muted" x="795" y="430" text-anchor="middle" font-size="14">Allocate scarce supply deliberately</text>
<path class="line" d="M295 150 C360 155 370 205 400 225"/><path class="line" d="M685 150 C620 155 610 205 580 225"/><path class="line" d="M295 418 C360 410 370 330 405 305"/><path class="line" d="M685 418 C620 410 610 330 575 305"/>
<text class="small" x="55" y="525">The final component is introduced here; detailed prioritization is treated later with S&amp;OP and supply-demand alignment.</text>
</svg>