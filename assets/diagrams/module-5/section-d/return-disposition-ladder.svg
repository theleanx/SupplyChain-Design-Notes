<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Return disposition ladder</title><desc id="desc">A descending ladder from restock and reuse toward recycling, energy recovery, and disposal.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#17324D">Disposition: Highest Viable Value First</text><rect x="130" y="130" width="900" height="70" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="580" y="160" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">RESTOCK / RESALE</text><text x="580" y="184" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">same product value</text><rect x="190" y="225" width="780" height="70" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="580" y="255" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">REPAIR / REFURBISH</text><text x="580" y="279" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">restore usable condition</text><rect x="250" y="320" width="660" height="70" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="580" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">REMANUFACTURE / REUSE</text><text x="580" y="374" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">recover component value</text><rect x="310" y="415" width="540" height="70" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="580" y="445" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">RECYCLE</text><text x="580" y="469" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">recover material value</text><rect x="370" y="510" width="420" height="70" rx="16" fill="#FCEBEC" stroke="#17324D" stroke-width="2"/><text x="580" y="540" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">ENERGY RECOVERY / DISPOSAL</text><text x="580" y="564" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">last viable options</text></svg>