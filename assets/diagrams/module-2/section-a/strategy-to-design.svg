<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Strategy-to-network-design decision stack</title>
  <desc id="desc">A six-layer stack connects competitive intent to customer promise, network requirements, structural choices, operating policies, and performance learning.</desc>
  <rect width="960" height="420" rx="24" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Strategy becomes design through explicit decisions</text>
  <g font-family="Arial, sans-serif" font-size="17" text-anchor="middle">
    <rect x="70" y="85" width="250" height="58" rx="12" fill="#0f766e"/><text x="195" y="120" fill="white">Competitive intent</text>
    <rect x="355" y="85" width="250" height="58" rx="12" fill="#0369a1"/><text x="480" y="120" fill="white">Customer promise</text>
    <rect x="640" y="85" width="250" height="58" rx="12" fill="#1d4ed8"/><text x="765" y="120" fill="white">Design requirements</text>
    <rect x="640" y="218" width="250" height="58" rx="12" fill="#7c3aed"/><text x="765" y="253" fill="white">Network choices</text>
    <rect x="355" y="218" width="250" height="58" rx="12" fill="#b45309"/><text x="480" y="253" fill="white">Operating policies</text>
    <rect x="70" y="218" width="250" height="58" rx="12" fill="#be123c"/><text x="195" y="253" fill="white">Measures and learning</text>
  </g>
  <g stroke="#475569" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M320 114 H348"/><path d="M605 114 H633"/><path d="M765 143 V211"/><path d="M640 247 H612"/><path d="M355 247 H327"/>
    <path d="M195 218 C195 175 195 175 195 150" stroke-dasharray="8 7"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <text x="480" y="333" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#334155">Facilities • capacity • inventory • sourcing • transport • information • governance</text>
  <text x="480" y="375" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#64748b">Feedback tests whether the structure keeps the promise under real operating conditions.</text>
</svg>
