<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Export-import intermediary network</title><desc id="desc">Exporter and importer connected through optional logistics, customs, and market intermediaries with distinct roles.</desc>
<rect width="1160" height="696" fill="#ffffff"/>
<text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Export-import intermediary network</text>
