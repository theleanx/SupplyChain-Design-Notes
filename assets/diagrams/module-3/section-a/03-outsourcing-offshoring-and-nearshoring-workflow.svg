  <line x1="1060.0" y1="365" x2="1060.0" y2="430" stroke="#587d96" stroke-width="2" />
  <text x="100" y="610" class="label" text-anchor="start">
    <tspan x="100" y="610">Control and proximity</tspan>
  </text>
  <text x="1100" y="610" class="label" text-anchor="end">
    <tspan x="1100" y="610">Scale and labor advantage</tspan>
  </text>
  <path d="M320 603 H880" class="arrow" />
</svg>
