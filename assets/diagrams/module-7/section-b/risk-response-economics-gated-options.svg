<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Gated risk response economics</title><desc id="chart-desc">Four risk response alternatives with certain costs and expected remaining event losses. Only monitored hardening and isolated failover pass mandatory gates; monitored hardening has the lowest expected annual cost among feasible alternatives.</desc>
