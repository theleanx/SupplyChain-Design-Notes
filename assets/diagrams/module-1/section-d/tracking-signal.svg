<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc"><title id="title">Tracking signal</title><desc id="desc">Original control-style line chart showing tracking signal drift and plus/minus four review limits.</desc><style>
.text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.muted{font-family:Arial,Helvetica,sans-serif;fill:#596579}.small{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.sub{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:8 7}.axis{stroke:#606b7d;stroke-width:2}</style><rect width="980" height="560" fill="white"/><text class="title" x="50" y="45">Tracking signal makes persistent forecast bias visible</text><line x1="85" y1="153.3" x2="930" y2="153.3" stroke="#7b8799" stroke-width="2" stroke-dasharray="7 6"/><text class="small" x="925" y="146.3" text-anchor="end">+4 review line</text><line x1="85" y1="270.0" x2="930" y2="270.0" stroke="#7b8799" stroke-width="2" /><text class="small" x="925" y="263.0" text-anchor="end">0</text><line x1="85" y1="386.7" x2="930" y2="386.7" stroke="#7b8799" stroke-width="2" stroke-dasharray="7 6"/><text class="small" x="925" y="379.7" text-anchor="end">-4 review line</text><text class="small" x="85.0" y="470" text-anchor="middle">1</text><text class="small" x="161.8" y="470" text-anchor="middle">2</text><text class="small" x="238.6" y="470" text-anchor="middle">3</text><text class="small" x="315.5" y="470" text-anchor="middle">4</text><text class="small" x="392.3" y="470" text-anchor="middle">5</text><text class="small" x="469.1" y="470" text-anchor="middle">6</text><text class="small" x="545.9" y="470" text-anchor="middle">7</text><text class="small" x="622.7" y="470" text-anchor="middle">8</text><text class="small" x="699.5" y="470" text-anchor="middle">9</text><text class="small" x="776.4" y="470" text-anchor="middle">10</text><text class="small" x="853.2" y="470" text-anchor="middle">11</text><text class="small" x="930.0" y="470" text-anchor="middle">12</text><polyline points="85.0,301.8 161.8,349.5 238.6,333.6 315.5,365.5 392.3,381.4 469.1,349.5 545.9,397.3 622.7,429.1 699.5,413.2 776.4,445.0 853.2,460.9 930.0,492.7" fill="none" stroke="#d59898" stroke-width="4"/><circle cx="85.0" cy="301.8" r="4.5" fill="#d59898"/><circle cx="161.8" cy="349.5" r="4.5" fill="#d59898"/><circle cx="238.6" cy="333.6" r="4.5" fill="#d59898"/><circle cx="315.5" cy="365.5" r="4.5" fill="#d59898"/><circle cx="392.3" cy="381.4" r="4.5" fill="#d59898"/><circle cx="469.1" cy="349.5" r="4.5" fill="#d59898"/><circle cx="545.9" cy="397.3" r="4.5" fill="#d59898"/><circle cx="622.7" cy="429.1" r="4.5" fill="#d59898"/><circle cx="699.5" cy="413.2" r="4.5" fill="#d59898"/><circle cx="776.4" cy="445.0" r="4.5" fill="#d59898"/><circle cx="853.2" cy="460.9" r="4.5" fill="#d59898"/><circle cx="930.0" cy="492.7" r="4.5" fill="#d59898"/><text class="small" x="85" y="520">Illustrative negative drift = repeated over-forecasting. A persistent excursion beyond the chosen control limit triggers review.</text></svg>