<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Change adoption: training differs from active use</title><desc id="desc">200 affected workers, 180 trained or 90 percent, but only 134 actively use the new process or 67 percent. A guiding coalition must remove barriers; active adoption remains below 75 percent.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1000" height="103" rx="0" fill="#173e56" stroke="none" stroke-width="1.5"/><text x="32" y="42" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Technology Trends</text><text x="32" y="79" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" fill="#fff">Change adoption: training differs from active use</text> <text x="62" y="153" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#183f52" font-weight="700">Kotter-style change governance needs observed adoption</text><text x="62" y="242" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="start" fill="#153b51">Trained (180/200)</text><rect x="300" y="211" width="590" height="36" rx="8" fill="#e8eef3" stroke="none" stroke-width="1.5"/><rect x="300" y="211" width="531" height="36" rx="8" fill="#3c9677" stroke="none" stroke-width="1.5"/><text x="905" y="241" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="end" fill="#216f51" font-weight="700">90%</text><text x="62" y="342" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="start" fill="#153b51">Active (134/200)</text><rect x="300" y="312" width="590" height="36" rx="8" fill="#e8eef3" stroke="none" stroke-width="1.5"/><rect x="300" y="312" width="395.3" height="36" rx="8" fill="#c17a68" stroke="none" stroke-width="1.5"/><text x="905" y="342" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="end" fill="#a44e3d" font-weight="700">67%</text><rect x="68" y="417" width="864" height="100" rx="12" fill="#e8f1f6" stroke="none" stroke-width="1.5"/><text x="97" y="454" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#1b4e6d" font-weight="700">Gap: 46 trained people not yet active in this pilot</text><text x="97" y="487" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="start" fill="#153b51">Coalition → remove barriers → confirm correct ongoing use</text><line x1="32" y1="564" x2="968" y2="564" stroke="#d4e0e8" stroke-width="2"/><text x="500" y="587" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#466475">AlderGate Motion Products · fictional training data · check every mandatory gate</text></svg>