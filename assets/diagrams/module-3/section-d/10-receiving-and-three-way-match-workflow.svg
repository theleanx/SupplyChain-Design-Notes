<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Receiving and Three-Way Match</title>
  <desc id="desc">Release payment only when commercial, physical, and invoice evidence agree.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">EVIDENCE MATCH</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Receiving and Three-Way Match</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Release payment only when commercial, physical, and invoice evidence agree.</tspan>
  </text>
  <polygon points="600,245 335,515 865,515" fill="#e8f4f6" stroke="#587d96" stroke-width="3" />
  <rect x="465" y="120" width="270" height="110" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <circle cx="492" cy="144" r="20" fill="#176b87" />
  <text x="492" y="150" class="label white" text-anchor="middle">
    <tspan x="492" y="150">1</tspan>
  </text>
  <text x="524" y="151" class="label" text-anchor="start">
    <tspan x="524" y="151">Purchase order</tspan>
  </text>
  <text x="485" y="189" class="body" text-anchor="start">
    <tspan x="485" y="189">What was authorized</tspan>
  </text>
  <rect x="125" y="490" width="270" height="110" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <circle cx="152" cy="514" r="20" fill="#2a9d8f" />
  <text x="152" y="520" class="label white" text-anchor="middle">
    <tspan x="152" y="520">2</tspan>
  </text>
  <text x="184" y="521" class="label" text-anchor="start">
    <tspan x="184" y="521">Goods receipt</tspan>
  </text>
  <text x="145" y="559" class="body" text-anchor="start">
    <tspan x="145" y="559">What physically arrived</tspan>
  </text>
  <rect x="805" y="490" width="270" height="110" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <circle cx="832" cy="514" r="20" fill="#e9b949" />
  <text x="832" y="520" class="label white" text-anchor="middle">
    <tspan x="832" y="520">3</tspan>
  </text>
  <text x="864" y="521" class="label" text-anchor="start">
    <tspan x="864" y="521">Supplier invoice</tspan>
  </text>
  <text x="825" y="559" class="body" text-anchor="start">
    <tspan x="825" y="559">What is being charged</tspan>
  </text>
  <circle cx="600" cy="425" r="86" fill="#ffffff" stroke="#176b87" stroke-width="3" />
  <text x="600" y="415" class="label" text-anchor="middle">
    <tspan x="600" y="415">Match or route</tspan>
    <tspan x="600" y="438">exception</tspan>
  </text>
</svg>
