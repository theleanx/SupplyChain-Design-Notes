  </text>
  <text x="937.5" y="615" class="small" text-anchor="middle">
    <tspan x="937.5" y="615">Productivity</tspan>
  </text>
  <rect x="1028" y="264.0" width="125" height="316.0" rx="6" fill="#176b87" />
  <text x="1090.5" y="252.0" class="metric" text-anchor="middle">
