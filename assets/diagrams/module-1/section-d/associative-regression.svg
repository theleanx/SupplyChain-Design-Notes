<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc"><title id="title">Associative forecasting regression example</title><desc id="desc">A scatter plot and fitted line show a positive illustrative relationship between a commercial-permit index and industrial-pump quote requests.</desc><rect width="980" height="560" fill="white"/><style>.text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.muted{font-family:Arial,Helvetica,sans-serif;fill:#596579}.small{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.sub{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.axis{stroke:#606b7d;stroke-width:2}</style><text class="title" x="50" y="45">Associative forecasting links demand to a meaningful predictor</text><text class="muted" x="50" y="72" font-size="14">Illustrative relationship: commercial-permit index and industrial-pump quote requests</text><line class="axis" x1="90" y1="450" x2="930" y2="450"/><line class="axis" x1="90" y1="450" x2="90" y2="95"/><circle cx="168.4" cy="379.0" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="235.6" cy="405.6" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="291.6" cy="316.9" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="336.4" cy="352.4" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="403.6" cy="272.5" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="459.6" cy="308.0" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="504.4" cy="228.1" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="571.6" cy="263.6" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="638.8" cy="174.9" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="717.2" cy="219.2" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="773.2" cy="130.5" r="6" fill="#8fb3da" stroke="#526172"/><circle cx="851.6" cy="157.1" r="6" fill="#8fb3da" stroke="#526172"/><line x1="90" y1="420.2" x2="930" y2="103.9" stroke="#86b8a8" stroke-width="4"/><text class="sub" x="620" y="130">Forecast form: y = a + bx</text><text class="muted" x="620" y="156" font-size="14">r ≈ 0.93 • r² ≈ 0.87</text><text class="muted" x="510" y="510" text-anchor="middle" font-size="14">Commercial-permit index (independent variable)</text><text class="muted" x="30" y="290" text-anchor="middle" font-size="14" transform="rotate(-90 30 290)">Pump quote requests (dependent variable)</text></svg>