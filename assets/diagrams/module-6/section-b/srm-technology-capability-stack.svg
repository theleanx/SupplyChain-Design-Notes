<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">SRM technology capability stack</title><desc id="desc">SRM technology enables supplier interaction through portals, transactions, performance, collaboration, workflow, and security without redefining enterprise architecture.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">SRM technology capability stack</text><rect x="110.0" y="150" width="940" height="90" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="187.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Supplier interfaces</tspan></text><text x="580.0" y="224.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">portal / catalog / exchange</tspan></text><rect x="170.0" y="262" width="820" height="95" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="301.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Workflow + transaction services</tspan></text><text x="580.0" y="338.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">orders + status + approvals</tspan></text><rect x="230.0" y="379" width="700" height="105" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="423.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Performance + collaboration services</tspan></text><text x="580.0" y="460.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">scorecards + design + planning</tspan></text><rect x="290.0" y="506" width="580" height="110" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="553.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Relationship governance</tspan></text><text x="580.0" y="590.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">roles + security + evidence</tspan></text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Module 6 defines the relationship capability need; Module 2 remains the owner of enterprise architecture mechanics.</text></svg>
