<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">SRM operating loop</title><desc id="desc">An SRM loop connects supplier segmentation, shared outcomes, relationship governance, performance, and joint improvement.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">SRM operating loop</text><rect x="110" y="180" width="260" height="112" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="240.0" y="228.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="240.0" dy="0">Supplier evidence</tspan></text><text x="240.0" y="265.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="240.0" dy="0">capability + dependency</tspan></text><rect x="450" y="150" width="260" height="112" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="185.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Relationship</tspan><tspan x="580.0" dy="25">strategy</tspan></text><text x="580.0" y="247.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">segment + desired depth</tspan></text><rect x="790" y="180" width="260" height="112" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="920.0" y="215.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="920.0" dy="0">Joint operating</tspan><tspan x="920.0" dy="25">rhythm</tspan></text><text x="920.0" y="277.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="920.0" dy="0">information + decisions</tspan></text><rect x="450" y="430" width="260" height="112" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="456.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Performance +</tspan><tspan x="580.0" dy="25">improvement</tspan></text><text x="580.0" y="518.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">delivery + quality +</tspan><tspan x="580.0" dy="19">value</tspan></text><line x1="370" y1="236" x2="450" y2="206" stroke="#6d7e8e" stroke-width="3" marker-end="url(#arrow)"/><line x1="710" y1="206" x2="790" y2="236" stroke="#6d7e8e" stroke-width="3" marker-end="url(#arrow)"/><line x1="920" y1="292" x2="710" y2="430" stroke="#6d7e8e" stroke-width="3" marker-end="url(#arrow)"/><line x1="450" y1="486" x2="300" y2="292" stroke="#6d7e8e" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Relationship management is a learning loop, not a one-time system implementation.</text></svg>
