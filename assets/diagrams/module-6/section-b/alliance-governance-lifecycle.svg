<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Alliance governance lifecycle</title><desc id="desc">Alliance implementation is grouped into five governance phases from internal alignment through pulse checks and adaptation.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Alliance governance lifecycle</text><rect x="90" y="265" width="150" height="110" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="165.0" y="312.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="165.0" dy="0">Align internally</tspan></text><text x="165.0" y="345.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="165.0" dy="0">shared intent</tspan></text><line x1="240" y1="320" x2="300" y2="320" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="300" y="265" width="150" height="110" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="375.0" y="301.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="375.0" dy="0">Select + negotiate</tspan><tspan x="375.0" dy="21">fit</tspan></text><text x="375.0" y="356.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="375.0" dy="0">win/win conditions</tspan></text><line x1="450" y1="320" x2="510" y2="320" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="265" width="150" height="110" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="585.0" y="301.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="585.0" dy="0">Set ground rules +</tspan><tspan x="585.0" dy="21">owners</tspan></text><text x="585.0" y="356.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="585.0" dy="0">roles + escalation</tspan></text><line x1="660" y1="320" x2="720" y2="320" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="720" y="265" width="150" height="110" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="795.0" y="293.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="795.0" dy="0">Operate +</tspan><tspan x="795.0" dy="21">collaborate</tspan></text><text x="795.0" y="348.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="795.0" dy="0">joint work +</tspan><tspan x="795.0" dy="16">multifaceted links</tspan></text><line x1="870" y1="320" x2="930" y2="320" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="930" y="265" width="150" height="110" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="1005.0" y="301.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="1005.0" dy="0">Pulse-check +</tspan><tspan x="1005.0" dy="21">adapt</tspan></text><text x="1005.0" y="356.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="1005.0" dy="0">health + change plan</tspan></text><path d="M1005 410 C1005 540, 160 540, 160 410" fill="none" stroke="#0b7189" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Alliance governance is continuous: health checks and change planning feed the next operating cycle.</text></svg>
