<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Design for Supply Chain and Logistics</title>
  <desc id="desc">Use cross-functional measures to expose downstream design consequences.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">DESIGN SCORECARD</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Design for Supply Chain and Logistics</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Use cross-functional measures to expose downstream design consequences.</tspan>
  </text>
  <rect x="65" y="165" width="245" height="145" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <text x="85" y="207" class="metric" text-anchor="start">
    <tspan x="85" y="207">+33.3%</tspan>
  </text>
  <text x="85" y="239" class="label" text-anchor="start">
    <tspan x="85" y="239">Pallet density</tspan>
  </text>
  <text x="85" y="280" class="small" text-anchor="start">
    <tspan x="85" y="280">6 to 8 units per pallet</tspan>
  </text>
  <rect x="340" y="165" width="245" height="145" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <text x="360" y="207" class="metric" text-anchor="start">
    <tspan x="360" y="207">−26.1%</tspan>
  </text>
  <text x="360" y="239" class="label" text-anchor="start">
    <tspan x="360" y="239">Assembly time</tspan>
  </text>
  <text x="360" y="280" class="small" text-anchor="start">
    <tspan x="360" y="280">46 to 34 minutes</tspan>
  </text>
  <rect x="615" y="165" width="245" height="145" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <text x="635" y="207" class="metric" text-anchor="start">
    <tspan x="635" y="207">−61.1%</tspan>
  </text>
  <text x="635" y="239" class="label" text-anchor="start">
    <tspan x="635" y="239">Service time</tspan>
  </text>
  <text x="635" y="280" class="small" text-anchor="start">
    <tspan x="635" y="280">18 to 7 minutes</tspan>
  </text>
  <rect x="890" y="165" width="245" height="145" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <text x="910" y="207" class="metric" text-anchor="start">
    <tspan x="910" y="207">−27.7%</tspan>
  </text>
  <text x="910" y="239" class="label" text-anchor="start">
    <tspan x="910" y="239">Packaging cost</tspan>
  </text>
  <text x="910" y="280" class="small" text-anchor="start">
    <tspan x="910" y="280">$310k to $224k</tspan>
  </text>
  <rect x="65" y="350" width="1070" height="245" rx="18" fill="#eef4f8" stroke="#587d96" stroke-width="2" />
  <text x="90" y="392" class="label" text-anchor="start">
    <tspan x="90" y="392">Management controls</tspan>
  </text>
  <rect x="100" y="440" width="470" height="52" rx="12" fill="#ffffff" stroke="#587d96" />
  <circle cx="126" cy="466" r="20" fill="#176b87" />
  <text x="126" y="472" class="label white" text-anchor="middle">
    <tspan x="126" y="472">1</tspan>
  </text>
  <text x="160" y="471" class="body" text-anchor="start">
    <tspan x="160" y="471">Approve packaging against transport lanes</tspan>
  </text>
  <rect x="620" y="440" width="470" height="52" rx="12" fill="#ffffff" stroke="#587d96" />
  <circle cx="646" cy="466" r="20" fill="#2a9d8f" />
  <text x="646" y="472" class="label white" text-anchor="middle">
    <tspan x="646" y="472">2</tspan>
  </text>
  <text x="680" y="471" class="body" text-anchor="start">
    <tspan x="680" y="471">Validate material availability and source</tspan>
    <tspan x="680" y="494">depth</tspan>
  </text>
  <rect x="100" y="512" width="470" height="52" rx="12" fill="#ffffff" stroke="#587d96" />
  <circle cx="126" cy="538" r="20" fill="#e9b949" />
  <text x="126" y="544" class="label white" text-anchor="middle">
    <tspan x="126" y="544">3</tspan>
  </text>
  <text x="160" y="543" class="body" text-anchor="start">
    <tspan x="160" y="543">Test postponement and inventory placement</tspan>
  </text>
  <rect x="620" y="512" width="470" height="52" rx="12" fill="#ffffff" stroke="#587d96" />
  <circle cx="646" cy="538" r="20" fill="#e76f51" />
  <text x="646" y="544" class="label white" text-anchor="middle">
    <tspan x="646" y="544">4</tspan>
  </text>
  <text x="680" y="543" class="body" text-anchor="start">
    <tspan x="680" y="543">Record owners for unresolved trade-offs</tspan>
  </text>
</svg>
