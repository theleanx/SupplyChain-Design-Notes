<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="B12-title B12-desc"><title id="B12-title">Rail and Motor Carrier Transport</title><desc id="B12-desc">Rail-versus-motor-carrier fit comparison using decision factors rather than a generic mode ranking.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#6b7280}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#6b7280}.tiny{font-size:11px;fill:#6b7280}.box{fill:#fff;stroke:#1f2937;stroke-width:2}.soft{fill:#f3f4f6;stroke:#1f2937;stroke-width:1.8}</style><rect width="1160" height="696" fill="white"/><text x="40" y="45" class="title">Rail and Motor Carrier Transport</text><text x="40" y="78" class="subtitle">B12 · HarborPeak Equipment Systems · original learning visual</text><rect x="70" y="165" width="385" height="70" rx="14" class="soft"/><text x="262" y="205.0" class="label" text-anchor="middle">Rail</text><rect x="485" y="165" width="190" height="70" rx="14" class="box"/><text x="580" y="205.0" class="label" text-anchor="middle">Decision factor</text><rect x="705" y="165" width="385" height="70" rx="14" class="soft"/><text x="897" y="205.0" class="label" text-anchor="middle">Motor carrier</text><rect x="70" y="250" width="385" height="60" rx="10" class="soft"/><text x="262" y="285.0" class="small" text-anchor="middle">Longer, stable lanes</text><rect x="485" y="250" width="190" height="60" rx="10" class="box"/><text x="580" y="285.0" class="small" text-anchor="middle">Distance / lane</text><rect x="705" y="250" width="385" height="60" rx="10" class="soft"/><text x="897" y="285.0" class="small" text-anchor="middle">Broad regional and local access</text><rect x="70" y="322" width="385" height="60" rx="10" class="box"/><text x="262" y="357.0" class="small" text-anchor="middle">Larger consolidated loads</text><rect x="485" y="322" width="190" height="60" rx="10" class="box"/><text x="580" y="357.0" class="small" text-anchor="middle">Shipment size</text><rect x="705" y="322" width="385" height="60" rx="10" class="box"/><text x="897" y="348.5" class="small" text-anchor="middle">Small shipment through full</text><text x="897" y="365.5" class="small" text-anchor="middle">truckload</text><rect x="70" y="394" width="385" height="60" rx="10" class="soft"/><text x="262" y="429.0" class="small" text-anchor="middle">Lower route flexibility</text><rect x="485" y="394" width="190" height="60" rx="10" class="box"/><text x="580" y="429.0" class="small" text-anchor="middle">Flexibility</text><rect x="705" y="394" width="385" height="60" rx="10" class="soft"/><text x="897" y="429.0" class="small" text-anchor="middle">High routing flexibility</text><rect x="70" y="466" width="385" height="60" rx="10" class="box"/><text x="262" y="501.0" class="small" text-anchor="middle">Scheduled; often slower</text><rect x="485" y="466" width="190" height="60" rx="10" class="box"/><text x="580" y="501.0" class="small" text-anchor="middle">Transit / schedule</text><rect x="705" y="466" width="385" height="60" rx="10" class="box"/><text x="897" y="501.0" class="small" text-anchor="middle">Generally faster door-to-door</text><rect x="70" y="538" width="385" height="60" rx="10" class="soft"/><text x="262" y="573.0" class="small" text-anchor="middle">Cost-efficient trunk movement</text><rect x="485" y="538" width="190" height="60" rx="10" class="box"/><text x="580" y="573.0" class="small" text-anchor="middle">Best decision use</text><rect x="705" y="538" width="385" height="60" rx="10" class="soft"/><text x="897" y="573.0" class="small" text-anchor="middle">Responsive pickup and delivery</text><text x="580" y="650" text-anchor="middle" class="small">Mode choice still depends on product, service, capacity, cost, security, and network constraints.</text><text x="40" y="675" class="tiny">Illustrative learning model — not operational or legal advice</text></svg>