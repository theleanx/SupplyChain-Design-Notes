ddle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">broker</text><text x="725.0" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">customs business</text><rect x="620" y="370" width="210" height="100" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="725.0" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">EMC / ETC</text><text x="725.0" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">market / export support</text><rect x="890" y="270" width="210" height="110" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="995.0" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Importer</text><text x="995.0" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">buyer / IOR context</text><line x1="270" y1="325" x2="330" y2="150" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="270" y1="325" x2="330" y2="320" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="270" y1="325" x2="330" y2="490" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="540" y1="150" x2="890" y2="325" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="540" y1="320" x2="890" y2="325" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="540" y1="490" x2="890" y2="325" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="830" y1="220" x2="890" y2="325" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="830" y1="420" x2="890" y2="325" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/>
