<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Measurement-to-decision learning loop</title>
  <desc id="desc">An objective is linked to metric definition, trusted evidence, review and diagnosis, accountable action, and outcome learning.</desc>
  <rect width="960" height="420" rx="24" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">A metric is complete only when it changes a decision</text>
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="55" y="115" width="145" height="72" rx="12" fill="#0f766e"/><text x="128" y="145" fill="white">Objective and</text><text x="128" y="167" fill="white">decision</text>
    <rect x="230" y="115" width="145" height="72" rx="12" fill="#0369a1"/><text x="303" y="145" fill="white">Definition and</text><text x="303" y="167" fill="white">target</text>
    <rect x="405" y="115" width="145" height="72" rx="12" fill="#1d4ed8"/><text x="478" y="145" fill="white">Trusted data</text><text x="478" y="167" fill="white">and calculation</text>
    <rect x="580" y="115" width="145" height="72" rx="12" fill="#7c3aed"/><text x="653" y="145" fill="white">Review and</text><text x="653" y="167" fill="white">diagnosis</text>
    <rect x="755" y="115" width="150" height="72" rx="12" fill="#b45309"/><text x="830" y="145" fill="white">Owner action</text><text x="830" y="167" fill="white">and evidence</text>
  </g>
  <g stroke="#475569" stroke-width="4" marker-end="url(#arrow)"><path d="M200 151 H223"/><path d="M375 151 H398"/><path d="M550 151 H573"/><path d="M725 151 H748"/></g>
  <path d="M830 190 C830 380 128 380 128 194" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <text x="480" y="248" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#334155">Outcome learning updates the objective, process, threshold, or measure.</text>
</svg>
