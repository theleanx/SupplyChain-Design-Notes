<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Strategic alliance suitability gate</title><desc id="desc">An alliance decision applies hard fit gates before a weighted relationship rationale can be considered.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Strategic alliance suitability gate</text><rect x="95" y="170" width="165" height="120" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="177.5" y="214.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="177.5" dy="0">Strategic need?</tspan></text><text x="177.5" y="247.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="177.5" dy="0">value + access +</tspan><tspan x="177.5" dy="16">capability</tspan></text><line x1="260" y1="230" x2="295" y2="230" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="295" y="170" width="165" height="120" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="377.5" y="214.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="377.5" dy="0">Partner fit?</tspan></text><text x="377.5" y="247.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="377.5" dy="0">direction + expertise</tspan><tspan x="377.5" dy="16">+ culture</tspan></text><line x1="460" y1="230" x2="495" y2="230" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="495" y="170" width="165" height="120" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="577.5" y="203.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="577.5" dy="0">Risk / integrity</tspan><tspan x="577.5" dy="21">acceptable?</tspan></text><text x="577.5" y="258.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="577.5" dy="0">security + conflict +</tspan><tspan x="577.5" dy="16">continuity</tspan></text><line x1="660" y1="230" x2="695" y2="230" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="170" width="165" height="120" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="777.5" y="211.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="777.5" dy="0">Mutual value</tspan><tspan x="777.5" dy="21">credible?</tspan></text><text x="777.5" y="266.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="777.5" dy="0">shared risk / reward</tspan></text><line x1="860" y1="230" x2="895" y2="230" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="895" y="170" width="165" height="120" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="977.5" y="214.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="977.5" dy="0">Alliance rationale</tspan></text><text x="977.5" y="247.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="977.5" dy="0">proceed to design only</tspan><tspan x="977.5" dy="16">if gates pass</tspan></text><rect x="250" y="430" width="660" height="100" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="451.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Hard-gate rule</tspan></text><text x="580.0" y="490.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">A high weighted score cannot override a failed</tspan><tspan x="580.0" dy="20">integrity, security, strategic-fit, or mandatory-risk</tspan><tspan x="580.0" dy="20">gate.</tspan></text></svg>
