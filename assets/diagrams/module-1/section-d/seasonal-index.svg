<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc"><title id="title">Seasonal index</title><desc id="desc">Original bar chart showing monthly seasonal indices above and below the average index of one.</desc><style>
.text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.muted{font-family:Arial,Helvetica,sans-serif;fill:#596579}.small{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.sub{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:8 7}.axis{stroke:#606b7d;stroke-width:2}</style><rect width="980" height="560" fill="white"/><text class="title" x="50" y="45">Seasonal index shows each month relative to an average month</text><line class="axis" x1="75" y1="440" x2="940" y2="440"/><line x1="75" y1="270" x2="940" y2="270" stroke="#7b8799" stroke-width="2" stroke-dasharray="7 6"/><text class="small" x="82" y="260">Index = 1.00</text><rect class="blue" x="88.0" y="205.4" width="44.7" height="64.6" rx="3"/><text class="small" x="110.3" y="465" text-anchor="middle">Jan</text><text class="small" x="110.3" y="199.4" text-anchor="middle">1.25</text><rect class="blue" x="160.1" y="223.7" width="44.7" height="46.3" rx="3"/><text class="small" x="182.4" y="465" text-anchor="middle">Feb</text><text class="small" x="182.4" y="217.7" text-anchor="middle">1.18</text><rect class="blue" x="232.1" y="241.1" width="44.7" height="28.9" rx="3"/><text class="small" x="254.5" y="465" text-anchor="middle">Mar</text><text class="small" x="254.5" y="235.1" text-anchor="middle">1.11</text><rect class="blue" x="304.2" y="264.6" width="44.7" height="5.4" rx="3"/><text class="small" x="326.6" y="465" text-anchor="middle">Apr</text><text class="small" x="326.6" y="258.6" text-anchor="middle">1.02</text><rect class="gold" x="376.3" y="270.0" width="44.7" height="23.6" rx="3"/><text class="small" x="398.7" y="465" text-anchor="middle">May</text><text class="small" x="398.7" y="264.0" text-anchor="middle">0.91</text><rect class="gold" x="448.4" y="270.0" width="44.7" height="61.0" rx="3"/><text class="small" x="470.7" y="465" text-anchor="middle">Jun</text><text class="small" x="470.7" y="264.0" text-anchor="middle">0.77</text><rect class="gold" x="520.5" y="270.0" width="44.7" height="67.8" rx="3"/><text class="small" x="542.8" y="465" text-anchor="middle">Jul</text><text class="small" x="542.8" y="264.0" text-anchor="middle">0.74</text><rect class="gold" x="592.6" y="270.0" width="44.7" height="64.5" rx="3"/><text class="small" x="614.9" y="465" text-anchor="middle">Aug</text><text class="small" x="614.9" y="264.0" text-anchor="middle">0.75</text><rect class="gold" x="664.6" y="270.0" width="44.7" height="32.8" rx="3"/><text class="small" x="687.0" y="465" text-anchor="middle">Sep</text><text class="small" x="687.0" y="264.0" text-anchor="middle">0.87</text><rect class="blue" x="736.7" y="268.6" width="44.7" height="2.0" rx="3"/><text class="small" x="759.1" y="465" text-anchor="middle">Oct</text><text class="small" x="759.1" y="262.6" text-anchor="middle">1.01</text><rect class="blue" x="808.8" y="234.7" width="44.7" height="35.3" rx="3"/><text class="small" x="831.2" y="465" text-anchor="middle">Nov</text><text class="small" x="831.2" y="228.7" text-anchor="middle">1.14</text><rect class="blue" x="880.9" y="202.2" width="44.7" height="67.8" rx="3"/><text class="small" x="903.2" y="465" text-anchor="middle">Dec</text><text class="small" x="903.2" y="196.2" text-anchor="middle">1.26</text><text class="small" x="75" y="520">Index above 1.00 = above-average season. Index below 1.00 = below-average season.</text></svg>