<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">Demand plan review dashboard</title><desc id="desc">Original educational dashboard showing actual demand, current and prior demand plans, business-plan target, assumptions, risks, and actions.</desc>

<style>
.text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
.muted{font-family:Arial,Helvetica,sans-serif;fill:#596579}
.small{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}
.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}
.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}
.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}
.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}
.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}
.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}
.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}
.line{stroke:#526172;stroke-width:2.2;fill:none}
.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:8 7}
.axis{stroke:#606b7d;stroke-width:2}
</style>
<rect width="1080" height="620" fill="white"/>
<text class="title" x="45" y="42">Demand review dashboard: make changes and assumptions visible</text>
<rect class="box" x="45" y="75" width="650" height="350" rx="14"/>
<text class="text" x="70" y="110" font-size="16" font-weight="700">Volume view (illustrative)</text>
<line class="axis" x1="85" y1="370" x2="665" y2="370"/><line class="axis" x1="85" y1="370" x2="85" y2="135"/>
<path d="M95 320 L150 300 L205 310 L260 280" stroke="#245a8d" stroke-width="4" fill="none"/>
<path d="M260 280 L315 260 L370 250 L425 240 L480 220 L535 205 L590 200 L645 190" stroke="#2a8b7b" stroke-width="4" fill="none"/>
<path d="M260 290 L315 282 L370 270 L425 255 L480 245 L535 235 L590 225 L645 220" stroke="#7b8799" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
<path d="M260 270 L315 245 L370 230 L425 215 L480 200 L535 185 L590 170 L645 155" stroke="#b7791f" stroke-width="3" fill="none"/>
<text class="small" x="115" y="400">Actuals</text><text class="small" x="320" y="400">Future horizon</text>
<text class="small" x="715" y="130">Legend</text><line x1="715" y1="155" x2="760" y2="155" stroke="#245a8d" stroke-width="4"/><text class="small" x="770" y="160">Recent actual demand</text>
<line x1="715" y1="185" x2="760" y2="185" stroke="#2a8b7b" stroke-width="4"/><text class="small" x="770" y="190">Current consensus plan</text>
<line x1="715" y1="215" x2="760" y2="215" stroke="#7b8799" stroke-width="3" stroke-dasharray="8 6"/><text class="small" x="770" y="220">Prior plan</text>
<line x1="715" y1="245" x2="760" y2="245" stroke="#b7791f" stroke-width="3"/><text class="small" x="770" y="250">Business-plan target</text>
<rect class="gold" x="45" y="450" width="315" height="120" rx="12"/><text class="text" x="65" y="480" font-size="15" font-weight="700">Assumptions &amp; uncertainty</text><text class="small" x="65" y="510">• Pricing / promotional assumptions</text><text class="small" x="65" y="535">• Confidence by period / family</text><text class="small" x="65" y="560">• Known gaps in evidence</text>
<rect class="red" x="382" y="450" width="315" height="120" rx="12"/><text class="text" x="402" y="480" font-size="15" font-weight="700">Risks &amp; opportunities</text><text class="small" x="402" y="510">• Competitor actions</text><text class="small" x="402" y="535">• Economic / channel signals</text><text class="small" x="402" y="560">• Upside and downside scenarios</text>
<rect class="green" x="719" y="450" width="315" height="120" rx="12"/><text class="text" x="739" y="480" font-size="15" font-weight="700">Actions / decisions</text><text class="small" x="739" y="510">• Demand-shaping commitments</text><text class="small" x="739" y="535">• Supply response / escalation</text><text class="small" x="739" y="560">• Owner and due date</text>
</svg>