<text x="352" y="245" class="small" text-anchor="start"><tspan x="352" y="245">release work</tspan></text>
<rect x="600" y="185" width="190" height="85" rx="14" fill="#FFFFFF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
