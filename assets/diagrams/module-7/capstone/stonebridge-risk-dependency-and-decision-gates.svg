<text x="1102" y="643" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#435869" text-anchor="start">confirmed dispatch</text>
<rect x="54" y="713" width="1252" height="76" rx="14" fill="#fff6e1" stroke="#d5a650" stroke-width="2"/>
<text x="79" y="749" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#8a5b0e" text-anchor="start">NOT YET PROVEN</text>
<text x="330" y="748" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">Two exercise gates missed: emergency roles +4 min; carrier confirmation +40 min.</text>
<text x="330" y="774" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#5f6b73" text-anchor="start">Retest 15 Nov 2026. Do not claim the 24-hour outbound RTO is demonstrated.</text>
