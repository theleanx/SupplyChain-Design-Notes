" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">and process method</text><path d="M580,245 L218,300" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><path d="M218,438 L580,504" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="430" y="307" width="340" height="130" rx="17" fill="#fff0d6" stroke="#0b7189" stroke-width="2.3"/><text x="600.0" y="364.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Funded preventive</text><text x="600.0" y="393.105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">control plan</text><path d="M580,245 L600,300" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><path d="M600,438 L580,504" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="812" y="307" width="340" height="130" rx="17" fill="#e9edfb" stroke="#0b7189" stroke-width="2.3"/><text x="982.0" y="364.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Bounded contingency</text><text x="982.0" y="393.105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">reserve</text><path d="M580,245 L982,300" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><path d="M982,438 L580,504" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="397" y="515" width="366" height="92" rx="17" fill="#fce9e8" stroke="#0b7189" stroke-width="2.3"/><text x="580.0" y="553.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Delegated response</text><text x="580.0" y="582.105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">and reconciliation</text></svg>