<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Customer relationship lifecycle</title><desc id="desc">A relationship-state flow shows acquisition, loyalty, vulnerability, churn, and win-back with different management actions.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Customer relationship lifecycle</text><rect x="90" y="300" width="130" height="100" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="155.0" y="341.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="155.0" dy="0">Prospect</tspan></text><text x="155.0" y="374.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="155.0" dy="0">convert</tspan></text><line x1="220" y1="350" x2="260" y2="350" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="300" width="130" height="100" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="325.0" y="341.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="325.0" dy="0">New customer</tspan></text><text x="325.0" y="374.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="325.0" dy="0">onboard</tspan></text><line x1="390" y1="350" x2="440" y2="350" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="440" y="300" width="130" height="100" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="505.0" y="341.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="505.0" dy="0">Loyal</tspan></text><text x="505.0" y="374.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="505.0" dy="0">retain + grow</tspan></text><line x1="570" y1="350" x2="620" y2="350" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="300" width="130" height="100" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="685.0" y="341.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="685.0" dy="0">Vulnerable</tspan></text><text x="685.0" y="374.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="685.0" dy="0">detect + recover</tspan></text><line x1="750" y1="350" x2="800" y2="350" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="800" y="300" width="130" height="100" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="865.0" y="341.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="865.0" dy="0">Churned</tspan></text><text x="865.0" y="374.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="865.0" dy="0">learn cause</tspan></text><line x1="930" y1="350" x2="970" y2="350" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="300" width="130" height="100" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="1035.0" y="341.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="1035.0" dy="0">Win-back</tspan></text><text x="1035.0" y="374.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="1035.0" dy="0">re-earn trust</tspan></text><path d="M685 300 C685 215, 510 215, 505 300" fill="none" stroke="#0b7189" stroke-width="3" marker-end="url(#arrow)"/><path d="M1035 300 C1035 170, 505 170, 505 300" fill="none" stroke="#0b7189" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Different relationship states require different evidence, offers, and recovery actions.</text></svg>
