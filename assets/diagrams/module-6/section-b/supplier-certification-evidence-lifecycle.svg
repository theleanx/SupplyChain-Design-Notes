<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Supplier certification and evidence lifecycle</title><desc id="desc">Certification moves from requirements through evidence, assessment, status, corrective action, and periodic requalification.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Supplier certification and evidence lifecycle</text><rect x="55" y="245" width="150" height="112" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="130.0" y="274.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="130.0" dy="0">Define</tspan><tspan x="130.0" dy="20">requirements</tspan></text><text x="130.0" y="326.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="130.0" dy="0">customer +</tspan><tspan x="130.0" dy="16">third-party criteria</tspan></text><line x1="205" y1="301" x2="235" y2="301" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="235" y="245" width="150" height="112" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="310.0" y="292.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="310.0" dy="0">Collect evidence</tspan></text><text x="310.0" y="324.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="310.0" dy="0">procedures + records</tspan></text><line x1="385" y1="301" x2="415" y2="301" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="245" width="150" height="112" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="490.0" y="284.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="490.0" dy="0">Assess</tspan></text><text x="490.0" y="316.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="490.0" dy="0">on-site / audit /</tspan><tspan x="490.0" dy="16">rating</tspan></text><line x1="565" y1="301" x2="595" y2="301" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="595" y="245" width="150" height="112" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="670.0" y="276.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="670.0" dy="0">Assign status</tspan></text><text x="670.0" y="308.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="670.0" dy="0">certified /</tspan><tspan x="670.0" dy="16">conditional /</tspan><tspan x="670.0" dy="16">remediation</tspan></text><line x1="745" y1="301" x2="775" y2="301" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="775" y="245" width="150" height="112" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="850.0" y="292.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="850.0" dy="0">Correct gaps</tspan></text><text x="850.0" y="324.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="850.0" dy="0">owned actions</tspan></text><line x1="925" y1="301" x2="955" y2="301" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="955" y="245" width="150" height="112" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="1030.0" y="292.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="1030.0" dy="0">Requalify</tspan></text><text x="1030.0" y="324.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="1030.0" dy="0">periodic confirmation</tspan></text><rect x="260" y="445" width="640" height="115" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="475.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Evidence rule</tspan></text><text x="580.0" y="512.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">Status requires current procedures, records, observed</tspan><tspan x="580.0" dy="19">performance, corrective action, and periodic</tspan><tspan x="580.0" dy="19">requalification.</tspan></text></svg>
