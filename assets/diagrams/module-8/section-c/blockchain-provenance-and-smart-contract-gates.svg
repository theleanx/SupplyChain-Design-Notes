ont-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#153d51" font-weight="700">Ledger</text><rect x="247" y="341" width="625" height="36" rx="8" fill="#e8eef3" stroke="none" stroke-width="1.5"/><rect x="247" y="341" width="618.75" height="36" rx="8" fill="#78bb98" stroke="none" stroke-width="1.5"/><text x="883" y="376" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="end" fill="#216848" font-weight="700">99 recorded</text><rect x="247" y="390" width="625" height="36" rx="8" fill="#e8eef3" stroke="none" stroke-width="1.5"/><rect x="247" y="390" width="600" height="36" rx="8" fill="#339478" stroke="none" stroke-width="1.5"/><text x="883" y="425" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="end" fill="#216848" font-weight="700">96 verified</text><rect x="110" y="491" width="780" height="35" rx="18" fill="#d8efe0" stroke="none" stroke-width="1.5"/><text x="500" y="515" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="middle" fill="#24634d" font-weight="700">Input truth and corrections remain mandatory, regardless of immutability</text><line x1="32" y1="564" x2="968" y2="564" stroke="#d4e0e8" stroke-width="2"/><text x="500" y="587" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#466475">AlderGate Motion Products · fictional training data · check every mandatory gate</text></svg>