<text x="70" y="579" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#3a9c7a" text-anchor="start">01</text>
<text x="70" y="616" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">People / site</text>
<text x="70" y="643" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#435869" text-anchor="start">all-clear</text>
