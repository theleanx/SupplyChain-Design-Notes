<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Purchasing Flow and Supplier-Selection Routes decision workflow</title><desc id="desc">Five-stage decision workflow with explicitly wrapped labels for reliable display.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#eef4f8"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3e6078"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.heading{font-size:30px;font-weight:700;fill:#102a43}.sub{font-size:16px;fill:#486581}.label{font-size:20px;font-weight:700;fill:#102a43}.num{font-size:19px;font-weight:700;fill:#fff}g rect{fill:#fff;stroke:#587d96;stroke-width:2}g circle{fill:#176b87}path{fill:none;stroke:#3e6078;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text class="heading" x="60" y="60">Purchasing Flow and Supplier-Selection Routes</text><text class="sub" x="60" y="92">Decision workflow • follow the numbered sequence and retain the evidence from each stage</text><path d="M360 205 H425"/><path d="M740 205 H805"/><path d="M970 280 V330 Q970 350 950 350 H800 Q780 350 780 370"/><path d="M630 465 H565"/><g><rect x="60" y="130" width="300" height="150" rx="18"/><circle cx="94" cy="164" r="20"/><text class="num" x="94" y="171" text-anchor="middle">1</text><text class="label" text-anchor="middle"><tspan x="210" y="188">Approve the requirement and</tspan><tspan x="210" y="218">route</tspan></text></g><g><rect x="440" y="130" width="300" height="150" rx="18"/><circle cx="474" cy="164" r="20"/><text class="num" x="474" y="171" text-anchor="middle">2</text><text class="label" text-anchor="middle"><tspan x="590" y="188">Identify and prequalify</tspan><tspan x="590" y="218">candidates</tspan></text></g><g><rect x="820" y="130" width="300" height="150" rx="18"/><circle cx="854" cy="164" r="20"/><text class="num" x="854" y="171" text-anchor="middle">3</text><text class="label" text-anchor="middle"><tspan x="970" y="203">Issue a consistent request</tspan></text></g><g><rect x="630" y="390" width="300" height="150" rx="18"/><circle cx="664" cy="424" r="20"/><text class="num" x="664" y="431" text-anchor="middle">4</text><text class="label" text-anchor="middle"><tspan x="780" y="463">Evaluate evidence and risk</tspan></text></g><g><rect x="250" y="390" width="300" height="150" rx="18"/><circle cx="284" cy="424" r="20"/><text class="num" x="284" y="431" text-anchor="middle">5</text><text class="label" text-anchor="middle"><tspan x="400" y="448">Negotiate, award, onboard,</tspan><tspan x="400" y="478">and measure</tspan></text></g></svg>