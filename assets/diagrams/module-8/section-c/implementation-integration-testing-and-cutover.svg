chor="start" fill="#a24938" font-weight="700">2 critical</text><text x="540" y="401" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="start" fill="#153b51">Release controls unresolved</text><rect x="125" y="504" width="750" height="35" rx="18" fill="#f2d4ca" stroke="none" stroke-width="1.5"/><text x="500" y="528" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="middle" fill="#a04c37" font-weight="700">No automated production cutover until all critical tests pass</text><line x1="32" y1="564" x2="968" y2="564" stroke="#d4e0e8" stroke-width="2"/><text x="500" y="587" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#466475">AlderGate Motion Products · fictional training data · check every mandatory gate</text></svg>