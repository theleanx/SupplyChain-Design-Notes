<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc"><title id="title">COSO ERM and Governance, Risk, and Compliance: Putting Oversight to Work</title><desc id="desc">Risk treatment and compliance evidence are parallel controls, not a single blended score.</desc><rect width="1160" height="690" fill="#ffffff"/><rect width="1160" height="12" fill="#0b6a89"/><text x="56" y="54" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">COSO ERM and Governance, Risk, and Compliance: Putting</text><text x="56" y="86" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">Oversight to Work</text><text x="56" y="118" fill="#647786" font-size="16" font-family="Arial,sans-serif">Risk treatment and compliance evidence are parallel controls, not a single blended score.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#50889b" stroke-width="1.5"/></marker></defs><text x="56" y="660" fill="#607481" font-size="15" font-family="Arial,sans-serif">Stonebridge Industrial Components  ·  Original fictional risk-control model  ·  Module 7 / A07</text><rect x="390" y="142" width="380" height="93" rx="17" fill="#eaf4f8" stroke="#0b7189" stroke-width="2.3"/><text x="580.0" y="181.255" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Strategic objective</text><text x="580.0" y="209.605" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">and oversight</text><rect x="75" y="294" width="420" height="140" rx="17" fill="#e5f2ee" stroke="#0b7189" stroke-width="2.3"/><text x="285.0" y="356.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">ERM exposure</text><text x="285.0" y="385.105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">and treatment</text><rect x="665" y="294" width="420" height="140" rx="17" fill="#fff1d7" stroke="#0b7189" stroke-width="2.3"/><text x="875.0" y="356.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">GRC obligation</text><text x="875.0" y="385.105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">and policy gate</text><path d="M490,235 L289,292" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><path d="M670,235 L870,292" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><path d="M289,435 L515,482" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><path d="M870,435 L645,482" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="405" y="482" width="350" height="75" rx="17" fill="#e6edfb" stroke="#0b7189" stroke-width="2.3"/><text x="580.0" y="512.945" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#17324d">Control evidence</text><text x="580.0" y="538.595" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#17324d">and test</text><path d="M580,558 L580,576" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="395" y="580" width="370" height="62" rx="17" fill="#fceae7" stroke="#0b7189" stroke-width="2.3"/><text x="580.0" y="605.135" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17324d">Executive assurance</text><text x="580.0" y="628.085" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17324d">and review</text></svg>