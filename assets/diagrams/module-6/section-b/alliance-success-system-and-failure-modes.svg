<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Alliance success system and failure modes</title><desc id="desc">Alliance success depends on trust, commitment, information, integration, and institutionalization while predictable failure modes attack the same system.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Alliance success system and failure modes</text><circle cx="580.0" cy="145.0" r="78" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="135.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Trust +</tspan><tspan x="580.0" dy="20">integrity</tspan></text><text x="580.0" y="173.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#a14848"><tspan x="580.0" dy="0">risk: opportunism</tspan></text><circle cx="765.456020677555" cy="279.74168609688525" r="78" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="765.456020677555" y="269.74168609688525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="765.456020677555" dy="0">Commitment</tspan></text><text x="765.456020677555" y="307.74168609688525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#a14848"><tspan x="765.456020677555" dy="0">risk: local</tspan><tspan x="765.456020677555" dy="15">incentives</tspan></text><circle cx="694.6181241970322" cy="497.75831390311475" r="78" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="694.6181241970322" y="487.75831390311475" text-anchor="middle