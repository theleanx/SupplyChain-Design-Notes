<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Simplification, DFMA, and Serviceability</title>
  <desc id="desc">Remove avoidable complexity before optimizing the remaining work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">DESIGN SIMPLIFICATION FUNNEL</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Simplification, DFMA, and Serviceability</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Remove avoidable complexity before optimizing the remaining work.</tspan>
  </text>
  <polygon points="140,165 1060,165 1005,235 195,235" fill="#dceef2" stroke="#587d96" stroke-width="2" />
  <text x="600" y="194" class="label" text-anchor="middle">
    <tspan x="600" y="194">Challenge</tspan>
  </text>
  <text x="600" y="219" class="small" text-anchor="middle">
    <tspan x="600" y="219">Question every part, fastening method, and tolerance</tspan>
  </text>
  <polygon points="215,257 985,257 930,327 270,327" fill="#dff3ef" stroke="#587d96" stroke-width="2" />
  <text x="600" y="286" class="label" text-anchor="middle">
    <tspan x="600" y="286">Combine</tspan>
  </text>
  <text x="600" y="311" class="small" text-anchor="middle">
    <tspan x="600" y="311">Integrate functions where risk stays controlled</tspan>
  </text>
  <polygon points="290,349 910,349 855,419 345,419" fill="#fff0ca" stroke="#587d96" stroke-width="2" />
  <text x="600" y="378" class="label" text-anchor="middle">
    <tspan x="600" y="378">Simplify</tspan>
  </text>
  <text x="600" y="403" class="small" text-anchor="middle">
    <tspan x="600" y="403">Reduce motions, tools, orientations, and variants</tspan>
  </text>
  <polygon points="365,441 835,441 780,511 420,511" fill="#fbe2dc" stroke="#587d96" stroke-width="2" />
  <text x="600" y="470" class="label" text-anchor="middle">
    <tspan x="600" y="470">Service test</tspan>
  </text>
  <text x="600" y="495" class="small" text-anchor="middle">
    <tspan x="600" y="495">Verify access, diagnosis, replacement, and recovery</tspan>
  </text>
  <rect x="410" y="565" width="380" height="70" rx="18" fill="#176b87" />
  <text x="600" y="607" class="label white" text-anchor="middle">
    <tspan x="600" y="607">Lower lifecycle effort</tspan>
  </text>
  <path d="M600 535 V560" class="arrow" />
</svg>
