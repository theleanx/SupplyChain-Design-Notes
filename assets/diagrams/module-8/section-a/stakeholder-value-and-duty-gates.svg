<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Stakeholder value: customer benefits are not revenue</title><desc id="desc">Illustrative annual customer downtime avoided may be 180000 USD versus 95000 USD program expense. The 85000 USD arithmetic difference is not company profit because customer value is not necessarily vendor revenue.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff"/><rect x="0" y="0" width="1000" height="101" rx="0" fill="#173e55"/><text x="32" y="42" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Optimization and Strategy</text><text x="32" y="77" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff">Stakeholder value: customer benefits are not revenue</text><text x="61" y="151" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#1b3f53" font-weight="700">Customer-value versus company-income boundary</text><rect x="67" y="198" width="405" height="205" rx="12" fill="#e2f1e8"/><text x="85" y="241" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52" font-weight="700">Customer benefit</text><text x="85" y="279" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">$180,000/year avoided loss</text><text x="89" y="330" font-size="20" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#22694f">Benefit accrues to customers</text><rect x="526" y="198" width="405" height="205" rx="12" fill="#f9e7df"/><text x="544" y="241" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52" font-weight="700">AlderGate program cost</text><text x="544" y="279" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">$95,000/year spent</text><text x="548" y="330" font-size="20" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#a14d3c">Expense accrues to AlderGate</text><rect x="94" y="452" width="813" height="76" rx="12" fill="#e9f1f8"/><text x="501" y="485" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#1e5375" font-weight="700">$85,000 net social difference ≠ AlderGate profit</text><text x="501" y="514" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#46677b">Verify value-capture mechanism and workers' obligations</text><line x1="32" y1="560" x2="968" y2="560" stroke="#bdcdd7" stroke-width="2"/><text x="500" y="585" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#557083">AlderGate Motion Products · fictional scope and calculations</text></svg>