<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Cash-to-cash operating cycle</title>
  <desc id="desc">Inventory days and receivable days extend the operating cash cycle while payable days offset it; an example totals sixty-eight days.</desc>
  <rect width="960" height="420" rx="24" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Cash-to-cash connects physical flow and financial timing</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="110" width="300" height="80" rx="12" fill="#0f766e"/><text x="220" y="145" font-size="20" fill="white">Inventory days</text><text x="220" y="172" font-size="17" fill="#ccfbf1">64 days</text>
    <text x="402" y="162" font-size="34" fill="#334155">+</text>
    <rect x="450" y="110" width="300" height="80" rx="12" fill="#0369a1"/><text x="600" y="145" font-size="20" fill="white">Receivable days</text><text x="600" y="172" font-size="17" fill="#e0f2fe">42 days</text>
    <text x="782" y="162" font-size="34" fill="#334155">−</text>
    <rect x="590" y="230" width="300" height="80" rx="12" fill="#7c3aed"/><text x="740" y="265" font-size="20" fill="white">Payable days</text><text x="740" y="292" font-size="17" fill="#ede9fe">38 days</text>
    <rect x="70" y="230" width="400" height="80" rx="12" fill="#be123c"/><text x="270" y="265" font-size="20" fill="white">Cash-to-cash cycle</text><text x="270" y="292" font-size="17" fill="#ffe4e6">64 + 42 − 38 = 68 days</text>
    <text x="480" y="370" font-size="15" fill="#64748b">Use average balances, consistent annual flows, and documented accounting conventions.</text>
  </g>
  <path d="M590 270 H478" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
</svg>
