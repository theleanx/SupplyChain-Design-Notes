<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Strategic sourcing versus tactical buying: relationship view</title><desc id="desc">A side-by-side relationship comparison focuses on duration, information, contact, and outcome orientation rather than the sourcing-cycle mechanics.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Strategic sourcing versus tactical buying: relationship view</text><rect x="100" y="160" width="450" height="90" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="325.0" y="213.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d"><tspan x="325.0" dy="0">Tactical buying</tspan></text><rect x="610" y="160" width="450" height="90" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="835.0" y="213.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d"><tspan x="835.0" dy="0">Strategic sourcing</tspan></text><rect x="140" y="285" width="370" height="75" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="325.0" y="328.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="325.0" dy="0">transaction / short horizon</tspan></text><rect x="650" y="285" width="370" height="75" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="835.0" y="328.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="835.0" dy="0">relationship / longer horizon</tspan></text><rect x="140" y="390" width="370" height="75" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="325.0" y="433.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="325.0" dy="0">limited cross-functional contact</tspan></text><rect x="650" y="390" width="370" height="75" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="835.0" y="433.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="835.0" dy="0">multi-function contact</tspan></text><rect x="140" y="495" width="370" height="75" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="325.0" y="538.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="325.0" dy="0">price + execution focus</tspan></text><rect x="650" y="495" width="370" height="75" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="835.0" y="538.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="835.0" dy="0">total outcome + improvement focus</tspan></text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">The distinction here is relationship behavior; Module 3 remains the owner of sourcing-cycle execution.</text></svg>
