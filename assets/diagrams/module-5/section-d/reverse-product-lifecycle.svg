<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Reverse logistics product life cycle</title><desc id="desc">Illustrative forward and reverse activity curves across development through continuing support.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17324D">Reverse Logistics Across the Product Life Cycle</text><rect x="65" y="430" width="145" height="72" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="137" y="474" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Develop</text><rect x="240" y="430" width="145" height="72" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="312" y="474" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Introduce</text><rect x="415" y="430" width="145" height="72" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="487" y="474" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Grow</text><rect x="590" y="430" width="145" height="72" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="662" y="474" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Mature</text><rect x="765" y="430" width="145" height="72" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="837" y="474" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Decline</text><rect x="940" y="430" width="145" height="72" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="1012" y="474" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Support</text><path d="M80 390 C 220 360, 280 230, 430 190 S 720 190, 850 300 S 980 410, 1060 430" fill="none" stroke="#0B7189" stroke-width="6"/><path d="M120 430 C 330 430, 390 380, 520 330 S 760 270, 880 330 S 1000 390, 1080 390" fill="none" stroke="#C98516" stroke-width="6" stroke-dasharray="12 8"/><text x="250" y="155" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#0B7189">Forward activity</text><text x="700" y="265" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#C98516">Reverse activity</text><text x="580" y="570" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#17324D"><tspan x="580" dy="0">Design for returnability before launch; plan continued support</tspan><tspan x="580" dy="26">after forward sales decline</tspan></text></svg>