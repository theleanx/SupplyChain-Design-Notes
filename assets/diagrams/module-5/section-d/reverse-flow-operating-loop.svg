<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Reverse flow operating loop</title><desc id="desc">Five-stage reverse logistics operating loop from authorization through learning.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#17324D">Reverse Flow Operating Loop</text><text x="580" y="92" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#17324D"><tspan x="580" dy="0">Authorize → Move → Triage → Recover → Learn</tspan></text><rect x="80" y="260" width="150" height="110" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="155" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#17324D"><tspan x="155" dy="0">Return</tspan><tspan x="155" dy="27">authorize</tspan></text><line x1="230" y1="315" x2="300" y2="315" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="300" y="260" width="150" height="110" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="375" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#17324D"><tspan x="375" dy="0">Collect &amp;</tspan><tspan x="375" dy="27">transport</tspan></text><line x1="450" y1="315" x2="520" y2="315" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="520" y="260" width="150" height="110" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="595" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#17324D"><tspan x="595" dy="0">Inspect &amp;</tspan><tspan x="595" dy="27">triage</tspan></text><line x1="670" y1="315" x2="740" y2="315" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="740" y="260" width="150" height="110" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="815" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#17324D"><tspan x="815" dy="0">Disposition &amp;</tspan><tspan x="815" dy="27">settle</tspan></text><line x1="890" y1="315" x2="960" y2="315" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="960" y="260" width="150" height="110" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="1035" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#17324D"><tspan x="1035" dy="0">Feedback to</tspan><tspan x="1035" dy="27">design / policy</tspan></text><line x1="1035" y1="390" x2="155" y2="475" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="120" y="470" width="910" height="85" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="575" y="505" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" fill="#17324D"><tspan x="575" dy="0">Information, cash, material, and compliance evidence remain linked</tspan><tspan x="575" dy="27">until the item reaches an approved final disposition</tspan></text></svg>