<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc"><title id="title">Bias versus random variation</title><desc id="desc">Original side-by-side visual comparing one-direction forecast bias with alternating random forecast errors.</desc><style>
.text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.muted{font-family:Arial,Helvetica,sans-serif;fill:#596579}.small{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.sub{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:8 7}.axis{stroke:#606b7d;stroke-width:2}</style><rect width="980" height="560" fill="white"/><text class="title" x="50" y="45">Bias is directional; random variation can cancel over time</text><rect class="red" x="70" y="95" width="390" height="360" rx="14"/><text class="sub" x="265" y="130" text-anchor="middle">Persistent bias</text><text class="muted" x="265" y="155" text-anchor="middle" font-size="14">Errors mostly point in one direction</text><line x1="120" y1="290" x2="120" y2="374" stroke="#b56f6f" stroke-width="12"/><text class="small" x="120" y="330" text-anchor="middle">P1</text><line x1="172" y1="290" x2="172" y2="346" stroke="#b56f6f" stroke-width="12"/><text class="small" x="172" y="330" text-anchor="middle">P2</text><line x1="224" y1="290" x2="224" y2="402" stroke="#b56f6f" stroke-width="12"/><text class="small" x="224" y="330" text-anchor="middle">P3</text><line x1="276" y1="290" x2="276" y2="318" stroke="#b56f6f" stroke-width="12"/><text class="small" x="276" y="330" text-anchor="middle">P4</text><line x1="328" y1="290" x2="328" y2="346" stroke="#b56f6f" stroke-width="12"/><text class="small" x="328" y="330" text-anchor="middle">P5</text><line x1="380" y1="290" x2="380" y2="374" stroke="#b56f6f" stroke-width="12"/><text class="small" x="380" y="330" text-anchor="middle">P6</text><text class="muted" x="265" y="405" text-anchor="middle" font-size="14">Cumulative error keeps drifting</text><rect class="green" x="520" y="95" width="390" height="360" rx="14"/><text class="sub" x="715" y="130" text-anchor="middle">Random variation</text><text class="muted" x="715" y="155" text-anchor="middle" font-size="14">Positive and negative misses balance</text><line x1="570" y1="290" x2="570" y2="374" stroke="#649b8a" stroke-width="12"/><text class="small" x="570" y="330" text-anchor="middle">P1</text><line x1="622" y1="290" x2="622" y2="234" stroke="#649b8a" stroke-width="12"/><text class="small" x="622" y="330" text-anchor="middle">P2</text><line x1="674" y1="290" x2="674" y2="346" stroke="#649b8a" stroke-width="12"/><text class="small" x="674" y="330" text-anchor="middle">P3</text><line x1="726" y1="290" x2="726" y2="206" stroke="#649b8a" stroke-width="12"/><text class="small" x="726" y="330" text-anchor="middle">P4</text><line x1="778" y1="290" x2="778" y2="318" stroke="#649b8a" stroke-width="12"/><text class="small" x="778" y="330" text-anchor="middle">P5</text><line x1="830" y1="290" x2="830" y2="262" stroke="#649b8a" stroke-width="12"/><text class="small" x="830" y="330" text-anchor="middle">P6</text><text class="muted" x="715" y="405" text-anchor="middle" font-size="14">Net error can approach zero even with misses</text></svg>