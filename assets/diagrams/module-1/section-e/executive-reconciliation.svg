<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Executive Reconciliation</title><desc id="desc">Original executive S&amp;OP reconciliation diagram connecting demand, supply, finance, pre-S&amp;OP, and executive decisions.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">Reconciliation turns functional alternatives into enterprise decisions</text>
<rect class="blue" x="70" y="105" width="260" height="110" rx="12"/><text class="h" x="200" y="140" text-anchor="middle">Demand plan</text><text class="s" x="200" y="165" text-anchor="middle">volume • mix • opportunities</text><text class="s" x="200" y="188" text-anchor="middle">commercial actions</text>
<rect class="green" x="420" y="105" width="260" height="110" rx="12"/><text class="h" x="550" y="140" text-anchor="middle">Supply alternatives</text><text class="s" x="550" y="165" text-anchor="middle">capacity • inventory • backlog</text><text class="s" x="550" y="188" text-anchor="middle">risks • costs</text>
<rect class="gold" x="770" y="105" width="260" height="110" rx="12"/><text class="h" x="900" y="140" text-anchor="middle">Financial view</text><text class="s" x="900" y="165" text-anchor="middle">revenue • margin • cash</text><text class="s" x="900" y="188" text-anchor="middle">capital • business-plan fit</text>
<path class="line" d="M200 215V285H550 M550 215V285 M900 215V285H550"/>
<rect class="purple" x="360" y="285" width="380" height="105" rx="14"/><text class="h" x="550" y="325" text-anchor="middle">Pre-S&amp;OP</text><text class="s" x="550" y="352" text-anchor="middle">resolve what can be resolved</text><text class="s" x="550" y="375" text-anchor="middle">frame choices needing executive authority</text>
<path class="line" d="M550 390V455"/><rect class="red" x="360" y="455" width="380" height="105" rx="14"/><text class="h" x="550" y="495" text-anchor="middle">Executive S&amp;OP</text><text class="s" x="550" y="522" text-anchor="middle">approve plan • assign actions • communicate</text><text class="s" x="550" y="545" text-anchor="middle">one enterprise direction</text>
</svg>
