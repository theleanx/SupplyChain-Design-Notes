s-serif" font-size="20" fill="#17324d">Exception queue</text><text x="580.0" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">hold / query / correction</text><rect x="850" y="380" width="250" height="105" rx="14" fill="#e9f6ec" stroke="#0b7189" stroke-width="2"/><text x="975.0" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Release + archive</text><text x="975.0" y="463" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">evidence retained</text><line x1="310" y1="432" x2="455" y2="432" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="705" y1="432" x2="850" y2="432" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/>
