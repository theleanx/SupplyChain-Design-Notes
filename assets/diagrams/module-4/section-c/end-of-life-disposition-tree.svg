<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">End-of-Life, Obsolescence, Returns, and Disposition</title><desc id="desc">Original decision visual for end-of-life, obsolescence, returns, and disposition, using fictional Pinehaven Motion Systems data where applicable.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F9FBFD"/><stop offset="1" stop-color="#EEF5F7"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B7184"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B7189"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102A43}.titleSm{font-size:23px;font-weight:700;fill:#102A43}.titleXs{font-size:19px;font-weight:700;fill:#102A43}.subtitleSm{font-size:12px;fill:#5B7184}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.1px;fill:#0B7189}.subtitle{font-size:16px;fill:#5B7184}.h{font-size:20px;font-weight:700;fill:#17324D}.body{font-size:16px;fill:#17324D}.small{font-size:13px;fill:#5B7184}.tiny{font-size:11px;fill:#5B7184}.metric{font-size:26px;font-weight:700;fill:#0B7189}.white{fill:#fff}.axis{stroke:#5B7184;stroke-width:2}.grid{stroke:#D4E0E8;stroke-width:1}.arrow{stroke:#5B7184;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrowt{stroke:#0B7189;stroke-width:3;fill:none;marker-end:url(#arrowTeal)}
</style>
<rect width="1200" height="720" rx="22" fill="url(#bg)"/>
<text x="55" y="42" class="eyebrow" text-anchor="start"><tspan x="55" y="42">MODULE 4 · INTERNAL OPERATIONS &amp; INVENTORY</tspan></text>
<text x="55" y="82" class="title" text-anchor="start"><tspan x="55" y="82">End-of-Life, Obsolescence, Returns, and Disposition</tspan></text>
<text x="55" y="111" class="subtitleSm" text-anchor="start"><tspan x="55" y="111">Original decision visual for end-of-life, obsolescence, returns, and disposition, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
<text x="55" y="150" class="h" text-anchor="start"><tspan x="55" y="150">Disposition starts with non-negotiable holds, then economics and service</tspan></text>
<rect x="470" y="175" width="260" height="80" rx="14" fill="#EAF4F8" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="470" y="175" width="8" height="80" rx="14" fill="#0B7189" opacity="1"/>
<text x="492" y="206" class="h" text-anchor="start"><tspan x="492" y="206">Returned / EOL material</tspan></text>
<text x="492" y="235" class="small" text-anchor="start"><tspan x="492" y="235">Assess identity + condition</tspan></text>
<rect x="470" y="315" width="260" height="80" rx="14" fill="#FCE9EB" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="470" y="315" width="8" height="80" rx="14" fill="#B84A52" opacity="1"/>
<text x="492" y="346" class="h" text-anchor="start"><tspan x="492" y="346">Safety / regulatory hold?</tspan></text>
<line x1="600" y1="255" x2="600" y2="315" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="80" y="470" width="210" height="85" rx="14" fill="#FCE9EB" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="80" y="470" width="8" height="85" rx="14" fill="#B84A52" opacity="1"/>
<text x="102" y="501" class="h" text-anchor="start"><tspan x="102" y="501">Quarantine</tspan></text>
<text x="102" y="530" class="small" text-anchor="start"><tspan x="102" y="530">investigate</tspan></text>
<rect x="335" y="470" width="210" height="85" rx="14" fill="#E8F5EF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="335" y="470" width="8" height="85" rx="14" fill="#2F7D65" opacity="1"/>
<text x="357" y="501" class="h" text-anchor="start"><tspan x="357" y="501">Repair / refurbish</tspan></text>
<text x="357" y="530" class="small" text-anchor="start"><tspan x="357" y="530">service value</tspan></text>
<rect x="590" y="470" width="210" height="85" rx="14" fill="#EAF4F8" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="590" y="470" width="8" height="85" rx="14" fill="#3A7CA5" opacity="1"/>
<text x="612" y="501" class="h" text-anchor="start"><tspan x="612" y="501">Return supplier</tspan></text>
<text x="612" y="530" class="small" text-anchor="start"><tspan x="612" y="530">recover value</tspan></text>
<rect x="845" y="470" width="210" height="85" rx="14" fill="#FFF4D8" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="845" y="470" width="8" height="85" rx="14" fill="#C98516" opacity="1"/>
<text x="867" y="501" class="h" text-anchor="start"><tspan x="867" y="501">Recycle / dispose</tspan></text>
<text x="867" y="530" class="small" text-anchor="start"><tspan x="867" y="530">approved route</tspan></text>
<line x1="470" y1="355" x2="185" y2="470" stroke="#5B7184" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="600" y1="395" x2="440" y2="470" stroke="#5B7184" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="650" y1="395" x2="695" y2="470" stroke="#5B7184" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="730" y1="355" x2="950" y2="470" stroke="#5B7184" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="635" class="h" text-anchor="middle"><tspan x="600" y="635">A mandatory hold overrides the financially attractive option.</tspan></text>
</svg>