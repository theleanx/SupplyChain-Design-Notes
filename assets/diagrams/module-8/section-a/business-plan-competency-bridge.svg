<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Business plan: contribution after dedicated support</title><desc id="desc">Fictional annual business bridge: 420000 incremental revenue minus 250000 variable expense minus 92000 engineering support minus 24000 technology support leaves 54000 operating contribution.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff"/><rect x="0" y="0" width="1000" height="101" rx="0" fill="#173e55"/><text x="32" y="42" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Optimization and Strategy</text><text x="32" y="77" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff">Business plan: contribution after dedicated support</text><text x="55" y="151" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193d51" font-weight="700">Incremental annual business-plan bridge (USD)</text><rect x="55" y="197" width="169" height="186" rx="12" fill="#dcecf9"/><text x="140" y="238" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#1a455d" font-weight="700">Revenue</text><text x="140" y="301" font-size="27" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#24684f" font-weight="700">+420k</text><rect x="240" y="197" width="169" height="186" rx="12" fill="#fae7df"/><text x="325" y="238" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#1a455d" font-weight="700">Variable cost</text><text x="325" y="301" font-size="27" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#99503f" font-weight="700">−250k</text><rect x="425" y="197" width="169" height="186" rx="12" fill="#fae7df"/><text x="510" y="238" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#1a455d" font-weight="700">Engineering</text><text x="510" y="301" font-size="27" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#99503f" font-weight="700">−92k</text><rect x="610" y="197" width="169" height="186" rx="12" fill="#fae7df"/><text x="695" y="238" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#1a455d" font-weight="700">Technology</text><text x="695" y="301" font-size="27" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#99503f" font-weight="700">−24k</text><rect x="795" y="197" width="169" height="186" rx="12" fill="#ddefe5"/><text x="880" y="238" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#1a455d" font-weight="700">Net contribution</text><text x="880" y="301" font-size="27" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#24684f" font-weight="700">+$54k</text><text x="500" y="449" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#215d73" font-weight="700">420 − 250 − 92 − 24 = 54 (thousand USD/year)</text><text x="500" y="504" font-size="18" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#a04f3e">Not NPV: cash timing, working capital, taxes and adoption are excluded</text><line x1="32" y1="560" x2="968" y2="560" stroke="#bdcdd7" stroke-width="2"/><text x="500" y="585" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#557083">AlderGate Motion Products · fictional scope and calculations</text></svg>