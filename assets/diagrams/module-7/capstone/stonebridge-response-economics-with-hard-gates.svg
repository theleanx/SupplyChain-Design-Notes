<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="765" viewBox="0 0 1280 765" role="img" aria-labelledby="title desc">
<title id="title">Stonebridge annual response expected cost with mandatory gates</title>
<desc id="desc">Comparison of four fictional annual expected costs: hardening $28,600 eligible, failover $37,700 technical pass but budget exception, baseline $46,800 fails security, insurance-only nominal $23,400 fails security and coverage. A 10 percent security limit binds before 12.14 percent economic crossover.</desc>
<rect width="1280" height="765" fill="white"/>
<text x="50" y="58" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">Stonebridge | annual risk-response economics</text>
<text x="50" y="92" font-size="17" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#536c7c" text-anchor="start">Modeled access-control event, USD/year. Eligibility gates apply BEFORE ranking.</text>
<text x="53" y="161" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">BASE: untreated</text>
<text x="53" y="188" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#526779" text-anchor="start">Security gate FAIL</text>
<rect x="410" y="139" width="680" height="47" rx="8" fill="#eff3f5"/>
<rect x="410" y="139" width="636" height="47" rx="8" fill="#b6bdc5"/>
<text x="1114" y="171" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">$46,800</text>
<text x="410" y="215" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#566f81" text-anchor="start">Reference, not a permissible choice</text>
<text x="53" y="276" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">PATCH: hardening</text>
<text x="53" y="303" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#526779" text-anchor="start">Security PASS | budget staged</text>
<rect x="410" y="254" width="680" height="47" rx="8" fill="#eff3f5"/>
<rect x="410" y="254" width="389" height="47" rx="8" fill="#138775"/>
<text x="1114" y="286" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">$28,600</text>
<text x="410" y="330" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#566f81" text-anchor="start">Preferred conditional option</text>
<text x="53" y="391" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">FAILOVER: isolation</text>
<text x="53" y="418" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#526779" text-anchor="start">Technical PASS | budget exception</text>
<rect x="410" y="369" width="680" height="47" rx="8" fill="#eff3f5"/>
<rect x="410" y="369" width="513" height="47" rx="8" fill="#e0ad46"/>
<text x="1114" y="401" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">$37,700</text>
<text x="410" y="445" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#566f81" text-anchor="start">Not authorized within the $25k cap</text>
<text x="53" y="506" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">INSURE: nominal only</text>
<text x="53" y="533" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#526779" text-anchor="start">Security + coverage FAIL</text>
<rect x="410" y="484" width="680" height="47" rx="8" fill="#eff3f5"/>
<rect x="410" y="484" width="318" height="47" rx="8" fill="#d68488"/>
<text x="1114" y="516" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">$23,400</text>
<text x="410" y="560" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#566f81" text-anchor="start">Claim exclusion means nominal cost is not a valid protected outcome</text>
<rect x="50" y="626" width="1180" height="92" rx="14" fill="#fdf5df" stroke="#d5b155" stroke-width="2"/>
<text x="80" y="664" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">Security policy: residual probability ≤ 10%</text>
<text x="80" y="695" font-size="18" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#495f71" text-anchor="start">Pure cost crossover at 12.14% is NOT the permission threshold. At 17% PATCH fails.</text>
<text x="52" y="750" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#536c7c" text-anchor="start">Illustrative risk case; only approved and verified controls can be put into service.</text>
</svg>