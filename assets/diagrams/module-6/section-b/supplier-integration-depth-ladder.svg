<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Supplier integration depth ladder</title><desc id="desc">A ladder shows increasing collaboration depth from remote coordination through co-location and integrated teams, with rising governance needs.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Supplier integration depth ladder</text><rect x="150" y="500" width="165" height="85" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="232.5" y="524.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="232.5" dy="0">Remote</tspan><tspan x="232.5" dy="20">transaction</tspan></text><text x="232.5" y="576.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="232.5" dy="0">low proximity</tspan></text><line x1="315" y1="542" x2="325" y2="467" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="425" width="165" height="85" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="407.5" y="451.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="407.5" dy="0">Shared planning</tspan></text><text x="407.5" y="483.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="407.5" dy="0">planned information</tspan><tspan x="407.5" dy="16">exchange</tspan></text><line x1="490" y1="467" x2="500" y2="392" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="350" width="165" height="85" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="582.5" y="376.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="582.5" dy="0">Embedded liaison</tspan></text><text x="582.5" y="408.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="582.5" dy="0">named boundary</tspan><tspan x="582.5" dy="16">spanners</tspan></text><line x1="665" y1="392" x2="675" y2="317" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="675" y="275" width="165" height="85" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="757.5" y="309.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="757.5" dy="0">Co-located team</tspan></text><text x="757.5" y="341.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="757.5" dy="0">faster coordination</tspan></text><line x1="840" y1="317" x2="850" y2="242" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="200" width="165" height="85" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="932.5" y="206.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="932.5" dy="0">Integrated</tspan><tspan x="932.5" dy="20">cross-company</tspan><tspan x="932.5" dy="20">team</tspan></text><text x="932.5" y="278.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="932.5" dy="0">highest knowledge</tspan><tspan x="932.5" dy="16">sharing</tspan></text><text x="1050" y="125" text-anchor="end" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b56b00">Higher integration + governance</text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Deeper proximity can accelerate coordination but increases dependency, information sharing, and governance needs.</text></svg>
