<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">CRM priorities across the product/service life cycle</title><desc id="desc">CRM priorities change across introduction, growth, maturity, and decline without reteaching the underlying product-life-cycle model.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">CRM priorities across the product/service life cycle</text><line x1="120" y1="280" x2="1040" y2="280" stroke="#0b7189" stroke-width="5"/><circle cx="120.0" cy="280" r="34" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="120.0" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d"><tspan x="120.0" dy="0">Introduction</tspan></text><text x="120.0" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="120.0" dy="0">learn needs +</tspan><tspan x="120.0" dy="19">onboard</tspan></text><circle cx="426.6666666666667" cy="280" r="34" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="426.6666666666667" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d"><tspan x="426.6666666666667" dy="0">Growth</tspan></text><text x="426.6666666666667" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="426.6666666666667" dy="0">scale service +</tspan><tspan x="426.6666666666667" dy="19">retain</tspan></text><circle cx="733.3333333333334" cy="280" r="34" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="733.3333333333334" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d"><tspan x="733.3333333333334" dy="0">Maturity</tspan></text><text x="733.3333333333334" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="733.3333333333334" dy="0">differentiate +</tspan><tspan x="733.3333333333334" dy="19">deepen</tspan></text><circle cx="1040.0" cy="280" r="34" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="1040.0" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d"><tspan x="1040.0" dy="0">Decline</tspan></text><text x="1040.0" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="1040.0" dy="0">manage expectations</tspan><tspan x="1040.0" dy="19">+ installed base</tspan></text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Use Module 1 for life-cycle mechanics; Module 6 changes only the relationship priorities by stage.</text></svg>
