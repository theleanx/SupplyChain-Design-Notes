<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Technology investment value chain</title>
  <desc id="desc">Technology capability enables process adoption, operational outcomes, financial effects, and measured benefit realization, with assumptions shown below.</desc>
  <rect width="960" height="400" rx="24" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Technology value depends on operating change</text>
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    <rect x="40" y="105" width="160" height="78" rx="12" fill="#0f766e"/><text x="120" y="136" fill="white">Technology</text><text x="120" y="159" fill="white">capability</text>
    <rect x="230" y="105" width="160" height="78" rx="12" fill="#0369a1"/><text x="310" y="136" fill="white">Process and</text><text x="310" y="159" fill="white">adoption change</text>
    <rect x="420" y="105" width="160" height="78" rx="12" fill="#1d4ed8"/><text x="500" y="136" fill="white">Operational</text><text x="500" y="159" fill="white">outcome</text>
    <rect x="610" y="105" width="160" height="78" rx="12" fill="#7c3aed"/><text x="690" y="136" fill="white">Financial or</text><text x="690" y="159" fill="white">risk effect</text>
    <rect x="800" y="105" width="120" height="78" rx="12" fill="#be123c"/><text x="860" y="136" fill="white">Measured</text><text x="860" y="159" fill="white">realization</text>
  </g>
  <g stroke="#475569" stroke-width="4" marker-end="url(#arrow)"><path d="M200 144 H223"/><path d="M390 144 H413"/><path d="M580 144 H603"/><path d="M770 144 H793"/></g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <g font-family="Arial, sans-serif" font-size="15" fill="#334155">
    <rect x="90" y="245" width="780" height="95" rx="14" fill="#e2e8f0"/>
    <text x="120" y="278">Value assumptions:</text>
    <text x="275" y="278">adoption</text><text x="375" y="278">volume</text><text x="470" y="278">timing</text><text x="560" y="278">data quality</text><text x="690" y="278">owner action</text><text x="790" y="278">baseline</text>
    <text x="480" y="318" text-anchor="middle">Sensitivity testing reveals which assumption can break the case.</text>
  </g>
</svg>
