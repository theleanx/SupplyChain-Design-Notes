<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">CRM process and ownership model</title><desc id="desc">A governed CRM operating model assigns evidence, decision ownership, execution, monitoring, and feedback across functions.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">CRM process and ownership model</text><rect x="100" y="135" width="960" height="100" fill="#eaf4f8" stroke="#c9d6df" stroke-width="1"/><rect x="100" y="135" width="180" height="100" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="190" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="190" dy="0">Customer-facing</tspan></text><rect x="350" y="153" width="250" height="64" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="475.0" y="191.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="475.0" dy="0">capture interaction</tspan></text><line x1="820" y1="185" x2="820" y2="242" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="240" width="960" height="100" fill="#fff4d8" stroke="#c9d6df" stroke-width="1"/><rect x="100" y="240" width="180" height="100" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="190" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="190" dy="0">CRM / commercial</tspan></text><rect x="350" y="258" width="250" height="64" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="475.0" y="296.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="475.0" dy="0">segment + choose action</tspan></text><line x1="820" y1="290" x2="820" y2="347" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="345" width="960" height="100" fill="#f2eefb" stroke="#c9d6df" stroke-width="1"/><rect x="100" y="345" width="180" height="100" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="190" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="190" dy="0">Operations +</tspan><tspan x="190" dy="21">supply</tspan></text><rect x="350" y="363" width="250" height="64" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="475.0" y="390.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="475.0" dy="0">fulfill promise /</tspan><tspan x="475.0" dy="21">resolve issue</tspan></text><line x1="820" y1="395" x2="820" y2="452" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="100" y="450" width="960" height="100" fill="#edf6ed" stroke="#c9d6df" stroke-width="1"/><rect x="100" y="450" width="180" height="100" fill="#ffffff" stroke="#c9d6df" stroke-width="1"/><text x="190" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="190" dy="0">Governance</tspan></text><rect x="350" y="468" width="250" height="64" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="475.0" y="506.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="475.0" dy="0">monitor + improve</tspan></text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Process ownership—not software ownership—keeps customer evidence tied to action and feedback.</text></svg>
