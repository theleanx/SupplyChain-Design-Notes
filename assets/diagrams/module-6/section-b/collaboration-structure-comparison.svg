<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Collaboration structure comparison</title><desc id="desc">Virtual organizations, strategic alliances, and joint ventures are compared by legal structure, resource integration, and governance intensity.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Collaboration structure comparison</text><rect x="65" y="145" width="300" height="100" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="215.0" y="179.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="215.0" dy="0">Virtual organization</tspan></text><text x="215.0" y="216.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="215.0" dy="0">independent firms / networked</tspan><tspan x="215.0" dy="17">execution</tspan></text><rect x="65" y="300" width="300" height="160" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="215.0" y="371.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="215.0" dy="0">Governance implication</tspan></text><text x="215.0" y="405.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="215.0" dy="0">flexible boundaries</tspan></text><rect x="405" y="145" width="300" height="100" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="555.0" y="179.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="555.0" dy="0">Strategic alliance</tspan></text><text x="555.0" y="216.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="555.0" dy="0">linked processes / shared</tspan><tspan x="555.0" dy="17">goals</tspan></text><rect x="405" y="300" width="300" height="160" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="555.0" y="371.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="555.0" dy="0">Governance implication</tspan></text><text x="555.0" y="405.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="555.0" dy="0">medium-high integration</tspan></text><rect x="745" y="145" width="300" height="100" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="895.0" y="187.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="895.0" dy="0">Joint venture</tspan></text><text x="895.0" y="224.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="895.0" dy="0">separate jointly owned entity</tspan></text><rect x="745" y="300" width="300" height="160" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="895.0" y="362.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="895.0" dy="0">Governance implication</tspan></text><text x="895.0" y="396.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="895.0" dy="0">highest formal structural</tspan><tspan x="895.0" dy="19">commitment</tspan></text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">The structure changes control and coordination; it does not replace the strategic case for collaboration.</text></svg>
