<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Customer value profile to service proposition</title><desc id="desc">Customer needs across reliability, convenience, value, features, and support are translated into a relationship service proposition.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Customer value profile to service proposition</text><polygon points="580.0,220.0 713.1479122813215,316.73762078750735 662.2899353209463,473.26237921249265 497.71006467905374,473.26237921249265 446.8520877186785,316.73762078750735" fill="#eaf4f8" stroke="#0b7189" stroke-width="3"/><circle cx="580" cy="360" r="78" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="580" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d"><tspan x="580" dy="0">Relationship</tspan></text><text x="580" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="580" dy="0">service</tspan><tspan x="580" dy="23">proposition</tspan></text><text x="580.0" y="128.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Reliability</tspan></text><text x="800.6451117804756" y="288.3080573050122" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="800.6451117804756" dy="0">Convenience</tspan></text><text x="716.3661785318537" y="547.6919426949878" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="716.3661785318537" dy="0">Best value</tspan></text><text x="443.63382146814627" y="547.6919426949878" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="443.63382146814627" dy="0">Product / service</tspan><tspan x="443.63382146814627" dy="21">features</tspan></text><text x="359.35488821952436" y="288.3080573050122" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="359.35488821952436" dy="0">Support intensity</tspan></text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">The proposition should match the segment’s value profile—not maximize every service dimension.</text></svg>
