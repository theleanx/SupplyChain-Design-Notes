<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Operations Planning Hierarchy</title><desc id="desc">Original educational hierarchy of operations planning and control, showing strategic direction feeding demand, S&amp;OP, resource planning, master scheduling, MRP, and execution.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">From enterprise direction to executable work</text>
<rect class="purple" x="390" y="80" width="320" height="70" rx="12"/><text class="h" x="550" y="110" text-anchor="middle">Strategic + business direction</text><text class="s" x="550" y="132" text-anchor="middle">market, financial, growth and customer goals</text>
<rect class="blue" x="110" y="205" width="260" height="80" rx="12"/><text class="h" x="240" y="238" text-anchor="middle">Demand planning</text><text class="s" x="240" y="262" text-anchor="middle">forecast + commercial assumptions</text>
<rect class="gold" x="420" y="205" width="260" height="80" rx="12"/><text class="h" x="550" y="238" text-anchor="middle">S&amp;OP / production plan</text><text class="s" x="550" y="262" text-anchor="middle">family-level consensus</text>
<rect class="green" x="730" y="205" width="260" height="80" rx="12"/><text class="h" x="860" y="238" text-anchor="middle">Resource planning</text><text class="s" x="860" y="262" text-anchor="middle">long-lead capacity</text>
<rect class="blue" x="420" y="345" width="260" height="70" rx="12"/><text class="h" x="550" y="375" text-anchor="middle">Master scheduling</text><text class="s" x="550" y="397" text-anchor="middle">items/modules and timing</text>
<rect class="blue" x="420" y="465" width="260" height="70" rx="12"/><text class="h" x="550" y="495" text-anchor="middle">MRP + purchasing</text><text class="s" x="550" y="517" text-anchor="middle">components and materials</text>
<rect class="red" x="420" y="565" width="260" height="60" rx="12"/><text class="h" x="550" y="600" text-anchor="middle">Execution</text>
<path class="line" d="M550 150V205 M370 245H420 M680 245H730 M550 285V345 M550 415V465 M550 535V565"/><text class="s" x="70" y="610">Planning becomes more detailed as the decision point gets closer.</text>
</svg>
