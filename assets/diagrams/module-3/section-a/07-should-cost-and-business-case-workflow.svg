  </text>
  <text x="1090.5" y="615" class="small" text-anchor="middle">
    <tspan x="1090.5" y="615">Should cost</tspan>
  </text>
  <text x="80" y="160" class="label" text-anchor="start">
    <tspan x="80" y="160">Should-cost bridge</tspan>
  </text>
  <text x="80" y="190" class="body" text-anchor="start">
    <tspan x="80" y="190">Build from transparent cost drivers; negotiate the</tspan>
    <tspan x="80" y="213">assumptions, not only the final price.</tspan>
