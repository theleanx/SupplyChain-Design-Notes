  </text>
  <text x="631.5" y="615" class="small" text-anchor="middle">
    <tspan x="631.5" y="615">Logistics</tspan>
  </text>
  <line x1="694" y1="268.0" x2="722" y2="268.0" stroke="#587d96" stroke-width="2" stroke-dasharray="5 5" />
  <rect x="722" y="244.0" width="125" height="24.0" rx="6" fill="#2a9d8f" />
