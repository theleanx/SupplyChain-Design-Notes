<text x="328" y="616" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">IT + inventory</text>
<text x="328" y="643" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#435869" text-anchor="start">validated data</text>
<line x1="550" y1="607" x2="570" y2="607" stroke="#6d7d89" stroke-width="3" marker-end="url(#a)"/>
<rect x="570" y="552" width="237" height="111" rx="14" fill="#eaf5f1" stroke="#40987b" stroke-width="2"/>
<text x="586" y="579" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#3a9c7a" text-anchor="start">03</text>
<text x="586" y="616" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">Materials + test</text>
<text x="586" y="643" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#435869" text-anchor="start">Quality release</text>
<line x1="808" y1="607" x2="828" y2="607" stroke="#6d7d89" stroke-width="3" marker-end="url(#a)"/>
<rect x="828" y="552" width="237" height="111" rx="14" fill="#eaf5f1" stroke="#40987b" stroke-width="2"/>
