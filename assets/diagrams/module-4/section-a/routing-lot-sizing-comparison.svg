<text x="682" y="465" class="small" text-anchor="start"><tspan x="682" y="465">Order a preset quantity or multiple. Fewer</tspan><tspan x="682" y="483">orders · possible residual stock</tspan></text>
<text x="600" y="610" class="small" text-anchor="middle"><tspan x="600" y="610">Choose the rule after demand pattern, setup/order cost, and constraints are known.</tspan></text>
