<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Assurance terms are not interchangeable</title><desc id="desc">Three separate cards label ISO 26000 as guidance not certifiable, SA8000 2026 as a social accountability certification standard, and ANSI ASSP Z10 as occupational safety management.</desc><rect x="0" y="0" width="1000" height="100" fill="#173d55" stroke="#173d55" stroke-width="2" rx="0"/><text x="35" y="45" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="26" font-weight="700">CSCP Module 8 · Section B</text><text x="35" y="79" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="23" font-weight="400">Assurance terms are not interchangeable</text><g><rect x="34" y="181" width="306" height="246" fill="#e7f1fa" stroke="#245f77" stroke-width="2" rx="15"/><text x="187" y="239" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="25" font-weight="700">ISO 26000</text><text x="187" y="300" fill="#1e6170" font-family="Arial, sans-serif" text-anchor="middle" font-size="25" font-weight="700">GUIDANCE</text><text x="187" y="361" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="400">Not certifiable</text><rect x="360" y="181" width="306" height="246" fill="#e5f4e6" stroke="#245f77" stroke-width="2" rx="15"/><text x="513" y="239" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="25" font-weight="700">SA8000:2026</text><text x="513" y="300" fill="#1e6170" font-family="Arial, sans-serif" text-anchor="middle" font-size="25" font-weight="700">CERTIFIABLE</text><text x="513" y="361" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="400">Review transition</text><rect x="686" y="181" width="306" height="246" fill="#fbefdf" stroke="#245f77" stroke-width="2" rx="15"/><text x="839" y="239" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="25" font-weight="700">ANSI/ASSP Z10</text><text x="839" y="300" fill="#1e6170" font-family="Arial, sans-serif" text-anchor="middle" font-size="25" font-weight="700">OH&amp;S SYSTEM</text><text x="839" y="361" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="400">Verify scope</text><text x="500" y="497" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="21" font-weight="400">Accreditation verifies assessment-body competence</text></g></svg>