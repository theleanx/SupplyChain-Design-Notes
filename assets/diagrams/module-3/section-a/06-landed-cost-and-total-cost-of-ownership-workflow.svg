<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Landed Cost and Total Cost of Ownership</title>
  <desc id="desc">Look beyond unit price to the cost created across the relationship lifecycle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">COST EXPOSURE STACK</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Landed Cost and Total Cost of Ownership</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Look beyond unit price to the cost created across the relationship lifecycle.</tspan>
  </text>
  <rect x="330" y="170" width="480" height="68" rx="10" fill="#176b87" />
  <text x="348" y="197" class="barlabel" text-anchor="start">
    <tspan x="348" y="197">Unit price</tspan>
  </text>
  <text x="835" y="209" class="metric" text-anchor="start">
    <tspan x="835" y="209">42%</tspan>
  </text>
  <text x="915" y="209" class="small" text-anchor="start">
    <tspan x="915" y="209">Quoted purchase value</tspan>
  </text>
  <rect x="330" y="252" width="320" height="68" rx="10" fill="#2a9d8f" />
  <text x="348" y="279" class="barlabel" text-anchor="start">
    <tspan x="348" y="279">Logistics and duties</tspan>
  </text>
  <text x="835" y="291" class="metric" text-anchor="start">
    <tspan x="835" y="291">18%</tspan>
  </text>
  <text x="915" y="291" class="small" text-anchor="start">
    <tspan x="915" y="291">Freight, handling, tariff</tspan>
  </text>
  <rect x="330" y="334" width="300" height="68" rx="10" fill="#e9b949" />
  <text x="348" y="361" class="barlabel" text-anchor="start">
    <tspan x="348" y="361">Inventory and working</tspan>
    <tspan x="348" y="384">capital</tspan>
  </text>
  <text x="835" y="373" class="metric" text-anchor="start">
    <tspan x="835" y="373">15%</tspan>
  </text>
  <text x="915" y="373" class="small" text-anchor="start">
    <tspan x="915" y="373">Pipeline and buffers</tspan>
  </text>
  <rect x="330" y="416" width="293" height="68" rx="10" fill="#e76f51" />
  <text x="348" y="443" class="barlabel" text-anchor="start">
    <tspan x="348" y="443">Quality and disruption</tspan>
  </text>
  <text x="835" y="455" class="metric" text-anchor="start">
    <tspan x="835" y="455">14%</tspan>
  </text>
  <text x="915" y="455" class="small" text-anchor="start">
    <tspan x="915" y="455">Failure and recovery</tspan>
  </text>
  <rect x="330" y="498" width="273" height="68" rx="10" fill="#486581" />
  <text x="348" y="525" class="barlabel" text-anchor="start">
    <tspan x="348" y="525">Lifecycle and exit</tspan>
  </text>
  <text x="835" y="537" class="metric" text-anchor="start">
    <tspan x="835" y="537">11%</tspan>
  </text>
  <text x="915" y="537" class="small" text-anchor="start">
    <tspan x="915" y="537">Change, disposal,</tspan>
    <tspan x="915" y="560">switching</tspan>
  </text>
  <text x="100" y="210" class="label" text-anchor="start">
    <tspan x="100" y="210">Visible price</tspan>
  </text>
  <path d="M190 230 V555" class="arrow" />
  <text x="100" y="600" class="label" text-anchor="start">
    <tspan x="100" y="600">Full economic</tspan>
    <tspan x="100" y="623">exposure</tspan>
  </text>
</svg>
