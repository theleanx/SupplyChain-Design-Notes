<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Contact-channel strategy: cost versus relationship richness</title><desc id="desc">A contact-channel spectrum compares self-service, digital, assisted, and high-touch models by cost-to-serve and relationship richness.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Contact-channel strategy: cost versus relationship richness</text><line x1="120" y1="300" x2="1040" y2="300" stroke="#0b7189" stroke-width="5"/><circle cx="120.0" cy="300" r="32" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="120.0" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="120.0" dy="0">Self-service</tspan></text><text x="120.0" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="120.0" dy="0">lowest routine</tspan><tspan x="120.0" dy="19">cost</tspan></text><circle cx="426.6666666666667" cy="300" r="32" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="426.6666666666667" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="426.6666666666667" dy="0">Digital assisted</tspan></text><text x="426.6666666666667" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="426.6666666666667" dy="0">scaled support</tspan></text><circle cx="733.3333333333334" cy="300" r="32" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="733.3333333333334" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="733.3333333333334" dy="0">Call / chat</tspan><tspan x="733.3333333333334" dy="23">center</tspan></text><text x="733.3333333333334" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="733.3333333333334" dy="0">responsive human</tspan><tspan x="733.3333333333334" dy="19">help</tspan></text><circle cx="1040.0" cy="300" r="32" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="1040.0" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="1040.0" dy="0">Account team /</tspan><tspan x="1040.0" dy="23">high touch</tspan></text><text x="1040.0" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="1040.0" dy="0">highest</tspan><tspan x="1040.0" dy="19">relationship depth</tspan></text><text x="120" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#3f7d5a">Lower routine cost</text><text x="1040" y="520" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b56b00">Greater relationship richness</text><line x1="260" y1="510" x2="900" y2="510" stroke="#6d7e8e" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Choose the least costly channel that still meets the segment’s relationship and service need.</text></svg>
