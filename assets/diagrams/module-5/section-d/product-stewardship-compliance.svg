<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Product stewardship compliance</title><desc id="desc">Life-cycle control model from product design through end-of-life take-back and recovery.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17324D">Product Stewardship: Design → Market → Take-Back</text><rect x="45" y="190" width="235" height="235" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="162" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17324D">DESIGN</text><text x="162" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#17324D"><tspan x="162" dy="0">material</tspan><tspan x="162" dy="24">restrictions</tspan></text><text x="162" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#17324D"><tspan x="162" dy="0">repairability /</tspan><tspan x="162" dy="24">disassembly</tspan></text><line x1="280" y1="305" x2="315" y2="305" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="323" y="190" width="235" height="235" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="440" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17324D">PLACE ON MARKET</text><text x="440" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#17324D"><tspan x="440" dy="0">scope / declarations</tspan></text><text x="440" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#17324D"><tspan x="440" dy="0">country obligations</tspan></text><line x1="558" y1="305" x2="593" y2="305" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="601" y="190" width="235" height="235" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="718" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17324D">USE &amp; SERVICE</text><text x="718" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#17324D"><tspan x="718" dy="0">parts / upgrades</tspan></text><text x="718" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#17324D"><tspan x="718" dy="0">return channels</tspan></text><line x1="836" y1="305" x2="871" y2="305" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="879" y="190" width="235" height="235" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="996" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#17324D">END OF LIFE</text><text x="996" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#17324D"><tspan x="996" dy="0">collection /</tspan><tspan x="996" dy="24">treatment</tspan></text><text x="996" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#17324D"><tspan x="996" dy="0">records / recovery</tspan></text><rect x="220" y="510" width="720" height="85" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="580" y="545" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#17324D"><tspan x="580" dy="0">WEEE / RoHS / e-waste rules are jurisdiction-specific.</tspan><tspan x="580" dy="26">Maintain a current applicability and evidence register.</tspan></text></svg>