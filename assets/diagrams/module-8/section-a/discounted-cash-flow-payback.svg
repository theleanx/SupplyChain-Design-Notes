<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Investment: nominal payback versus discounted value</title><desc id="desc">Illustrative 180000 time zero investment; 50000 year-end cash savings in years 1 to 5; discount 10 percent. Simple payback 3.60 years, discounted payback about 4.69 and positive NPV about 9539.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff"/><rect x="0" y="0" width="1000" height="101" rx="0" fill="#173e55"/><text x="32" y="42" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Optimization and Strategy</text><text x="32" y="77" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff">Investment: nominal payback versus discounted value</text><text x="59" y="149" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#163d51" font-weight="700">Five year cash flow · 10% discount, year-end receipts</text><rect x="61" y="191" width="880" height="74" rx="12" fill="#f8e7df"/><text x="87" y="237" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#a04b38" font-weight="700">Time 0 · −$180,000 investment</text><rect x="60" y="302" width="166" height="110" rx="12" fill="#e1edf9"/><text x="143" y="337" font-size="20" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#19485c" font-weight="700">Year 1</text><text x="143" y="376" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#276952" font-weight="700">+$50k</text><rect x="242" y="302" width="166" height="110" rx="12" fill="#e6f2e8"/><text x="325" y="337" font-size="20" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#19485c" font-weight="700">Year 2</text><text x="325" y="376" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#2