<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Planning Horizons</title><desc id="desc">Original educational timeline showing overlapping planning horizons for strategy, business planning, S&amp;OP and resource planning.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">Planning horizons overlap, but decisions become more specific</text>
<line x1="110" y1="530" x2="1010" y2="530" stroke="#606b7d" stroke-width="2"/><text class="m" x="110" y="565" font-size="14">Today</text><text class="m" x="985" y="565" font-size="14">Longer horizon</text>
<rect class="purple" x="120" y="95" width="820" height="70" rx="12"/><text class="h" x="150" y="125">Strategic direction</text><text class="s" x="150" y="147">multi-year mission, growth, customer value and financial objectives</text>
<rect class="gold" x="120" y="200" width="650" height="70" rx="12"/><text class="h" x="150" y="230">Business plan</text><text class="s" x="150" y="252">medium/long-term targets, product families, financial outcomes</text>
<rect class="blue" x="120" y="305" width="470" height="70" rx="12"/><text class="h" x="150" y="335">S&amp;OP / production plan</text><text class="s" x="150" y="357">aggregate demand, supply and financial alignment</text>
<rect class="green" x="120" y="410" width="520" height="70" rx="12"/><text class="h" x="150" y="440">Resource planning</text><text class="s" x="150" y="462">long-lead equipment, facilities, people, suppliers and materials</text>
</svg>
