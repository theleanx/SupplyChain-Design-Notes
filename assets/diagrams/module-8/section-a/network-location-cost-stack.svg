<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Regional network: total cost and payback</title><desc id="desc">Central annual network cost 625000 versus regional 575000 gives 50000 modeled annual difference. A separate 180000 time zero launch assumption yields 3.6 year simple payback; feasibility gates remain.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff"/><rect x="0" y="0" width="1000" height="101" rx="0" fill="#173e55"/><text x="32" y="42" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Optimization and Strategy</text><text x="32" y="77" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff">Regional network: total cost and payback</text><text x="55" y="151" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193e51" font-weight="700">Comparable annual network cost</text><text x="60" y="229" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">Central</text><rect x="242" y="198" width="633" height="37" rx="8" fill="#e7eef3"/><rect x="242" y="198" width="633" height="37" rx="8" fill="#8aabc8"/><text x="893" y="228" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="end" fill="#235278" font-weight="700">$625k</text><text x="60" y="329" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">Regional</text><rect x="242" y="299" width="633" height="37" rx="8" fill="#e7eef3"/><rect x="242" y="299" width="582.36" height="37" rx="8" fill="#3b947d"/><text x="893" y="329" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="end" fill="#246c54" font-weight="700">$575k</text><rect x="58" y="393" width="878" height="108" rx="12" fill="#e7f1e9"/><text x="88" y="435" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#236a51" font-weight="700">Modeled recurring saving: $50,000/year</text><text x="88" y="469" font-size="20" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">$180,000 launch ÷ $50,000/year = 3.60 years simple payback</text><line x1="32" y1="560" x2="968" y2="560" stroke="#bdcdd7" stroke-width="2"/><text x="500" y="585" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#557083">AlderGate Motion Products · fictional scope and calculations</text></svg>