<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Circular and Sustainable Design</title>
  <desc id="desc">Design the reverse path together with the forward product flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">CIRCULAR DESIGN LOOP</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Circular and Sustainable Design</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Design the reverse path together with the forward product flow.</tspan>
  </text>
  <path d="M600.0 165.0 Q600.0 385.0 809.2 317.0" class="arrow" />
  <rect x="505" y="110" width="190" height="110" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <circle cx="530" cy="134" r="20" fill="#176b87" />
  <text x="530" y="140" class="label white" text-anchor="middle">
    <tspan x="530" y="140">1</tspan>
  </text>
  <text x="560" y="141" class="label" text-anchor="start">
    <tspan x="560" y="141">Source</tspan>
  </text>
  <text x="525" y="178" class="body" text-anchor="start">
    <tspan x="525" y="178">Responsible</tspan>
    <tspan x="525" y="201">material</tspan>
  </text>
  <path d="M809.2 317.0 Q600.0 385.0 729.3 563.0" class="arrow" />
  <rect x="714" y="262" width="190" height="110" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <circle cx="739" cy="286" r="20" fill="#2a9d8f" />
  <text x="739" y="292" class="label white" text-anchor="middle">
    <tspan x="739" y="292">2</tspan>
  </text>
  <text x="769" y="293" class="label" text-anchor="start">
    <tspan x="769" y="293">Make</tspan>
  </text>
  <text x="734" y="330" class="body" text-anchor="start">
    <tspan x="734" y="330">Efficient</tspan>
    <tspan x="734" y="353">conversion</tspan>
  </text>
  <path d="M729.3 563.0 Q600.0 385.0 470.7 563.0" class="arrow" />
  <rect x="634" y="507" width="190" height="110" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <circle cx="659" cy="531" r="20" fill="#e9b949" />
  <text x="659" y="537" class="label white" text-anchor="middle">
    <tspan x="659" y="537">3</tspan>
  </text>
  <text x="689" y="538" class="label" text-anchor="start">
    <tspan x="689" y="538">Use</tspan>
  </text>
  <text x="654" y="575" class="body" text-anchor="start">
    <tspan x="654" y="575">Durable and</tspan>
    <tspan x="654" y="598">repairable</tspan>
  </text>
  <path d="M470.7 563.0 Q600.0 385.0 390.8 317.0" class="arrow" />
  <rect x="375" y="507" width="190" height="110" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <circle cx="400" cy="531" r="20" fill="#e76f51" />
  <text x="400" y="537" class="label white" text-anchor="middle">
    <tspan x="400" y="537">4</tspan>
  </text>
  <text x="430" y="538" class="label" text-anchor="start">
    <tspan x="430" y="538">Recover</tspan>
  </text>
  <text x="395" y="575" class="body" text-anchor="start">
    <tspan x="395" y="575">Collect and inspect</tspan>
  </text>
  <path d="M390.8 317.0 Q600.0 385.0 600.0 165.0" class="arrow" />
  <rect x="295" y="262" width="190" height="110" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
  <circle cx="320" cy="286" r="20" fill="#486581" />
  <text x="320" y="292" class="label white" text-anchor="middle">
    <tspan x="320" y="292">5</tspan>
  </text>
  <text x="350" y="293" class="label" text-anchor="start">
    <tspan x="350" y="293">Loop</tspan>
  </text>
  <text x="315" y="330" class="body" text-anchor="start">
    <tspan x="315" y="330">Reuse,</tspan>
    <tspan x="315" y="353">remanufacture,</tspan>
    <tspan x="315" y="376">recycle</tspan>
  </text>
  <circle cx="600" cy="385" r="92" fill="#dceef2" stroke="#176b87" stroke-width="3" />
  <text x="600" y="377" class="label" text-anchor="middle">
    <tspan x="600" y="377">Lifecycle value</tspan>
  </text>
</svg>
