<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Single, sole, and multisourcing relationship risk</title><desc id="desc">Three sourcing concentration states are compared by dependency, leverage, continuity exposure, and relationship governance intensity.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Single, sole, and multisourcing relationship risk</text><rect x="65" y="150" width="300" height="100" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="215.0" y="192.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="215.0" dy="0">Single source</tspan></text><text x="215.0" y="229.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="215.0" dy="0">chosen concentration</tspan></text><rect x="65" y="305" width="300" height="160" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="215.0" y="376.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="215.0" dy="0">Relationship implication</tspan></text><text x="215.0" y="410.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="215.0" dy="0">deep governance + contingency</tspan></text><rect x="405" y="150" width="300" height="100" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="555.0" y="192.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="555.0" dy="0">Sole source</tspan></text><text x="555.0" y="229.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="555.0" dy="0">only feasible source</tspan></text><rect x="405" y="305" width="300" height="160" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="555.0" y="376.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="555.0" dy="0">Relationship implication</tspan></text><text x="555.0" y="410.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="555.0" dy="0">highest structural dependency</tspan></text><rect x="745" y="150" width="300" height="100" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="895.0" y="192.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="895.0" dy="0">Multisource</tspan></text><text x="895.0" y="229.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="895.0" dy="0">multiple independent sources</tspan></text><rect x="745" y="305" width="300" height="160" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="895.0" y="376.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="895.0" dy="0">Relationship implication</tspan></text><text x="895.0" y="410.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="895.0" dy="0">coordination + split attention</tspan></text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Concentration changes relationship dependency and contingency needs; it does not by itself determine the award decision.</text></svg>
