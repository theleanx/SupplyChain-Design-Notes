<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Location and Ownership Options</title>
  <desc id="desc">Compare ownership and distance as two separate design choices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">FOOTPRINT SPECTRUM</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Location and Ownership Options</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Compare ownership and distance as two separate design choices.</tspan>
  </text>
  <line x1="110" y1="340" x2="1090" y2="340" stroke="#587d96" stroke-width="14" stroke-linecap="round" />
  <circle cx="140.0" cy="340" r="24" fill="#176b87" stroke="#ffffff" stroke-width="5" />
  <g>
    <rect x="30" y="175" width="220" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="50" y="209" class="label" text-anchor="start">
      <tspan x="50" y="209">Internal/local</tspan>
    </text>
    <text x="50" y="243" class="body" text-anchor="start">
      <tspan x="50" y="243">Highest control</tspan>
    </text>
  </g>
  <line x1="140.0" y1="315" x2="140.0" y2="295" stroke="#587d96" stroke-width="2" />
  <circle cx="446.6666666666667" cy="340" r="24" fill="#2a9d8f" stroke="#ffffff" stroke-width="5" />
  <g>
    <rect x="336" y="430" width="220" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="356" y="464" class="label" text-anchor="start">
      <tspan x="356" y="464">Outsource/local</tspan>
    </text>
    <text x="356" y="498" class="body" text-anchor="start">
      <tspan x="356" y="498">Flexible capacity</tspan>
    </text>
  </g>
  <line x1="446.6666666666667" y1="365" x2="446.6666666666667" y2="430" stroke="#587d96" stroke-width="2" />
  <circle cx="753.3333333333334" cy="340" r="24" fill="#e9b949" stroke="#ffffff" stroke-width="5" />
  <g>
    <rect x="643" y="175" width="220" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="663" y="209" class="label" text-anchor="start">
      <tspan x="663" y="209">Nearshore</tspan>
    </text>
    <text x="663" y="243" class="body" text-anchor="start">
      <tspan x="663" y="243">Balanced response</tspan>
    </text>
  </g>
  <line x1="753.3333333333334" y1="315" x2="753.3333333333334" y2="295" stroke="#587d96" stroke-width="2" />
  <circle cx="1060.0" cy="340" r="24" fill="#e76f51" stroke="#ffffff" stroke-width="5" />
  <g>
    <rect x="950" y="430" width="220" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="970" y="464" class="label" text-anchor="start">
      <tspan x="970" y="464">Offshore</tspan>
    </text>
    <text x="970" y="498" class="body" text-anchor="start">
