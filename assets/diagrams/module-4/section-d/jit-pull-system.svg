<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Just-in-Time Production and Pull Execution</title><desc id="desc">Original decision visual for just-in-time production and pull execution, using fictional Pinehaven Motion Systems data where applicable.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F9FBFD"/><stop offset="1" stop-color="#EEF5F7"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B7184"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B7189"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102A43}.titleSm{font-size:23px;font-weight:700;fill:#102A43}.titleXs{font-size:19px;font-weight:700;fill:#102A43}.subtitleSm{font-size:12px;fill:#5B7184}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.1px;fill:#0B7189}.subtitle{font-size:16px;fill:#5B7184}.h{font-size:20px;font-weight:700;fill:#17324D}.body{font-size:16px;fill:#17324D}.small{font-size:13px;fill:#5B7184}.tiny{font-size:11px;fill:#5B7184}.metric{font-size:26px;font-weight:700;fill:#0B7189}.white{fill:#fff}.axis{stroke:#5B7184;stroke-width:2}.grid{stroke:#D4E0E8;stroke-width:1}.arrow{stroke:#5B7184;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrowt{stroke:#0B7189;stroke-width:3;fill:none;marker-end:url(#arrowTeal)}
</style>
<rect width="1200" height="720" rx="22" fill="url(#bg)"/>
<text x="55" y="42" class="eyebrow" text-anchor="start"><tspan x="55" y="42">MODULE 4 · INTERNAL OPERATIONS &amp; INVENTORY</tspan></text>
<text x="55" y="82" class="title" text-anchor="start"><tspan x="55" y="82">Just-in-Time Production and Pull Execution</tspan></text>
<text x="55" y="111" class="subtitleSm" text-anchor="start"><tspan x="55" y="111">Original decision visual for just-in-time production and pull execution, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
<text x="55" y="150" class="h" text-anchor="start"><tspan x="55" y="150">Pinehaven pull line · takt = 3.5 min/unit</tspan></text>
<rect x="55" y="270" width="160" height="105" rx="14" fill="#E8F5EF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="55" y="270" width="8" height="105" rx="14" fill="#2F7D65" opacity="1"/>
<text x="77" y="301" class="h" text-anchor="start"><tspan x="77" y="301">Receive kit</tspan></text>
<text x="77" y="330" class="small" text-anchor="start"><tspan x="77" y="330">1.8 min · Q 12</tspan></text>
<line x1="215" y1="322" x2="240" y2="322" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="240" y="270" width="160" height="105" rx="14" fill="#E8F5EF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="240" y="270" width="8" height="105" rx="14" fill="#2F7D65" opacity="1"/>
<text x="262" y="301" class="h" text-anchor="start"><tspan x="262" y="301">Assemble power</tspan><tspan x="262" y="321">stage</tspan></text>
<text x="262" y="330" class="small" text-anchor="start"><tspan x="262" y="330">3.2 min · Q 20</tspan></text>
<line x1="400" y1="322" x2="425" y2="322" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="425" y="270" width="160" height="105" rx="14" fill="#E8F5EF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="425" y="270" width="8" height="105" rx="14" fill="#2F7D65" opacity="1"/>
<text x="447" y="301" class="h" text-anchor="start"><tspan x="447" y="301">Wire controller</tspan></text>
<text x="447" y="330" class="small" text-anchor="start"><tspan x="447" y="330">2.9 min · Q 16</tspan></text>
<line x1="585" y1="322" x2="610" y2="322" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="610" y="270" width="160" height="105" rx="14" fill="#FCE9EB" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="610" y="270" width="8" height="105" rx="14" fill="#B84A52" opacity="1"/>
<text x="632" y="301" class="h" text-anchor="start"><tspan x="632" y="301">Burn-in test</tspan></text>
<text x="632" y="330" class="small" text-anchor="start"><tspan x="632" y="330">4.1 min · Q 40</tspan></text>
<line x1="770" y1="322" x2="795" y2="322" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="795" y="270" width="160" height="105" rx="14" fill="#E8F5EF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="795" y="270" width="8" height="105" rx="14" fill="#2F7D65" opacity="1"/>
<text x="817" y="301" class="h" text-anchor="start"><tspan x="817" y="301">Final inspection</tspan></text>
<text x="817" y="330" class="small" text-anchor="start"><tspan x="817" y="330">2.0 min · Q 10</tspan></text>
<line x1="955" y1="322" x2="980" y2="322" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="980" y="270" width="160" height="105" rx="14" fill="#E8F5EF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="980" y="270" width="8" height="105" rx="14" fill="#2F7D65" opacity="1"/>
<text x="1002" y="301" class="h" text-anchor="start"><tspan x="1002" y="301">Pack and label</tspan></text>
<text x="1002" y="330" class="small" text-anchor="start"><tspan x="1002" y="330">1.7 min · Q 8</tspan></text>
<line x1="1060" y1="465" x2="130" y2="465" stroke="#5B7184" stroke-width="3" marker-end="url(#arrow)"/>
<text x="595" y="500" class="small" text-anchor="middle"><tspan x="595" y="500">Kanban / consumption signal travels upstream</tspan></text>
<rect x="360" y="560" width="480" height="75" rx="14" fill="#FFFFFF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="360" y="560" width="8" height="75" rx="14" fill="#B84A52" opacity="1"/>
<text x="382" y="591" class="h" text-anchor="start"><tspan x="382" y="591">Constraint warning</tspan></text>
<text x="382" y="620" class="small" text-anchor="start"><tspan x="382" y="620">Burn-in exceeds takt and carries the largest queue;</tspan><tspan x="382" y="638">improve the system before reducing protection blindly.</tspan></text>
</svg>