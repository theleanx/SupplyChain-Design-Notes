<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Balancing Load and Capacity</title><desc id="desc">Original decision visual for balancing load and capacity, using fictional Pinehaven Motion Systems data where applicable.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F9FBFD"/><stop offset="1" stop-color="#EEF5F7"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B7184"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B7189"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102A43}.titleSm{font-size:23px;font-weight:700;fill:#102A43}.titleXs{font-size:19px;font-weight:700;fill:#102A43}.subtitleSm{font-size:12px;fill:#5B7184}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.1px;fill:#0B7189}.subtitle{font-size:16px;fill:#5B7184}.h{font-size:20px;font-weight:700;fill:#17324D}.body{font-size:16px;fill:#17324D}.small{font-size:13px;fill:#5B7184}.tiny{font-size:11px;fill:#5B7184}.metric{font-size:26px;font-weight:700;fill:#0B7189}.white{fill:#fff}.axis{stroke:#5B7184;stroke-width:2}.grid{stroke:#D4E0E8;stroke-width:1}.arrow{stroke:#5B7184;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrowt{stroke:#0B7189;stroke-width:3;fill:none;marker-end:url(#arrowTeal)}
</style>
<rect width="1200" height="720" rx="22" fill="url(#bg)"/>
<text x="55" y="42" class="eyebrow" text-anchor="start"><tspan x="55" y="42">MODULE 4 · INTERNAL OPERATIONS &amp; INVENTORY</tspan></text>
<text x="55" y="82" class="title" text-anchor="start"><tspan x="55" y="82">Balancing Load and Capacity</tspan></text>
<text x="55" y="111" class="subtitle" text-anchor="start"><tspan x="55" y="111">Original decision visual for balancing load and capacity, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
<text x="55" y="150" class="h" text-anchor="start"><tspan x="55" y="150">Choose a response based on whether the problem is load, capacity, or both</tspan></text>
<rect x="250" y="205" width="420" height="190" rx="0" fill="#FCE9EB" stroke="#FFFFFF" stroke-width="4" opacity="1"/>
<rect x="670" y="205" width="420" height="190" rx="0" fill="#FFF4D8" stroke="#FFFFFF" stroke-width="4" opacity="1"/>
<rect x="250" y="395" width="420" height="190" rx="0" fill="#EAF4F8" stroke="#FFFFFF" stroke-width="4" opacity="1"/>
<rect x="670" y="395" width="420" height="190" rx="0" fill="#E8F5EF" stroke="#FFFFFF" stroke-width="4" opacity="1"/>
<text x="275" y="245" class="h" text-anchor="start"><tspan x="275" y="245">Load &gt; capacity</tspan></text>
<text x="275" y="280" class="body" text-anchor="start"><tspan x="275" y="280">Reschedule · reroute · split lots ·</tspan><tspan x="275" y="301">overtime</tspan></text>
<text x="695" y="245" class="h" text-anchor="start"><tspan x="695" y="245">Capacity short-term gap</tspan></text>
<text x="695" y="280" class="body" text-anchor="start"><tspan x="695" y="280">Add hours · cross-train · subcontract</tspan></text>
<text x="275" y="435" class="h" text-anchor="start"><tspan x="275" y="435">Excess capacity</tspan></text>
<text x="275" y="470" class="body" text-anchor="start"><tspan x="275" y="470">Pull work forward · maintenance ·</tspan><tspan x="275" y="491">training</tspan></text>
<text x="695" y="435" class="h" text-anchor="start"><tspan x="695" y="435">Balanced</tspan></text>
<text x="695" y="470" class="body" text-anchor="start"><tspan x="695" y="470">Protect flow · monitor buffer · avoid</tspan><tspan x="695" y="491">overreaction</tspan></text>
<text x="670" y="635" class="small" text-anchor="middle"><tspan x="670" y="635">Capacity available →</tspan></text>
<text x="115" y="395" class="small" text-anchor="middle"><tspan x="115" y="395">Load</tspan></text>
</svg>