xt-anchor="middle" font-size="16" fill="#17324d">Seller</text><rect x="55" y="391" width="250" height="70" fill="#fff" stroke="#b6c2cc"/><text x="180" y="433" text-anchor="middle" font-size="16" fill="#17324d">Insurance</text><rect x="325" y="391" width="250" height="70" fill="#fff" stroke="#b6c2cc"/><text x="450" y="433" text-anchor="middle" font-size="16" fill="#17324d">Buyer choice</text><rect x="595" y="391" width="250" height="70" fill="#fff" stroke="#b6c2cc"/><text x="720" y="433" text-anchor="middle" font-size="16" fill="#17324d">CIP/CIF seller obligation</text><rect x="865" y="391" width="250" height="70" fill="#fff" stroke="#b6c2cc"/><text x="990" y="433" text-anchor="middle" font-size="16" fill="#17324d">Contract choice</text><rect x="55" y="479" width="250" height="70" fill="#fff" stroke="#b6c2cc"/><text x="180" y="521" text-anchor="middle" font-size="16" fill="#17324d">Import clearance</text><rect x="325" y="479" width="250" height="70" fill="#fff" stroke="#b6c2cc"/><text x="450" y="521" text-anchor="middle" font-size="16" fill="#17324d">Usually buyer</text><rect x="595" y="479" width="250" height="70" fill="#fff" stroke="#b6c2cc"/><text x="720" y="521" text-anchor="middle" font-size="16" fill="#17324d">Usually buyer</text><rect x="865" y="479" width="250" height="70" fill="#fff" stroke="#b6c2cc"/><text x="990" y="521" text-anchor="middle" font-size="16" fill="#17324d">DDP seller</text></g>
