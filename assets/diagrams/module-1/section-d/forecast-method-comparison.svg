ext-anchor="middle">4</text><text class="small" x="457.8" y="470" text-anchor="middle">5</text><text class="small" x="552.2" y="470" text-anchor="middle">6</text><text class="small" x="646.7" y="470" text-anchor="middle">7</text><text class="small" x="741.1" y="470" text-anchor="middle">8</text><text class="small" x="835.6" y="470" text-anchor="middle">9</text><text class="small" x="930.0" y="470" text-anchor="middle">10</text><line x1="500" y1="515" x2="528" y2="515" stroke="#172033" stroke-width="4"/><text class="small" x="534" y="519">Actual</text><line x1="610" y1="515" x2="638" y2="515" stroke="#8fb3da" stroke-width="4"/><text class="small" x="644" y="519">3-period MA</text><line x1="720" y1="515" x2="748" y2="515" stroke="#d7b363" stroke-width="4"/><text class="small" x="754" y="519">Weighted MA</text><line x1="830" y1="515" x2="858" y2="515" stroke="#86b8a8" stroke-width="4"/><text class="small" x="864" y="519">Exp. smoothing</text><text class="small" x="80" y="520">Illustrative deseasonalized demand. A longer average smooths more but usually reacts more slowly.</text></svg>