<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc"><title id="title">Forecasting principles</title><desc id="desc">Original educational visual showing that forecasting accuracy generally declines as the horizon lengthens and detail increases.</desc><style>
.text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.muted{font-family:Arial,Helvetica,sans-serif;fill:#596579}.small{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.sub{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:8 7}.axis{stroke:#606b7d;stroke-width:2}</style><rect width="980" height="560" fill="white"/>
<text class="title" x="50" y="45">Forecasting gets less precise as detail and time horizon increase</text>
<line class="axis" x1="100" y1="450" x2="850" y2="450"/><line class="axis" x1="100" y1="450" x2="100" y2="110"/>
<text class="muted" x="470" y="500" text-anchor="middle" font-size="15">Forecast horizon: near term → long term</text>
<text class="muted" x="35" y="280" text-anchor="middle" font-size="15" transform="rotate(-90 35 280)">Typical forecast accuracy</text>
<path d="M130 155 C260 175 380 220 500 275 C640 340 760 385 825 410" fill="none" stroke="#526172" stroke-width="5"/>
<circle cx="155" cy="165" r="9" fill="#86b8a8"/><circle cx="800" cy="398" r="9" fill="#d59898"/>
<rect class="green" x="130" y="85" width="250" height="72" rx="12"/><text class="sub" x="255" y="115" text-anchor="middle">Near-term + aggregated</text><text class="muted" x="255" y="140" text-anchor="middle" font-size="14">Usually more stable and accurate</text>
<rect class="red" x="610" y="340" width="270" height="78" rx="12"/><text class="sub" x="745" y="372" text-anchor="middle">Long-term + item-level</text><text class="muted" x="745" y="397" text-anchor="middle" font-size="14">More uncertainty and mix risk</text>
<text class="small" x="110" y="535">Good forecasts still need an explicit error estimate and regular review.</text></svg>