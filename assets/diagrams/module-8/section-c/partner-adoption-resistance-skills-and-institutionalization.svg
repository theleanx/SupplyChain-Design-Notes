<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Institutionalization: actual use and correct outcomes</title><desc id="desc">Warehouse adoption 85 percent and correct outcomes 82 percent; supplier adoption 50 percent and correct outcomes 44.5 percent. Training and logins are not the same as correct performance.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1000" height="103" rx="0" fill="#173e56" stroke="none" stroke-width="1.5"/><text x="32" y="42" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Technology Trends</text><text x="32" y="79" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" fill="#fff">Institutionalization: actual use and correct outcomes</text> <text x="56" y="150" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" fill="#193f54" font-weight="700">Correct outcomes must be tracked separately from process use</text><text x="58" y="221" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#214c64" font-weight="700">Warehouse</text><rect x="267" y="189" width="640" height="36" rx="8" fill="#e8eef3" stroke="none" stroke-width="1.5"/><rect x="267" y="189" width="544" height="36" rx="8" fill="#47947f" stroke="none" stroke-width="1.5"/><text x="918" y="216" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" fill="#236a55" font-weight="700">85% use</text><rect x="267" y="231" width="640" height="36" rx="8" fill="#e8eef3" stroke="none" stroke-width="1.5"/><rect x="267" y="231" width="524.8" height="36" rx="8" fill="#8bb8a7" stroke="none" stroke-width="1.5"/><text x="918" y="260" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" fill="#236a55" font-weight="700">82% correct</text><text x="58" y="382" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#214c64" font-weight="700">Supplier</text><rect x="267" y="346" width="640" height="36" rx="8" fill="#e8eef3" stroke="none" stroke-width="1.5"/><rect x="267" y="346" width="320" height="36" rx="8" fill="#b88775" stroke="none" stroke-width="1.5"/><text x="918" y="375" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" fill="#9a5342" font-weight="700">50% use</text><rect x="267" y="389" width="640" height="36" rx="8" fill="#e8eef3" stroke="none" stroke-width="1.5"/><rect x="267" y="389" width="284.8" height="36" rx="8" fill="#d0a593" stroke="none" stroke-width="1.5"/><text x="918" y="418" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="end" fill="#9a5342" font-weight="700">44.5% correct</text><rect x="164" y="491" width="670" height="35" rx="18" fill="#d8efe0" stroke="none" stroke-width="1.5"/><text x="499" y="515" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="middle" fill="#24634d" font-weight="700">Investigate supplier mapping, access and incentive barriers</text><line x1="32" y1="564" x2="968" y2="564" stroke="#d4e0e8" stroke-width="2"/><text x="500" y="587" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#466475">AlderGate Motion Products · fictional training data · check every mandatory gate</text><g fill="none" stroke="#2e7183" stroke-width="2.5"><circle cx="913" cy="262" r="36"/><circle cx="913" cy="417" r="36"/></g><text x="500" y="470" font-family="Arial" font-size="17" fill="#286580" text-anchor="middle">Circled outcomes are not interchangeable with reported process use.</text></svg>