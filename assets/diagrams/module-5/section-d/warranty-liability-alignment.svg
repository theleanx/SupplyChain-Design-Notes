<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Warranty liability alignment</title><desc id="desc">Comparison of customer and supplier warranty periods and the hidden-liability gap.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#17324D">Warranty Liability Alignment</text><rect x="110" y="180" width="420" height="180" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="320" y="225" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17324D">Customer warranty</text><text x="320" y="270" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#17324D"><tspan x="320" dy="0">Promise period</tspan><tspan x="320" dy="27">service level</tspan><tspan x="320" dy="27">repair / replacement obligation</tspan></text><rect x="630" y="180" width="420" height="180" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="840" y="225" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#17324D">Supplier warranty</text><text x="840" y="270" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#17324D"><tspan x="840" dy="0">Component coverage</tspan><tspan x="840" dy="27">claim conditions</tspan><tspan x="840" dy="27">recovery from supplier</tspan></text><line x1="530" y1="270" x2="630" y2="270" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="300" y="445" width="560" height="120" rx="16" fill="#FFF4D8" stroke="#C98516" stroke-width="2"/><text x="580" y="482" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#17324D"><tspan x="580" dy="0">Hidden liability appears when customer coverage</tspan><tspan x="580" dy="29">outlasts supplier recovery or exclusions differ</tspan></text></svg>