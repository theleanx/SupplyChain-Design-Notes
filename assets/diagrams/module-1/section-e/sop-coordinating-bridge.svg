<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Sop Coordinating Bridge</title><desc id="desc">Original bridge visual showing S&amp;OP connecting business intent with operating behavior.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">S&amp;OP is the bridge between business intent and operating behavior</text>
<rect class="purple" x="70" y="140" width="300" height="300" rx="18"/><text class="h" x="220" y="185" text-anchor="middle">BUSINESS INTENT</text><text class="s" x="105" y="235">• strategy and growth</text><text class="s" x="105" y="275">• customer value</text><text class="s" x="105" y="315">• revenue / profit goals</text><text class="s" x="105" y="355">• market priorities</text>
<rect class="blue" x="430" y="195" width="240" height="190" rx="18"/><text class="h" x="550" y="235" text-anchor="middle">S&amp;OP</text><text class="s" x="465" y="275">one set of facts</text><text class="s" x="465" y="305">cross-functional trade-offs</text><text class="s" x="465" y="335">monthly replanning</text>
<rect class="green" x="730" y="140" width="300" height="300" rx="18"/><text class="h" x="880" y="185" text-anchor="middle">OPERATING BEHAVIOR</text><text class="s" x="765" y="235">• production and sourcing</text><text class="s" x="765" y="275">• inventory and backlog</text><text class="s" x="765" y="315">• customer commitments</text><text class="s" x="765" y="355">• resource decisions</text>
<path class="line" d="M370 290H430 M670 290H730"/><text class="s" x="70" y="510">Implementation succeeds when functions actually execute against the agreed plan — not merely attend meetings.</text>
</svg>
