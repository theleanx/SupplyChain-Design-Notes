<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Automation boundary for CRM execution</title><desc id="desc">A decision matrix separates routine automatable relationship work from high-judgment interactions requiring human ownership.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Automation boundary for CRM execution</text><rect x="160" y="150" width="840" height="410" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><line x1="580.0" y1="150" x2="580.0" y2="560" stroke="#c9d6df" stroke-width="2"/><line x1="160" y1="355.0" x2="1000" y2="355.0" stroke="#c9d6df" stroke-width="2"/><rect x="172" y="162" width="396.0" height="181.0" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="370.0" y="243.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="370.0" dy="0">Repeatable + low judgment</tspan></text><text x="370.0" y="278.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="370.0" dy="0">automate with monitoring</tspan></text><rect x="592.0" y="162" width="396.0" height="181.0" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="790.0" y="243.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="790.0" dy="0">Repeatable + high impact</tspan></text><text x="790.0" y="278.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="790.0" dy="0">automate within guardrails</tspan></text><rect x="172" y="367.0" width="396.0" height="181.0" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="370.0" y="448.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="370.0" dy="0">Variable + low impact</tspan></text><text x="370.0" y="483.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="370.0" dy="0">assist / template</tspan></text><rect x="592.0" y="367.0" width="396.0" height="181.0" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="790.0" y="448.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="790.0" dy="0">Variable + high judgment</tspan></text><text x="790.0" y="483.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="790.0" dy="0">human-led with decision support</tspan></text><text x="580" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4f6475">Judgment / variability →</text><text x="70" y="355" transform="rotate(-90 70 355)" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4f6475">Relationship impact →</text></svg>
