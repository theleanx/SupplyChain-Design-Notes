<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Risk uncertainty branching model</title><desc id="chart-desc">Specific exposures create uncertain events. An event can lead to an unfavorable threat or favorable opportunity; each branch needs an owner and evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L11 6 L0 11 Z" fill="#087D93"/></marker></defs>
<rect width="1280" height="760" fill="#F8FAFC"/>
<text x="52" y="66" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#152D46">Risk starts with an uncertain event — not a risk score</text>
<text x="52" y="101" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#53687A">Cause  →  event  →  effect on an objective  →  owned signal</text>
<rect x="55" y="145" width="1170" height="114" rx="17" fill="#FFFFFF" stroke="#087D93" stroke-width="2"/>
<text x="84" y="181" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087D93">1  SPECIFY THE EXPOSURE</text>
<text x="84" y="215" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#152D46">One approved test fixture; one shared terminal; or an unproven maintenance pilot</text>
<line x1="638" y1="259" x2="638" y2="291" stroke="#087D93" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="385" y="301" width="510" height="103" rx="17" fill="#E7F5F8" stroke="#087D93" stroke-width="2"/>
<text x="415" y="338" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087D93">2  DEFINE THE UNCERTAIN EVENT</text>
<text x="415" y="373" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#152D46">What could happen within 12 months?</text>
<line x1="532" y1="405" x2="328" y2="449" stroke="#087D93" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="745" y1="405" x2="939" y2="449" stroke="#087D93" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="467" width="548" height="177" rx="17" fill="#FFF1E4" stroke="#B46722" stroke-width="2"/>
<rect x="676" y="467" width="549" height="177" rx="17" fill="#EAF6EE" stroke="#26704A" stroke-width="2"/>
<text x="83" y="505" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#B46722">THREAT / UNFAVORABLE</text>
<text x="705" y="505" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#26704A">OPPORTUNITY / FAVORABLE</text>
<text x="83" y="542" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#152D46">Component delay → missed commitments</text>
<text x="83" y="571" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#152D46">or terminal closure → two blocked lanes</text>
<text x="705" y="542" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#152D46">Validated maintenance pilot → fewer</text>
<text x="705" y="571" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#152D46">unscheduled stops (not a guaranteed gain)</text>
<text x="83" y="620" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53687A">Monitor: delivery signals and route access</text>
<text x="705" y="620" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#53687A">Monitor: measured pilot detection rate</text>
<rect x="55" y="675" width="1170" height="60" rx="12" fill="#FFFFFF" stroke="#CDD7E1" stroke-width="1"/>
<text x="80" y="713" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087D93">Decision gate:</text>
<text x="206" y="713" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#152D46">assign an owner and horizon first; estimate probability and severity only after evidence review</text>
</svg>