<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Waste exchange market</title><desc id="desc">A generator, exchange, and user model for matching by-products to beneficial uses.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#17324D">Waste Exchange: From Disposal Cost to Input Value</text><rect x="80" y="210" width="260" height="160" rx="16" fill="#FCEBEC" stroke="#17324D" stroke-width="2"/><text x="210" y="255" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#17324D">Generator</text><text x="210" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#17324D"><tspan x="210" dy="0">by-product / surplus</tspan><tspan x="210" dy="24">handling + quality data</tspan></text><rect x="450" y="180" width="260" height="220" rx="16" fill="#FFF4D8" stroke="#C98516" stroke-width="2"/><text x="580" y="230" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#17324D">Exchange / Match</text><text x="580" y="270" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#17324D"><tspan x="580" dy="0">material specification</tspan><tspan x="580" dy="23">quantity / frequency</tspan><tspan x="580" dy="23">logistics / price</tspan><tspan x="580" dy="23">compliance constraints</tspan></text><rect x="820" y="210" width="260" height="160" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="950" y="255" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#17324D">User</text><text x="950" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#17324D"><tspan x="950" dy="0">substitute input</tspan><tspan x="950" dy="24">verified fit for use</tspan></text><line x1="340" y1="290" x2="450" y2="290" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><line x1="710" y1="290" x2="820" y2="290" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><line x1="820" y1="350" x2="710" y2="350" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><line x1="450" y1="350" x2="340" y2="350" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="240" y="510" width="680" height="75" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="580" y="540" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#17324D"><tspan x="580" dy="0">A match is valuable only when quality, transport, economics,</tspan><tspan x="580" dy="24">and legal requirements are all acceptable</tspan></text></svg>