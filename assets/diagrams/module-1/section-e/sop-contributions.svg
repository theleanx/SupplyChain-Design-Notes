<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Sop Contributions</title><desc id="desc">Original three-column S&amp;OP contribution map for demand, finance, and supply.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">S&amp;OP works only when demand, supply and finance contribute their part</text>
<rect class="blue" x="70" y="110" width="280" height="360" rx="16"/><text class="h" x="210" y="145" text-anchor="middle">DEMAND SIDE</text><text class="s" x="95" y="190">• forecasts</text><text class="s" x="95" y="225">• launches / life-cycle assumptions</text><text class="s" x="95" y="260">• pricing / promotion actions</text><text class="s" x="95" y="295">• market intelligence</text><text class="s" x="95" y="330">• units + revenue</text><text class="s" x="95" y="365">• risks / opportunities</text>
<rect class="gold" x="410" y="110" width="280" height="360" rx="16"/><text class="h" x="550" y="145" text-anchor="middle">FINANCE</text><text class="s" x="435" y="190">• revenue / margin impact</text><text class="s" x="435" y="225">• budgets and cash</text><text class="s" x="435" y="260">• capital constraints</text><text class="s" x="435" y="295">• business-plan fit</text><text class="s" x="435" y="330">• compare alternatives</text>
<rect class="green" x="750" y="110" width="280" height="360" rx="16"/><text class="h" x="890" y="145" text-anchor="middle">SUPPLY SIDE</text><text class="s" x="775" y="190">• feasible output</text><text class="s" x="775" y="225">• inventory / backlog</text><text class="s" x="775" y="260">• resources / bottlenecks</text><text class="s" x="775" y="295">• operations strategy</text><text class="s" x="775" y="330">• supplier constraints</text><text class="s" x="775" y="365">• actual performance</text>
<circle cx="550" cy="540" r="75" fill="#f3eefb" stroke="#aa95d4" stroke-width="2"/><text class="h" x="550" y="530" text-anchor="middle">ONE S&amp;OP</text><text class="h" x="550" y="555" text-anchor="middle">PLAN</text><path class="line" d="M210 470L490 520 M550 470V465 M890 470L610 520"/>
</svg>
