<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Relationship communication closed loop</title><desc id="desc">A supply-chain communication plan starts with purpose and audience, selects the message and medium, confirms acknowledgment, and uses feedback to close the loop.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Relationship communication closed loop</text><rect x="55" y="255" width="150" height="115" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="130.0" y="296.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="130.0" dy="0">Purpose + audience</tspan></text><text x="130.0" y="328.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="130.0" dy="0">need / decision /</tspan><tspan x="130.0" dy="16">action</tspan></text><line x1="205" y1="313" x2="235" y2="313" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="235" y="255" width="150" height="115" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="310.0" y="296.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="310.0" dy="0">Message + medium</tspan></text><text x="310.0" y="328.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="310.0" dy="0">format + urgency +</tspan><tspan x="310.0" dy="16">security + retention</tspan></text><line x1="385" y1="313" x2="415" y2="313" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="255" width="150" height="115" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="490.0" y="304.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="490.0" dy="0">Send / receive</tspan></text><text x="490.0" y="336.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="490.0" dy="0">filters + noise</tspan></text><line x1="565" y1="313" x2="595" y2="313" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="595" y="255" width="150" height="115" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="670.0" y="296.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="670.0" dy="0">Acknowledge</tspan></text><text x="670.0" y="328.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="670.0" dy="0">receipt is not</tspan><tspan x="670.0" dy="16">comprehension</tspan></text><line x1="745" y1="313" x2="775" y2="313" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="775" y="255" width="150" height="115" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="850.0" y="286.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="850.0" dy="0">Feedback +</tspan><tspan x="850.0" dy="20">understanding</tspan></text><text x="850.0" y="338.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="850.0" dy="0">clarify until meaning</tspan><tspan x="850.0" dy="16">matches</tspan></text><line x1="925" y1="313" x2="955" y2="313" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="955" y="255" width="150" height="115" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="1030.0" y="296.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="1030.0" dy="0">Monitor + improve</tspan></text><text x="1030.0" y="328.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="1030.0" dy="0">record lessons +</tspan><tspan x="1030.0" dy="16">adjust plan</tspan></text><path d="M1030 400 C1030 550, 130 550, 130 400" fill="none" stroke="#0b7189" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Acknowledgment confirms receipt; feedback and clarification confirm shared understanding.</text></svg>
