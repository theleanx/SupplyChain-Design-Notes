<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Product mix: maximize contribution within 120 hours</title><desc id="desc">Product A 40 units at 2 constrained hours and 40 dollar contribution, Product B 10 units at 4 hours and 55 dollar contribution, using exactly 120 hours for a 2150 dollar maximum under demand caps.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff"/><rect x="0" y="0" width="1000" height="101" rx="0" fill="#173e55"/><text x="32" y="42" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Optimization and Strategy</text><text x="32" y="77" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff">Product mix: maximize contribution within 120 hours</text><text x="58" y="145" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#153c50" font-weight="700">Work-center resource allocation · 120 hours/week</text><rect x="59" y="188" width="616" height="76" rx="12" fill="#deecfa"/><text x="80" y="228" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#255879" font-weight="700">A: 40 units × 2 h = 80 h</text><rect x="59" y="279" width="306" height="76" rx="12" fill="#dff0e6"/><text x="78" y="320" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#22664e" font-weight="700">B: 10 × 4 h = 40 h</text><rect x="704" y="188" width="238" height="167" rx="12" fill="#e8f2f8"/><text x="722" y="231" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52" font-weight="700">40x + 55y</text><text x="722" y="269" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">Maximize contribution</text><text x="728" y="305" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#235a78" font-weight="700">x=40, y=10</text><rect x="67" y="413" width="861" height="105" rx="12" fill="#e3f2e9"/><text x="91" y="457" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#226951" font-weight="700">$1,600 + $550 = $2,150 contribution/week</text><text x="91" y="491" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">2×40 + 4×10 = 120/120 hours; demand caps respected</text><line x1="32" y1="560" x2="968" y2="560" stroke="#bdcdd7" stroke-width="2"/><text x="500" y="585" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#557083">AlderGate Motion Products · fictional scope and calculations</text></svg>