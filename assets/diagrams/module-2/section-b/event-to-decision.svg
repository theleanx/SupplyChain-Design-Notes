<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Event-to-decision control loop</title>
  <desc id="desc">A physical event is captured and validated, linked to business impact, grouped into a prioritized case, assigned for decision, executed, and measured.</desc>
  <rect width="960" height="420" rx="24" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Visibility creates value when it closes the decision loop</text>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <circle cx="100" cy="165" r="54" fill="#0f766e"/><text x="100" y="160" fill="white">Physical</text><text x="100" y="181" fill="white">event</text>
    <circle cx="250" cy="165" r="54" fill="#0369a1"/><text x="250" y="160" fill="white">Capture and</text><text x="250" y="181" fill="white">validate</text>
    <circle cx="400" cy="165" r="54" fill="#1d4ed8"/><text x="400" y="160" fill="white">Business</text><text x="400" y="181" fill="white">impact</text>
    <circle cx="550" cy="165" r="54" fill="#7c3aed"/><text x="550" y="160" fill="white">Prioritized</text><text x="550" y="181" fill="white">case</text>
    <circle cx="700" cy="165" r="54" fill="#b45309"/><text x="700" y="160" fill="white">Decision and</text><text x="700" y="181" fill="white">execution</text>
    <circle cx="850" cy="165" r="54" fill="#be123c"/><text x="850" y="160" fill="white">Outcome</text><text x="850" y="181" fill="white">learning</text>
  </g>
  <g stroke="#475569" stroke-width="4" marker-end="url(#arrow)"><path d="M154 165 H189"/><path d="M304 165 H339"/><path d="M454 165 H489"/><path d="M604 165 H639"/><path d="M754 165 H789"/></g>
  <path d="M850 220 C850 365 250 365 250 225" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
  <rect x="105" y="246" width="750" height="38" rx="8" fill="#f8fafc"/>
  <text x="480" y="270" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#334155">Measure latency, avoided impact, recovery cost, false alerts, and repeated causes.</text>
</svg>
