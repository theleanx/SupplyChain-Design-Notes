<rect x="270" y="465" width="660" height="95" rx="14" fill="#EAF4F8" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="270" y="465" width="8" height="95" rx="14" fill="#0B7189" opacity="1"/>
<text x="292" y="496" class="h" text-anchor="start"><tspan x="292" y="496">Design rule</tspan></text>
<text x="292" y="525" class="small" text-anchor="start"><tspan x="292" y="525">A KPI without an owner, definition, target, and action trigger is only</tspan><tspan x="292" y="543">a number.</tspan></text>
