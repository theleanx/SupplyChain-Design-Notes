<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Supplier reporting, claims, and remediation loop</title><desc id="desc">Supplier performance issues move through evidence, notification, containment, corrective action, verification, and closure.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Supplier reporting, claims, and remediation loop</text><rect x="62.5" y="280" width="135" height="105" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="130.0" y="324.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="130.0" dy="0">Detect issue</tspan></text><text x="130.0" y="358.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="130.0" dy="0">KPI / claim / error</tspan></text><line x1="197.5" y1="332" x2="242.5" y2="332" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="242.5" y="280" width="135" height="105" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="310.0" y="316.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="310.0" dy="0">Retain evidence</tspan></text><text x="310.0" y="349.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="310.0" dy="0">transaction + shipment</tspan><tspan x="310.0" dy="16">+ defect facts</tspan></text><line x1="377.5" y1="332" x2="422.5" y2="332" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="422.5" y="280" width="135" height="105" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="490.0" y="316.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="490.0" dy="0">Notify supplier</tspan></text><text x="490.0" y="349.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="490.0" dy="0">clear expectation +</tspan><tspan x="490.0" dy="16">owner</tspan></text><line x1="557.5" y1="332" x2="602.5" y2="332" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="602.5" y="280" width="135" height="105" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="670.0" y="316.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="670.0" dy="0">Contain + correct</tspan></text><text x="670.0" y="349.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="670.0" dy="0">immediate + root-cause</tspan><tspan x="670.0" dy="16">response</tspan></text><line x1="737.5" y1="332" x2="782.5" y2="332" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="782.5" y="280" width="135" height="105" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="850.0" y="306.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="850.0" dy="0">Verify recurrence</tspan><tspan x="850.0" dy="21">control</tspan></text><text x="850.0" y="360.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="850.0" dy="0">performance confirms</tspan><tspan x="850.0" dy="16">control</tspan></text><line x1="917.5" y1="332" x2="962.5" y2="332" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="962.5" y="280" width="135" height="105" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="1030.0" y="324.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="1030.0" dy="0">Close / escalate</tspan></text><text x="1030.0" y="358.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="1030.0" dy="0">record outcome</tspan></text><path d="M1030.0 385 C1030.0 545, 130.0 545, 130.0 385" fill="none" stroke="#0b7189" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">A closed record links the original signal, the response, verification, and the relationship outcome.</text></svg>
