  <rect x="263" y="310.4" width="125" height="51.2" rx="6" fill="#2a9d8f" />
  <text x="325.5" y="298.4" class="label" text-anchor="middle">
    <tspan x="325.5" y="298.4">$+12.80</tspan>
  </text>
  <text x="325.5" y="615" class="small" text-anchor="middle">
    <tspan x="325.5" y="615">Conversion</tspan>
