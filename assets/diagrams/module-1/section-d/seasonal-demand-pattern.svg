<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc"><title id="title">Seasonal demand pattern</title><desc id="desc">Original line chart with repeated seasonal peaks and troughs plus a mild upward trend over three years.</desc><style>
