<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">CRM segment strategy matrix</title><desc id="desc">A two-axis matrix calibrates CRM service intensity using relationship value and need for human support.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">CRM segment strategy matrix</text><rect x="170" y="145" width="820" height="430" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><line x1="580.0" y1="145" x2="580.0" y2="575" stroke="#c9d6df" stroke-width="2"/><line x1="170" y1="360.0" x2="990" y2="360.0" stroke="#c9d6df" stroke-width="2"/><rect x="185" y="160" width="380.0" height="185.0" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="375.0" y="243.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="375.0" dy="0">Low value / low support</tspan></text><text x="375.0" y="278.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="375.0" dy="0">efficient self-service</tspan></text><rect x="595.0" y="160" width="380.0" height="185.0" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="785.0" y="243.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="785.0" dy="0">High value / low support</tspan></text><text x="785.0" y="278.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="785.0" dy="0">scaled preferred treatment</tspan></text><rect x="185" y="375.0" width="380.0" height="185.0" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="375.0" y="458.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="375.0" dy="0">Low value / high support</tspan></text><text x="375.0" y="493.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="375.0" dy="0">guided standardized support</tspan></text><rect x="595.0" y="375.0" width="380.0" height="185.0" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="785.0" y="449.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="785.0" dy="0">High value / high support</tspan></text><text x="785.0" y="484.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="785.0" dy="0">dedicated relationship</tspan><tspan x="785.0" dy="19">management</tspan></text><text x="580" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4f6475">Relationship value →</text><text x="75" y="365" transform="rotate(-90 75 365)" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#4f6475">Need for human support →</text></svg>
