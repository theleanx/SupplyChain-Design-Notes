<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Supply-Base Right-Sizing</title>
  <desc id="desc">Balance aggregation benefits against resilience and capacity constraints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">SUPPLY-BASE DESIGN</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Supply-Base Right-Sizing</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Balance aggregation benefits against resilience and capacity constraints.</tspan>
  </text>
  <rect x="70" y="170" width="480" height="420" rx="20" fill="#e8f4f6" stroke="#587d96" stroke-width="2" />
  <text x="310" y="215" class="title" text-anchor="middle">
    <tspan x="310" y="215">Consolidate</tspan>
  </text>
  <circle cx="112" cy="278" r="20" fill="#176b87" />
  <text x="112" y="284" class="label white" text-anchor="middle">
    <tspan x="112" y="284">1</tspan>
  </text>
  <text x="148" y="272" class="body" text-anchor="start">
    <tspan x="148" y="272">Increase leverage</tspan>
  </text>
  <circle cx="112" cy="356" r="20" fill="#176b87" />
  <text x="112" y="362" class="label white" text-anchor="middle">
    <tspan x="112" y="362">2</tspan>
  </text>
  <text x="148" y="350" class="body" text-anchor="start">
    <tspan x="148" y="350">Reduce interfaces</tspan>
  </text>
  <circle cx="112" cy="434" r="20" fill="#176b87" />
  <text x="112" y="440" class="label white" text-anchor="middle">
    <tspan x="112" y="440">3</tspan>
  </text>
  <text x="148" y="428" class="body" text-anchor="start">
    <tspan x="148" y="428">Standardize specifications</tspan>
  </text>
  <circle cx="112" cy="512" r="20" fill="#176b87" />
  <text x="112" y="518" class="label white" text-anchor="middle">
    <tspan x="112" y="518">4</tspan>
  </text>
  <text x="148" y="506" class="body" text-anchor="start">
    <tspan x="148" y="506">Deepen supplier investment</tspan>
  </text>
  <rect x="650" y="170" width="480" height="420" rx="20" fill="#fff2df" stroke="#587d96" stroke-width="2" />
  <text x="890" y="215" class="title" text-anchor="middle">
    <tspan x="890" y="215">Diversify</tspan>
  </text>
  <circle cx="692" cy="278" r="20" fill="#e76f51" />
  <text x="692" y="284" class="label white" text-anchor="middle">
    <tspan x="692" y="284">1</tspan>
  </text>
  <text x="728" y="272" class="body" text-anchor="start">
    <tspan x="728" y="272">Protect continuity</tspan>
  </text>
  <circle cx="692" cy="356" r="20" fill="#e76f51" />
  <text x="692" y="362" class="label white" text-anchor="middle">
    <tspan x="692" y="362">2</tspan>
  </text>
  <text x="728" y="350" class="body" text-anchor="start">
    <tspan x="728" y="350">Create capacity options</tspan>
  </text>
  <circle cx="692" cy="434" r="20" fill="#e76f51" />
  <text x="692" y="440" class="label white" text-anchor="middle">
    <tspan x="692" y="440">3</tspan>
  </text>
  <text x="728" y="428" class="body" text-anchor="start">
    <tspan x="728" y="428">Reduce geographic exposure</tspan>
  </text>
  <circle cx="692" cy="512" r="20" fill="#e76f51" />
  <text x="692" y="518" class="label white" text-anchor="middle">
    <tspan x="692" y="518">4</tspan>
  </text>
  <text x="728" y="506" class="body" text-anchor="start">
    <tspan x="728" y="506">Preserve competitive tension</tspan>
  </text>
  <circle cx="600" cy="380" r="48" fill="#ffffff" stroke="#102a43" stroke-width="3" />
  <text x="600" y="374" class="label" text-anchor="middle">
