<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Sop Monthly Cycle</title><desc id="desc">Original circular S&amp;OP decision cycle showing updates, demand review, supply review, financial review, pre-S&amp;OP and executive S&amp;OP.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">S&amp;OP is a recurring decision cycle, not a one-time forecast</text>
<circle cx="550" cy="330" r="90" fill="#f7f9fc" stroke="#cbd3df" stroke-width="2"/><text class="h" x="550" y="315" text-anchor="middle">ONE AGREED</text><text class="h" x="550" y="340" text-anchor="middle">ENTERPRISE PLAN</text><text class="s" x="550" y="365" text-anchor="middle">units + money + actions</text>
<g><rect class="blue" x="430" y="70" width="240" height="70" rx="12"/><text class="h" x="550" y="100" text-anchor="middle">1. Update facts</text><text class="s" x="550" y="122" text-anchor="middle">actuals, forecast, performance</text>
<rect class="purple" x="760" y="180" width="250" height="70" rx="12"/><text class="h" x="885" y="210" text-anchor="middle">2. Demand review</text><text class="s" x="885" y="232" text-anchor="middle">commercial consensus</text>
<rect class="green" x="760" y="410" width="250" height="70" rx="12"/><text class="h" x="885" y="440" text-anchor="middle">3. Supply review</text><text class="s" x="885" y="462" text-anchor="middle">capacity + alternatives</text>
<rect class="gold" x="430" y="535" width="240" height="70" rx="12"/><text class="h" x="550" y="565" text-anchor="middle">4. Financial review</text><text class="s" x="550" y="587" text-anchor="middle">economics + constraints</text>
<rect class="red" x="90" y="410" width="250" height="70" rx="12"/><text class="h" x="215" y="440" text-anchor="middle">5. Pre-S&amp;OP</text><text class="s" x="215" y="462" text-anchor="middle">resolve + frame decisions</text>
<rect class="blue" x="90" y="180" width="250" height="70" rx="12"/><text class="h" x="215" y="210" text-anchor="middle">6. Executive S&amp;OP</text><text class="s" x="215" y="232" text-anchor="middle">approve + communicate</text></g>
<path class="dash" d="M650 120 C780 130 820 150 850 180 M920 250 C950 315 950 355 920 410 M760 475 C700 525 650 540 620 540 M430 570 C315 555 260 520 230 480 M180 410 C145 345 145 300 180 250 M340 205 C390 145 430 130 460 125"/>
</svg>
