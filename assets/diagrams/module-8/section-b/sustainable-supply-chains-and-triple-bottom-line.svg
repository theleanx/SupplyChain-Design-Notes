<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Three bottom lines remain distinct</title><desc id="desc">Three partially overlapping circles show economic, environmental and social sustainability; mandatory compliance gates underlie all.</desc><rect x="0" y="0" width="1000" height="100" fill="#173d55" stroke="#173d55" stroke-width="2" rx="0"/><text x="35" y="45" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="26" font-weight="700">CSCP Module 8 · Section B</text><text x="35" y="79" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="23" font-weight="400">Three bottom lines remain distinct</text><g><circle cx="395" cy="293" r="128" fill="#dceafa" fill-opacity=".78" stroke="#245f77" stroke-width="3"/><circle cx="605" cy="293" r="128" fill="#dcf3e7" fill-opacity=".78" stroke="#245f77" stroke-width="3"/><circle cx="500" cy="390" r="128" fill="#fff0d7" fill-opacity=".78" stroke="#245f77" stroke-width="3"/><text x="325" y="270" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="23" font-weight="700">Economic</text><text x="675" y="270" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="23" font-weight="700">Environment</text><text x="500" y="465" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="23" font-weight="700">Social</text><rect x="440" y="326" width="120" height="48" fill="#fff" stroke="#225f78" stroke-width="2" rx="10"/><text x="500" y="356" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="22" font-weight="700">TBL fit</text><text x="500" y="525" fill="#9a4b30" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="400">No safety or legal gate can be traded for a high score</text></g></svg>