<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">SMART operational requirements: independent acceptance</title><desc id="desc">Operational acceptance has priority-order visibility 96 percent against 95 percent target passed, while supplier confirmations are 82 percent against 90 percent target and remain failed.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1000" height="103" rx="0" fill="#173e56" stroke="none" stroke-width="1.5"/><text x="32" y="42" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Technology Trends</text><text x="32" y="79" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" fill="#fff">SMART operational requirements: independent acceptance</text> <text x="58" y="155" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" fill="#173d51" font-weight="700">Strategic promise → tactical workflow → measurable operational test</text><rect x="55" y="187" width="886" height="134" rx="12" fill="#e6f3ea" stroke="none" stroke-width="1.5"/><text x="79" y="224" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#174d38" font-weight="700">Priority order status</text><rect x="676" y="204" width="234" height="35" rx="18" fill="#d8efe0" stroke="none" stroke-width="1.5"/><text x="793" y="228" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="middle" fill="#24634d" font-weight="700">PASS · 96% vs 95%</text><rect x="80" y="253" width="789" height="36" rx="8" fill="#e8eef3" stroke="none" stroke-width="1.5"/><rect x="80" y="253" width="757.44" height="36" rx="8" fill="#409678" stroke="none" stroke-width="1.5"/><rect x="55" y="349" width="886" height="134" rx="12" fill="#f9e6df" stroke="none" stroke-width="1.5"/><text x="79" y="3