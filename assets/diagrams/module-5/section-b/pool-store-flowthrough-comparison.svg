<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="B07-title B07-desc"><title id="B07-title">Pool, Direct-Store, Store, and Flow-Through Fulfillment</title><desc id="B07-desc">Four fulfillment-pattern comparison: pool, direct-store, store fulfillment, and flow-through.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#6b7280}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#6b7280}.tiny{font-size:11px;fill:#6b7280}.box{fill:#ffffff;stroke:#1f2937;stroke-width:2}.soft{fill:#f3f4f6;stroke:#1f2937;stroke-width:1.8}.axis{stroke:#6b7280;stroke-width:1.5}</style><rect width="1160" height="696" fill="white"/><text x="40" y="45" class="title">Pool, Direct-Store, Store, and Flow-Through Fulfillment</text><text x="40" y="78" class="subtitle">B07 · HarborPeak Equipment Systems · original learning visual</text><rect x="45" y="170" width="250" height="400" rx="16" class="soft"/><text x="170" y="215.0" text-anchor="middle" class="label">Pool</text><text x="67" y="285" class="small">Flow logic</text><text x="170" y="310.0" text-anchor="middle" class="small">Aggregate inventory at a</text><text x="170" y="328.0" text-anchor="middle" class="small">pooled node</text><text x="67" y="380" class="small">Best when</text><text x="170" y="405.0" text-anchor="middle" class="small">Medium inventory</text><text x="170" y="423.0" text-anchor="middle" class="small">duplication</text><text x="67" y="475" class="small">Watch</text><text x="170" y="509.0" text-anchor="middle" class="small">Fast regional response</text><rect x="323" y="170" width="250" height="400" rx="16" class="box"/><text x="448" y="215.0" text-anchor="middle" class="label">Direct-store</text><text x="345" y="285" class="small">Flow logic</text><text x="448" y="310.0" text-anchor="middle" class="small">Supplier/DC sends directly</text><text x="448" y="328.0" text-anchor="middle" class="small">to stores</text><text x="345" y="380" class="small">Best when</text><text x="448" y="414.0" text-anchor="middle" class="small">Lower intermediate handling</text><text x="345" y="475" class="small">Watch</text><text x="448" y="509.0" text-anchor="middle" class="small">Store receiving complexity</text><rect x="601" y="170" width="250" height="400" rx="16" class="soft"/><text x="726" y="215.0" text-anchor="middle" class="label">Store fulfillment</text><text x="623" y="285" class="small">Flow logic</text><text x="726" y="310.0" text-anchor="middle" class="small">Store ships local customer</text><text x="726" y="328.0" text-anchor="middle" class="small">orders</text><text x="623" y="380" class="small">Best when</text><text x="726" y="414.0" text-anchor="middle" class="small">Uses local inventory</text><text x="623" y="475" class="small">Watch</text><text x="726" y="500.0" text-anchor="middle" class="small">High picking/parcel</text><text x="726" y="518.0" text-anchor="middle" class="small">intensity</text><rect x="879" y="170" width="250" height="400" rx="16" class="box"/><text x="1004" y="215.0" text-anchor="middle" class="label">Flow-through</text><text x="901" y="285" class="small">Flow logic</text><text x="1004" y="310.0" text-anchor="middle" class="small">Rapid transfer with little</text><text x="1004" y="328.0" text-anchor="middle" class="small">storage</text><text x="901" y="380" class="small">Best when</text><text x="1004" y="414.0" text-anchor="middle" class="small">Low dwell time</text><text x="901" y="475" class="small">Watch</text><text x="1004" y="500.0" text-anchor="middle" class="small">Requires synchronized</text><text x="1004" y="518.0" text-anchor="middle" class="small">arrivals</text><text x="40" y="675" class="tiny">Illustrative learning model — not operational or legal advice</text></svg>