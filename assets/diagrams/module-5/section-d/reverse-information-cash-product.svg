<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Reverse information cash and product flows</title><desc id="desc">Parallel product, information, and cash flows linked by a common return case.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#17324D">Three Flows Must Reconcile</text><rect x="110" y="180" width="220" height="90" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="220" y="218" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#17324D">PRODUCT</text><text x="220" y="246" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D">returned unit / component / material</text><line x1="330" y1="225" x2="830" y2="225" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="830" y="180" width="220" height="90" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="940" y="212" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#17324D"><tspan x="940" dy="0">Final disposition</tspan><tspan x="940" dy="24">and settlement</tspan></text><rect x="110" y="320" width="220" height="90" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="220" y="358" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#17324D">INFORMATION</text><text x="220" y="386" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D">identity / reason / status / evidence</text><line x1="330" y1="365" x2="830" y2="365" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="830" y="320" width="220" height="90" rx="16" fill="#F3F5F7" stroke="#17324D" stroke-width="2"/><text x="940" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#17324D"><tspan x="940" dy="0">Final disposition</tspan><tspan x="940" dy="24">and settlement</tspan></text><rect x="110" y="460" width="220" height="90" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="220" y="498" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#17324D">CASH</text><text x="220" y="526" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D">refund / credit / fee / recovery value</text><line x1="330" y1="505" x2="830" y2="505" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="830" y="460" width="220" height="90" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="940" y="492" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#17324D"><tspan x="940" dy="0">Final disposition</tspan><tspan x="940" dy="24">and settlement</tspan></text><rect x="430" y="585" width="300" height="60" rx="16" fill="#FFF4D8" stroke="#C98516" stroke-width="2"/><text x="580" y="622" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">One case ID links all three flows</text></svg>