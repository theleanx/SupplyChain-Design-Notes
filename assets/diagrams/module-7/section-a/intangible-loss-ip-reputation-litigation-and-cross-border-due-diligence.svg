<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc"><title id="title">Intangible Loss: Intellectual Property, Reputation, and Cross-Border Due Diligence</title><desc id="desc">Intangible loss controls span engineering access, partner provenance, legal rights, and incident assurance.</desc><rect width="1160" height="690" fill="#ffffff"/><rect width="1160" height="12" fill="#0b6a89"/><text x="56" y="54" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">Intangible Loss: Intellectual Property, Reputation, and</text><text x="56" y="86" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">Cross-Border Due Diligence</text><text x="56" y="118" fill="#647786" font-size="16" font-family="Arial,sans-serif">Intangible loss controls span engineering access, partner provenance, legal rights, and incident assurance.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#50889b" stroke-width="1.5"/></marker></defs><text x="56" y="660" fill="#607481" font-size="15" font-family="Arial,sans-serif">Stonebridge Industrial Components  ·  Original fictional risk-control model  ·  Module 7 / A12</text><rect x="410" y="145" width="340" height="100" rx="17" fill="#eaf4f8" stroke="#0b7189" stroke-width="2.3"/><text x="580.0" y="187.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Protected design</text><text x="580.0" y="216.105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">data / reputation</text><rect x="44" y="305" width="338" height="122" rx="17" fill="#e5f4ee" stroke="#0b7189" stroke-width="2.3"/><text x="213.0" y="358.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Need-based access</text><text x="213.0" y="387