<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Trade-agreement integration ladder</title><desc id="desc">A conceptual ladder from no preference through progressively deeper forms of regional economic integration.</desc>
<rect width="1160" height="696" fill="#ffffff"/>
<text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Trade-agreement integration ladder</text>
<g font-family="Arial, sans-serif"><rect x="90" y="490" width="170" height="120" rx="12" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="175.0" y="532" text-anchor="middle" font-size="17" fill="#17324d">No preference</text><text x="175.0" y="560" text-anchor="middle" font-size="13" fill="#4f6475">MFN / normal treatment</text><rect x="280" y="415" width="170" height="125" rx="12" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="365.0" y="457" text-anchor="middle" font-size="17" fill="#17324d">Preferential agreement</text><text x="365.0" y="485" text-anchor="middle" font-size="13" fill="#4f6475">reduced barriers for qualifying trade</text><rect x="470" y="340" width="170" height="130" rx="12" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="555.0" y="382" text-anchor="middle" font-size="17" fill="#17324d">Free-trade area</text><text x="555.0" y="410" text-anchor="middle" font-size="13" fill="#4f6475">member preference + own external tariffs</text><rect x="660" y="265" width="170" height="135" rx="12" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="745.0" y="307" text-anchor="middle" font-size="17" fill="#17324d">Customs union</text><text x="745.0" y="335" text-anchor="middle" font-size="13" fill="#4f6475">common external tariff</text><rect x="850" y="190" width="170" height="140" rx="12" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="935.0" y="232" text-anchor="middle" font-size="17" fill="#17324d">Common / economic market</text><text x="935.0" y="260" text-anchor="middle" font-size="13" fill="#4f6475">deeper integration</text></g>
</svg>