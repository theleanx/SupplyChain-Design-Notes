<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="625" viewBox="0 0 1120 625" role="img" aria-labelledby="title desc"><title id="title">AlderGate base network capacity and sustainability comparison</title><desc id="desc">At a base requirement of 1000 units per week, central has 1200 weekly capacity and 139 modeled tCO2e per year, regional has 1100 weekly capacity and 109 tCO2e, low cost has only 850 weekly capacity, 101 tCO2e and a failed worker safety gate. Regional is lowest cost feasible at 575000 dollars a year versus central 625000.</desc><rect width="1120" height="625" fill="#fff"/><rect width="1120" height="105" fill="#173e56"/><text x="36" y="45" font-family="Arial" font-size="27" font-weight="bold" fill="#fff">AlderGate · capacity before cost or footprint ranking</text><text x="36" y="81" font-family="Arial" font-size="20" fill="#fff">One regional market · 1,000 units/week base · annual network costs</text>
<g font-family="Arial" fill="#173e50"><text x="230" y="157" text-anchor="middle" font-size="21" font-weight="bold">Option</text><text x="527" y="157" text-anchor="middle" font-size="21" font-weight="bold">Capacity / required</text><text x="822" y="157" text-anchor="middle" font-size="21" font-weight="bold">Annual cost</text><text x="1040" y="157" text-anchor="end" font-size="21" font-weight="bold">CO₂e (t/yr)</text></g>
<g font-family="Arial" font-size="23" fill="#173e50">
<rect x="44" y="188" width="1031" height="101" rx="14" fill="#eef2f7"/><text x="75" y="225" font-weight="bold">Central</text><text x="75" y="259">Eligible</text><text x="510" y="245" text-anchor="middle">1,200 / 1,000</text><text x="818" y="245" text-anchor="middle">$625,000</text><text x="1020" y="245" text-anchor="end">139</text>
<rect x="44" y="309" width="1031" height="101" rx="14" fill="#e1f3e7"/><text x="75" y="346" font-weight="bold">Regional</text><text x="75" y="380">Preferred eligible</text><text x="510" y="366" text-anchor="middle">1,100 / 1,000</text><text x="818" y="366" text-anchor="middle">$575,000</text><text x="1020" y="366" text-anchor="end">109</text>
<rect x="44" y="431" width="1031" height="101" rx="14" fill="#fae7e1"/><text x="75" y="468" font-weight="bold">Low-cost</text><text x="75" y="503" fill="#ae4133">BLOCKED</text><text x="510" y="485" text-anchor="middle">850 / 1,000</text><text x="818" y="485" text-anchor="middle">$520,000</text><text x="1020" y="485" text-anchor="end">101</text>
<text x="558" y="575" text-anchor="middle" font-size="19" fill="#894034">At 1,200-unit stress: regional falls short by 100/week; base footprint model must be recalculated</text>
</g></svg>