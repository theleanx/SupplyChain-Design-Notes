  </text>
  <line x1="235" y1="428.0" x2="263" y2="428.0" stroke="#587d96" stroke-width="2" stroke-dasharray="5 5" />
  <rect x="263" y="348.0" width="125" height="80.0" rx="6" fill="#2a9d8f" />
  <text x="325.5" y="336.0" class="label" text-anchor="middle">
    <tspan x="325.5" y="336.0">+20</tspan>
  </text>
  <text x="325.5" y="615" class="small" text-anchor="middle">
    <tspan x="325.5" y="615">Conversion</tspan>
  </text>
  <line x1="388" y1="348.0" x2="416" y2="348.0" stroke="#587d96" stroke-width="2" stroke-dasharray="5 5" />
  <rect x="416" y="300.0" width="125" height="48.0" rx="6" fill="#2a9d8f" />
  <text x="478.5" y="288.0" class="label" text-anchor="middle">
