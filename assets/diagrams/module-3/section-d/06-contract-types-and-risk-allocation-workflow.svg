<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Contract Types and Risk Allocation</title>
  <desc id="desc">Place cost and performance risk with the party best able to control it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">RISK-ALLOCATION CONTINUUM</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Contract Types and Risk Allocation</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Place cost and performance risk with the party best able to control it.</tspan>
  </text>
  <line x1="110" y1="340" x2="1090" y2="340" stroke="#587d96" stroke-width="14" stroke-linecap="round" />
  <circle cx="140.0" cy="340" r="24" fill="#176b87" stroke="#ffffff" stroke-width="5" />
  <g>
    <rect x="30" y="175" width="220" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="50" y="209" class="label" text-anchor="start">
      <tspan x="50" y="209">Cost reimbursable</tspan>
    </text>
    <text x="50" y="243" class="body" text-anchor="start">
      <tspan x="50" y="243">Buyer bears cost risk</tspan>
    </text>
  </g>
  <line x1="140.0" y1="315" x2="140.0" y2="295" stroke="#587d96" stroke-width="2" />
  <circle cx="370.0" cy="340" r="24" fill="#2a9d8f" stroke="#ffffff" stroke-width="5" />
  <g>
    <rect x="260" y="430" width="220" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="280" y="464" class="label" text-anchor="start">
      <tspan x="280" y="464">Time and materials</tspan>
    </text>
    <text x="280" y="498" class="body" text-anchor="start">
      <tspan x="280" y="498">Shared exposure</tspan>
    </text>
  </g>
  <line x1="370.0" y1="365" x2="370.0" y2="430" stroke="#587d96" stroke-width="2" />
  <circle cx="600.0" cy="340" r="24" fill="#e9b949" stroke="#ffffff" stroke-width="5" />
  <g>
    <rect x="490" y="175" width="220" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="510" y="209" class="label" text-anchor="start">
      <tspan x="510" y="209">Unit rate</tspan>
    </text>
    <text x="510" y="243" class="body" text-anchor="start">
      <tspan x="510" y="243">Volume remains</tspan>
      <tspan x="510" y="266">variable</tspan>
    </text>
  </g>
  <line x1="600.0" y1="315" x2="600.0" y2="295" stroke="#587d96" stroke-width="2" />
  <circle cx="830.0" cy="340" r="24" fill="#e76f51" stroke="#ffffff" stroke-width="5" />
  <g>
    <rect x="720" y="430" width="220" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="740" y="464" class="label" text-anchor="start">
      <tspan x="740" y="464">Fixed price</tspan>
    </text>
    <text x="740" y="498" class="body" text-anchor="start">
      <tspan x="740" y="498">Supplier bears cost</tspan>
      <tspan x="740" y="521">risk</tspan>
    </text>
  </g>
  <line x1="830.0" y1="365" x2="830.0" y2="430" stroke="#587d96" stroke-width="2" />
  <circle cx="1060.0" cy="340" r="24" fill="#176b87" stroke="#ffffff" stroke-width="5" />
  <g>
    <rect x="950" y="175" width="220" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="970" y="209" class="label" text-anchor="start">
      <tspan x="970" y="209">Outcome based</tspan>
    </text>
    <text x="970" y="243" class="body" text-anchor="start">
      <tspan x="970" y="243">Payment follows</tspan>
      <tspan x="970" y="266">result</tspan>
    </text>
  </g>
  <line x1="1060.0" y1="315" x2="1060.0" y2="295" stroke="#587d96" stroke-width="2" />
  <text x="100" y="610" class="label" text-anchor="start">
    <tspan x="100" y="610">Buyer risk</tspan>
  </text>
  <text x="1100" y="610" class="label" text-anchor="end">
    <tspan x="1100" y="610">Supplier risk</tspan>
  </text>
  <path d="M320 603 H880" class="arrow" />
</svg>
