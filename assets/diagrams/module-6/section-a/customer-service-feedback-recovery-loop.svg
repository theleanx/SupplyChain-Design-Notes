<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Customer service feedback and recovery loop</title><desc id="desc">Customer-service metrics and direct feedback trigger diagnosis, recovery, confirmation, and learning in a closed relationship loop.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Customer service feedback and recovery loop</text><rect x="77.5" y="280" width="165" height="105" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="160.0" y="316.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="160.0" dy="0">Measure service</tspan></text><text x="160.0" y="349.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="160.0" dy="0">fill / OTD / OTIF /</tspan><tspan x="160.0" dy="16">response</tspan></text><line x1="242.5" y1="332" x2="287.5" y2="332" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="287.5" y="280" width="165" height="105" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="370.0" y="316.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="370.0" dy="0">Listen to customer</tspan></text><text x="370.0" y="349.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="370.0" dy="0">VOC + complaints +</tspan><tspan x="370.0" dy="16">satisfaction</tspan></text><line x1="452.5" y1="332" x2="497.5" y2="332" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="497.5" y="280" width="165" height="105" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="324.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Diagnose gap</tspan></text><text x="580.0" y="358.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">promise vs experience</tspan></text><line x1="662.5" y1="332" x2="707.5" y2="332" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="707.5" y="280" width="165" height="105" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="790.0" y="316.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="790.0" dy="0">Recover service</tspan></text><text x="790.0" y="349.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="790.0" dy="0">owner + action +</tspan><tspan x="790.0" dy="16">timing</tspan></text><line x1="872.5" y1="332" x2="917.5" y2="332" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="917.5" y="280" width="165" height="105" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="1000.0" y="316.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d"><tspan x="1000.0" dy="0">Confirm + learn</tspan></text><text x="1000.0" y="349.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="1000.0" dy="0">did trust and service</tspan><tspan x="1000.0" dy="16">recover?</tspan></text><path d="M1000.0 385 C1000.0 545, 160.0 545, 160.0 385" fill="none" stroke="#0b7189" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">A closed record links the original signal, the response, verification, and the relationship outcome.</text></svg>
