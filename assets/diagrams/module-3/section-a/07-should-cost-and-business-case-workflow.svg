  <line x1="541" y1="300.0" x2="569" y2="300.0" stroke="#587d96" stroke-width="2" stroke-dasharray="5 5" />
  <rect x="569" y="268.0" width="125" height="32.0" rx="6" fill="#2a9d8f" />
