  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Collaborative Design and Early Supplier Involvement</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Place supplier knowledge before the design freedom closes.</tspan>
  </text>
