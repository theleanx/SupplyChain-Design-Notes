<text x="217" y="511" class="h" text-anchor="start"><tspan x="217" y="511">Chain-of-custody record</tspan></text>
<text x="217" y="540" class="small" text-anchor="start"><tspan x="217" y="540">Who handled the item · where it moved · when the event occurred · what status was</tspan><tspan x="217" y="558">recorded</tspan></text>
