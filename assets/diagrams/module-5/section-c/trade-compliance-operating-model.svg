<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Trade compliance operating model</title><desc id="desc">A gated model from requirement screening through accountability, shipment release, monitoring, and evidence retention.</desc>
<rect width="1160" height="696" fill="#ffffff"/>
<text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Trade compliance operating model</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><rect x="80" y="150" width="260" height="120" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="210.0" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Screen</text><text x="210.0" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">requirements</text><text x="210.0" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">country + product</text><rect x="450" y="150" width="260" height="120" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Assign</text><text x="580.0" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">accountability</text><text x="580.0" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">owner + evidence</text><rect x="820" y="150" width="260" height="120" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="950.0" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Release /</text><text x="950.0" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">hold gate</text><text x="950.0" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">no silent exceptions</text><line x1="340" y1="210" x2="450" y2="210" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="710" y1="210" x2="820" y2="210" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><rect x="260" y="390" width="280" height="120" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="400.0" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Monitor changes</text><text x="400.0" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">rules, parties, lanes</text><rect x="650" y="390" width="280" height="120" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="790.0" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Audit evidence</text><text x="790.0" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">documents + approvals</text><line x1="540" y1="450" x2="650" y2="450" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/>
