<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="B08-title B08-desc"><title id="B08-title">Comparing Distribution Strategies</title><desc id="B08-desc">Comparison of HarborPeak fictional fulfillment strategies using service, flexibility, lead-time, and capital evidence.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#6b7280}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#6b7280}.tiny{font-size:11px;fill:#6b7280}.box{fill:#ffffff;stroke:#1f2937;stroke-width:2}.soft{fill:#f3f4f6;stroke:#1f2937;stroke-width:1.8}.axis{stroke:#6b7280;stroke-width:1.5}</style><rect width="1160" height="696" fill="white"/><text x="40" y="45" class="title">Comparing Distribution Strategies</text><text x="40" y="78" class="subtitle">B08 · HarborPeak Equipment Systems · original learning visual</text><rect x="45" y="170" width="330" height="60" class="soft"/><text x="210.0" y="204.0" text-anchor="middle" class="small">Strategy</text><rect x="375" y="170" width="130" height="60" class="soft"/><text x="440.0" y="195.0" text-anchor="middle" class="small">Lead time</text><text x="440.0" y="213.0" text-anchor="middle" class="small">(days)</text><rect x="505" y="170" width="120" height="60" class="soft"/><text x="565.0" y="204.0" text-anchor="middle" class="small">Service /5</text><rect x="625" y="170" width="120" height="60" class="soft"/><text x="685.0" y="204.0" text-anchor="middle" class="small">Flexibility /5</text><rect x="745" y="170" width="150" height="60" class="soft"/><text x="820.0" y="204.0" text-anchor="middle" class="small">Capital $k</text><rect x="895" y="170" width="120" height="60" class="soft"/><text x="955.0" y="204.0" text-anchor="middle" class="small">Gate</text><rect x="45" y="230" width="330" height="72" class="soft"/><text x="210.0" y="270.0" text-anchor="middle" class="label">Integrated national DC