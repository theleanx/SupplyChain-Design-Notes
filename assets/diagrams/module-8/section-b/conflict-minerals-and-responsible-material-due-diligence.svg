<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">3TG documentation is not conflict-free status</title><desc id="desc">Stacked 120-part documentation band, 110 sufficient records and 10 pending records; SEC filing applicability remains a separate legal decision.</desc><rect x="0" y="0" width="1000" height="100" fill="#173d55" stroke="#173d55" stroke-width="2" rx="0"/><text x="35" y="45" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="26" font-weight="700">CSCP Module 8 · Section B</text><text x="35" y="79" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="23" font-weight="400">3TG documentation is not conflict-free status</text><g><text x="85" y="172" fill="#17374b" font-family="Arial, sans-serif" text-anchor="start" font-size="24" font-weight="700">Engineered BOM: 120 parts screened</text><rect x="85" y="213" width="825" height="106" fill="#e9edea" stroke="#245f77" stroke-width="2" rx="15"/><rect x="85" y="213" width="756" height="106" fill="#ceeade" stroke="#245f77" stroke-width="2" rx="15"/><rect x="841" y="213" width="69" height="106" fill="#f2c4b8" stroke="#245f77" stroke-width="2" rx="15"/><text x="450" y="278" fill="#235e47" font-family="Arial, sans-serif" text-anchor="middle" font-size="26" font-weight="700">110 evidenced</text><text x="872" y="278" fill="#8d382c" font-family="Arial, sans-serif" text-anchor="middle" font-size="25" font-weight="700">10</text><text x="160" y="369" fill="#17374b" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="400">91.67% documentation coverage</text><text x="160" y="409" fill="#9c4037" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="400">NOT 91.67% certified conflict-free</text><rect x="100" y="463" width="800" height="57" fill="#edf3f8" stroke="#245f77" stroke-width="2" rx="15"/><text x="500" y="499" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="400">Apply company-specific Rule 13p-1 / Form SD analysis</text></g></svg>