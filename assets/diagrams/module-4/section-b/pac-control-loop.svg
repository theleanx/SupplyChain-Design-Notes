<line x1="420" y1="475" x2="205" y2="345" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<text x="600" y="630" class="h" text-anchor="middle"><tspan x="600" y="630">Production activity control closes the execution feedback loop.</tspan></text>
