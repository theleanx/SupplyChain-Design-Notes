<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Critical path: identity mapping, test and acceptance</title><desc id="desc">Critical project path is 8 days identity mapping then 5 days integration testing then 4 days operating acceptance equals 17 days. Hardware requires 6 days in parallel and does not govern completion.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1000" height="103" rx="0" fill="#173e56" stroke="none" stroke-width="1.5"/><text x="32" y="42" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Technology Trends</text><text x="32" y="79" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start" fill="#fff">Critical path: identity mapping, test and acceptance</text> <text x="61" y="146" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start" fill="#163e52" font-weight="700">Critical path · 17 working days under modeled dependencies</text><rect x="66" y="207" width="401" height="73" rx="12" fill="#d9eafb" stroke="none" stroke-width="1.5"/><text x="266" y="253" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle" fill="#214e72" font-weight="700">Identity mapping · 8d</text><rect x="483" y="207" width="259" height="73" rx="12" fill="#d8eee3" stroke="none" stroke-width="1.5"/><text x="612" y="253" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#23684f" font-weight="700">Integration · 5d</text><rect x="760" y="207" width="171" height="73" rx="12" fill="#d8eee3" stroke="none" stroke-width="1.5"/><text x="844" y="253" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle" fill="#23684f" font-weight="700">Accept · 4d</text><line x1="467" y1="241" x2="483" y2="241" stroke="#2a6c80" stroke-width="4"/><line x1="742" y1="241" x2="760" y2="241" stroke="#2a6c80" stroke-width="4"/><rect x="66" y="346" width="300" height="84" rx="12" fill="#f8edda" stroke="none" stroke-width="1.5"/><text x="216" y="381" font-family="Arial,Helvetica,sans-serif" font-size="23" text-anchor="middle" fill="#8a6530" font-weight="700">Hardware · 6d</text><text x="216" y="411" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" fill="#8a6530">Parallel predecessor</text><text x="500" y="480" font-family="Arial,Helvetica,sans-serif" font-size="25" text-anchor="middle" fill="#173e56" font-weight="700">8 + 5 + 4 = 17 days (governing path)</text><text x="500" y="532" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" fill="#476779">Real calendars, shared resources and approved changes may shift timing</text><line x1="32" y1="564" x2="968" y2="564" stroke="#d4e0e8" stroke-width="2"/><text x="500" y="587" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" fill="#466475">AlderGate Motion Products · fictional training data · check every mandatory gate</text><g stroke="#1d6d82" stroke-width="3" fill="none"><path d="M468 278 L483 278 L476 271 M483 278 L476 285"/><path d="M745 278 L759 278 L751 271 M759 278 L751 285"/></g><text x="216" y="454" font-family="Arial" font-size="18" fill="#85633a" text-anchor="middle">Independent hardware workstream</text></svg>