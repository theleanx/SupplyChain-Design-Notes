<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">International labor control matrix</title><desc id="desc">A matrix linking legal or policy expectations to evidence, worker signals, and corrective actions.</desc>
<rect width="1160" height="696" fill="#ffffff"/>
<text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">International labor control matrix</text>
<g font-family="Arial, sans-serif"><rect x="55" y="130" width="250" height="70" fill="#eaf4f8" stroke="#0b7189"/><text x="180" y="172" text-anchor="middle" font-size="18" fill="#17324d">Law / standard</text><rect x="325" y="130" width="250" height="70" fill="#eaf4f8" stroke="#0b7189"/><text x="450" y="172" text-anchor="middle" font-size="18" fill="#17324d">Supplier evidence</text><rect x="595" y="130" width="250" height="70" fill="#eaf4f8" stroke="#0b7189"/><text x="720" y="172" text-anchor="middle" font-size="18" fill="#17324d">Worker signal</text><rect x="865" y="130" width="250" height="70" fill="#eaf4f8" stroke="#0b7189"/><text x="990" y="172" text-anchor="middle" font-size="18" fill="#17324d">Corrective action</text><text x="70" y="266" font-size="18" fill="#17324d">Wages + hours</text><rect x="325" y="220" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><rect x="595" y="220" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><rect x="865" y="220" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><text x="70" y="358" font-size="18" fill="#17324d">Freedom of association</text><rect x="325" y="312" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><rect x="595" y="312" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><rect x="865" y="312" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><text x="70" y="450" font-size="18" fill="#17324d">Forced / child labor</text><rect x="325" y="404" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><rect x="595" y="404" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><rect x="865" y="404" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><text x="70" y="542" font-size="18" fill="#17324d">Safety + health</text><rect x="325" y="496" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><rect x="595" y="496" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/><rect x="865" y="496" width="250" height="74" rx="8" fill="#ffffff" stroke="#b6c2cc"/></g>
</svg>