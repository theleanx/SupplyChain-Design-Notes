<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Supply and demand equilibrium</title><desc id="desc">Original educational visualization created for the Supply Chain Design Notes repository.</desc>
<style>
.text{font-family:Arial,Helvetica,sans-serif;fill:#172033} .muted{fill:#596579} .grid{stroke:#d9dee8;stroke-width:1} .axis{stroke:#606b7d;stroke-width:2} .line1{stroke:#245a8d;stroke-width:4;fill:none} .line2{stroke:#2a8b7b;stroke-width:4;fill:none} .line3{stroke:#b7791f;stroke-width:4;fill:none} .dash{stroke:#7b8799;stroke-width:3;stroke-dasharray:10 8;fill:none} .card{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.5} .accent{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.5}
</style><rect x="0" y="0" width="960" height="520" fill="white"/>
<text class="text" x="70" y="42" font-size="24" font-weight="700">Microeconomics: price helps balance supply and demand</text>
<line class="axis" x1="120" y1="430" x2="850" y2="430"/><line class="axis" x1="120" y1="430" x2="120" y2="90"/>
<text class="text" x="410" y="485" font-size="18">Quantity →</text><text class="text" transform="translate(45 315) rotate(-90)" font-size="18">Price</text>
<path class="line1" d="M160 120 L800 395"/><path class="line2" d="M160 395 L800 120"/>
<text class="text" x="690" y="365" font-size="17" font-weight="700">Demand</text><text class="text" x="690" y="145" font-size="17" font-weight="700">Supply</text>
<circle cx="480" cy="257" r="8" fill="#b7791f"/><line x1="480" y1="257" x2="480" y2="430" stroke="#b7791f" stroke-dasharray="6 5"/><line x1="120" y1="257" x2="480" y2="257" stroke="#b7791f" stroke-dasharray="6 5"/>
<text class="text" x="495" y="245" font-size="15" font-weight="700">Equilibrium</text><text class="muted" x="492" y="273" font-size="13">quantity supplied = quantity demanded</text>
<rect class="card" x="585" y="205" width="260" height="72" rx="10"/><text class="text" x="605" y="229" font-size="14" font-weight="700">If price is too high</text><text class="muted" x="605" y="250" font-size="13">surplus pressure tends to push price down</text>
<rect class="card" x="585" y="292" width="260" height="72" rx="10"/><text class="text" x="605" y="316" font-size="14" font-weight="700">If price is too low</text><text class="muted" x="605" y="337" font-size="13">shortage pressure tends to push price up</text></svg>