<text x="55" y="82" class="titleXs" text-anchor="start"><tspan x="55" y="82">Lean Operating System: House of Toyota, VSM, Kaizen, 5S, Setup Reduction, TPM, Muda/Mura/Muri</tspan></text>
<text x="55" y="111" class="subtitleSm" text-anchor="start"><tspan x="55" y="111">Original decision visual for lean operating system: house of toyota, vsm, kaizen, 5s, setup reduction, tpm, muda/mura/muri, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
<text x="55" y="150" class="h" text-anchor="start"><tspan x="55" y="150">Lean operating system: practices reinforce one another</tspan></text>
<rect x="240.0" y="205" width="720" height="68" rx="8" fill="#E8F5EF" stroke="#FFFFFF" stroke-width="2" opacity="1"/>
<text x="265.0" y="234" class="h" text-anchor="start"><tspan x="265.0" y="234">Customer value</tspan></text>
<text x="935.0" y="234" class="small" text-anchor="end"><tspan x="935.0" y="234">quality · short lead time · stable delivery</tspan></text>
<rect x="200.0" y="287" width="800" height="68" rx="8" fill="#EAF4F8" stroke="#FFFFFF" stroke-width="2" opacity="1"/>
<text x="225.0" y="316" class="h" text-anchor="start"><tspan x="225.0" y="316">Flow + pull</tspan></text>
<text x="975.0" y="316" class="small" text-anchor="end"><tspan x="975.0" y="316">JIT · visual signals · small batches</tspan></text>
<rect x="160.0" y="369" width="880" height="68" rx="8" fill="#FFF4D8" stroke="#FFFFFF" stroke-width="2" opacity="1"/>
<text x="185.0" y="398" class="h" text-anchor="start"><tspan x="185.0" y="398">Built-in quality</tspan></text>
<text x="1015.0" y="398" class="small" text-anchor="end"><tspan x="1015.0" y="398">stop and solve · standard work</tspan></text>
<rect x="120.0" y="451" width="960" height="68" rx="8" fill="#F1EEFA" stroke="#FFFFFF" stroke-width="2" opacity="1"/>
<text x="145.0" y="480" class="h" text-anchor="start"><tspan x="145.0" y="480">Improvement practices</tspan></text>
<text x="1055.0" y="480" class="small" text-anchor="end"><tspan x="1055.0" y="480">VSM · kaizen · setup reduction · 5S · TPM</tspan></text>
<rect x="80.0" y="533" width="1040" height="68" rx="8" fill="#EDF2F6" stroke="#FFFFFF" stroke-width="2" opacity="1"/>
<text x="105.0" y="562" class="h" text-anchor="start"><tspan x="105.0" y="562">Stability foundation</tspan></text>
<text x="1095.0" y="562" class="small" text-anchor="end"><tspan x="1095.0" y="562">leveled work · reliable equipment · capable people</tspan></text>
<text x="600" y="655" class="small" text-anchor="middle"><tspan x="600" y="655">Muda, mura, and muri are treated as system conditions—not isolated worker problems.</tspan></text>
