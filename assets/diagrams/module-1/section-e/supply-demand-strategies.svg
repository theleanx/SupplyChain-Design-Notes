<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Supply Demand Strategies</title><desc id="desc">Original comparison of make-to-stock, assemble-to-order, make-to-order, engineer-to-order, and package-to-order environments.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">Customer-order point determines what is stocked and what is delayed</text>
<line x1="120" y1="120" x2="1000" y2="120" stroke="#606b7d" stroke-width="3"/><text class="s" x="120" y="95">Earlier work before order</text><text class="s" x="865" y="95">More work after order</text>
<g><rect class="blue" x="90" y="180" width="180" height="300" rx="14"/><text class="h" x="180" y="215" text-anchor="middle">MTS</text><text class="s" x="115" y="255">Stock:</text><text class="s" x="115" y="280">finished goods</text><text class="s" x="115" y="335">Fast response</text><text class="s" x="115" y="360">More inventory risk</text>
<rect class="green" x="285" y="180" width="180" height="300" rx="14"/><text class="h" x="375" y="215" text-anchor="middle">ATO</text><text class="s" x="310" y="255">Stock:</text><text class="s" x="310" y="280">common modules</text><text class="s" x="310" y="335">Configure after order</text><text class="s" x="310" y="360">Mass customization</text>
<rect class="gold" x="480" y="180" width="180" height="300" rx="14"/><text class="h" x="570" y="215" text-anchor="middle">MTO</text><text class="s" x="505" y="255">Stock:</text><text class="s" x="505" y="280">raw/common inputs</text><text class="s" x="505" y="335">Make after order</text><text class="s" x="505" y="360">Longer lead time</text>
<rect class="purple" x="675" y="180" width="180" height="300" rx="14"/><text class="h" x="765" y="215" text-anchor="middle">ETO</text><text class="s" x="700" y="255">Order triggers:</text><text class="s" x="700" y="280">engineering + supply</text><text class="s" x="700" y="335">Highest customization</text><text class="s" x="700" y="360">Project-like flow</text>
<rect class="red" x="870" y="180" width="180" height="300" rx="14"/><text class="h" x="960" y="215" text-anchor="middle">PTO</text><text class="s" x="895" y="255">Common item</text><text class="s" x="895" y="280">already available</text><text class="s" x="895" y="335">Package / label</text><text class="s" x="895" y="360">after order</text></g>
<text class="s" x="90" y="540">The environments are different ways of postponing commitment — not a ranking from best to worst.</text>
</svg>
