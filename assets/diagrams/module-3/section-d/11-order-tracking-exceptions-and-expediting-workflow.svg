<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Order Tracking, Exceptions, and Expediting</title>
  <desc id="desc">Use a control-tower view to act on exceptions instead of chasing every order.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">EXCEPTION MANAGEMENT</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Order Tracking, Exceptions, and Expediting</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Use a control-tower view to act on exceptions instead of chasing every order.</tspan>
  </text>
  <circle cx="600" cy="390" r="105" fill="#dceef2" stroke="#176b87" stroke-width="3" />
  <text x="600" y="380" class="label" text-anchor="middle">
    <tspan x="600" y="380">Exception</tspan>
    <tspan x="600" y="403">control tower</tspan>
  </text>
  <path d="M600 280 L600 245" class="arrow" />
  <g>
    <rect x="485" y="125" width="230" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="505" y="159" class="label" text-anchor="start">
      <tspan x="505" y="159">Supplier signal</tspan>
    </text>
    <text x="505" y="193" class="body" text-anchor="start">
      <tspan x="505" y="193">Commit and ship status</tspan>
    </text>
  </g>
  <path d="M705 356 L814 345" class="arrow" />
  <g>
    <rect x="798" y="266" width="230" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="818" y="300" class="label" text-anchor="start">
      <tspan x="818" y="300">Demand priority</tspan>
    </text>
    <text x="818" y="334" class="body" text-anchor="start">
      <tspan x="818" y="334">Customer and</tspan>
      <tspan x="818" y="357">production impact</tspan>
    </text>
  </g>
  <path d="M665 479 L732 507" class="arrow" />
  <g>
    <rect x="678" y="495" width="230" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="698" y="529" class="label" text-anchor="start">
      <tspan x="698" y="529">Material flow</tspan>
    </text>
    <text x="698" y="563" class="body" text-anchor="start">
      <tspan x="698" y="563">Transit and receipt</tspan>
    </text>
  </g>
  <path d="M535 479 L468 507" class="arrow" />
  <g>
    <rect x="291" y="495" width="230" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="311" y="529" class="label" text-anchor="start">
      <tspan x="311" y="529">Response</tspan>
    </text>
    <text x="311" y="563" class="body" text-anchor="start">
      <tspan x="311" y="563">Recover, reallocate,</tspan>
      <tspan x="311" y="586">escalate</tspan>
    </text>
  </g>
  <path d="M495 356 L386 345" class="arrow" />
  <g>
    <rect x="171" y="266" width="230" height="120" rx="16" fill="#ffffff" stroke="#587d96" stroke-width="2" />
    <text x="191" y="300" class="label" text-anchor="start">
      <tspan x="191" y="300">Learning</tspan>
    </text>
    <text x="191" y="334" class="body" text-anchor="start">
      <tspan x="191" y="334">Root cause and</tspan>
      <tspan x="191" y="357">prevention</tspan>
    </text>
  </g>
</svg>
