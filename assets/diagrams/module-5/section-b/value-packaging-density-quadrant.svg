<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="B11-title B11-desc"><title id="B11-title">Transportation Mode Selection and Value/Packaging Density</title><desc id="B11-desc">Value-density versus packaging-density using locked fictional shipment data.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#6b7280}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#6b7280}.tiny{font-size:11px;fill:#6b7280}.box{fill:#fff;stroke:#1f2937;stroke-width:2}.soft{fill:#f3f4f6;stroke:#1f2937;stroke-width:1.8}.line{stroke:#1f2937;stroke-width:2;fill:none}.dash{stroke:#6b7280;stroke-width:2;fill:none;stroke-dasharray:7 6}.axis{stroke:#6b7280;stroke-width:1.5}</style><rect width="1160" height="696" fill="#fff"/><text x="40" y="45" class="title">Transportation Mode Selection and Value/Packaging Density</text><text x="40" y="78" class="subtitle">B11 · HarborPeak Equipment Systems · original learning visual</text><defs><marker id="arrow-B11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#1f2937"/></marker></defs><line x1="150" y1="560" x2="770" y2="560" class="axis"/><line x1="150" y1="560" x2="150" y2="165" class="axis"/><line x1="460" y1="165" x2="460" y2="560" class="dash"/><line x1="150" y1="360" x2="770" y2="360" class="dash"/><circle cx="740.0" cy="195.0" r="12" class="soft"/><text x="758.0" y="199.0" class="small">SHP-501</text><circle cx="386.0" cy="509.38666666666666" r="14" class="box"/><text x="404.0" y="513.3866666666667" class="small">SHP-502</text><circle cx="207.82" cy="550.3163066666667" r="16" class="soft"/><text x="225.82" y="554.3163066666667" class="small">SHP-503</text><circle cx="740.0" cy="355.37881" r="18" class="box"/><text x="758.0" y="359.37881" class="small">SHP-504</text><text x="460" y="610" text-anchor=