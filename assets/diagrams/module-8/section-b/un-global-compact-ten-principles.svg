<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">UN Global Compact · Ten Principles</title><desc id="desc">Four vertical categories display two human-rights, four labour, three environment, and one anti-corruption principles; these are voluntary principles not a certification.</desc><rect x="0" y="0" width="1000" height="100" fill="#173d55" stroke="#173d55" stroke-width="2" rx="0"/><text x="35" y="45" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="26" font-weight="700">CSCP Module 8 · Section B</text><text x="35" y="79" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="23" font-weight="400">UN Global Compact · Ten Principles</text><g><rect x="65" y="355" width="210" height="120" fill="#dfeefa" stroke="#245f77" stroke-width="2" rx="15"/><text x="170" y="510" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="700">Human rights</text><text x="170" y="343" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="23" font-weight="700">2 principles</text><rect x="302" y="235" width="210" height="240" fill="#d9f0e4" stroke="#245f77" stroke-width="2" rx="15"/><text x="407" y="510" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="700">Labour</text><text x="407" y="223" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="23" font-weight="700">4 principles</text><rect x="539" y="295" width="210" height="180" fill="#edf3df" stroke="#245f77" stroke-width="2" rx="15"/><text x="644" y="510" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="700">Environment</text><text x="644" y="283" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="23" font-weight="700">3 principles</text><rect x="776" y="415" width="210" height="60" fill="#fbe8dc" stroke="#245f77" stroke-width="2" rx="15"/><text x="881" y="510" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="700">Anti-corruption</text><text x="881" y="403" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="23" font-weight="700">1 principle</text><text x="500" y="150" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="24" font-weight="700">2 + 4 + 3 + 1 = 10 voluntary principles</text></g></svg>