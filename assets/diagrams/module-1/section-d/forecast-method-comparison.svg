<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc"><title id="title">Forecast method comparison</title><desc id="desc">Original line chart comparing actual demand with moving average, weighted moving average and exponential smoothing.</desc><style>
