<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Supply Capability Options</title><desc id="desc">Original decision framework for resolving a supply and demand mismatch using prebuild, flex capacity, external capacity, or demand actions.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">When demand exceeds normal supply, build decision alternatives</text>
<rect class="blue" x="70" y="90" width="270" height="80" rx="12"/><text class="h" x="205" y="120" text-anchor="middle">Consensus demand plan</text><text class="s" x="205" y="145" text-anchor="middle">volume + mix + timing</text>
<rect class="green" x="415" y="90" width="270" height="80" rx="12"/><text class="h" x="550" y="120" text-anchor="middle">Normal supply capability</text><text class="s" x="550" y="145" text-anchor="middle">capacity + materials + labor</text>
<rect class="red" x="760" y="90" width="270" height="80" rx="12"/><text class="h" x="895" y="120" text-anchor="middle">Gap?</text><text class="s" x="895" y="145" text-anchor="middle">quantity, mix or timing</text>
<path class="line" d="M340 130H415 M685 130H760"/>
<rect class="gold" x="70" y="270" width="210" height="90" rx="12"/><text class="h" x="175" y="302" text-anchor="middle">Prebuild</text><text class="s" x="175" y="326" text-anchor="middle">inventory before peak</text>
<rect class="gold" x="315" y="270" width="210" height="90" rx="12"/><text class="h" x="420" y="302" text-anchor="middle">Flex capacity</text><text class="s" x="420" y="326" text-anchor="middle">overtime / shifts / labor</text>
<rect class="gold" x="560" y="270" width="210" height="90" rx="12"/><text class="h" x="665" y="302" text-anchor="middle">External capacity</text><text class="s" x="665" y="326" text-anchor="middle">qualified subcontracting</text>
<rect class="gold" x="805" y="270" width="210" height="90" rx="12"/><text class="h" x="910" y="302" text-anchor="middle">Demand action</text><text class="s" x="910" y="326" text-anchor="middle">delay / substitute / reduce</text>
<path class="dash" d="M895 170V225 M175 225H910 M175 225V270 M420 225V270 M665 225V270 M910 225V270"/>
<rect class="purple" x="300" y="470" width="500" height="95" rx="12"/><text class="h" x="550" y="505" text-anchor="middle">Compare total business impact</text><text class="s" x="550" y="532" text-anchor="middle">service • margin • cash • quality • risk • feasibility</text>
</svg>
