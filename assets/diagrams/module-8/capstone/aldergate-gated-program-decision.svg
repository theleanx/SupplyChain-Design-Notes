<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc"><title id="title">AlderGate Module 8 — gated strategy and implementation decision</title><desc id="desc">Six-stage original decision map: establish the 1000 unit demand promise, screen central regional and low-cost networks for capacity, check annual emissions and labor evidence, reject unprotected vendor C, verify cutover and adoption, and approve only if economic and human controls pass.</desc><rect width="1120" height="690" fill="#ffffff"/><rect width="1120" height="108" fill="#173e55"/><text x="36" y="45" font-family="Arial" font-size="28" font-weight="bold" fill="#ffffff">AlderGate · integrated Module 8 decision</text><text x="36" y="82" font-family="Arial" font-size="21" fill="#ffffff">A strategy → sustainability → technology sequence with hard gates</text>
<g font-family="Arial" font-size="19" fill="#173b4e">
<rect x="55" y="153" width="302" height="142" rx="16" fill="#e6f0fb" stroke="#326a85" stroke-width="2"/><text x="76" y="188" font-weight="bold">1 · Customer promise</text><text x="76" y="225">1,000 units/week</text><text x="76" y="256">52 weeks; one regional market</text>
<rect x="409" y="153" width="302" height="142" rx="16" fill="#e5f4ed" stroke="#326a85" stroke-width="2"/><text x="430" y="188" font-weight="bold">2 · Network gate</text><text x="430" y="225">Regional: 1,100 available</text><text x="430" y="256" fill="#ac4534">Low-cost: 850 → BLOCK</text>
<rect x="763" y="153" width="302" height="142" rx="16" fill="#e5f4ed" stroke="#326a85" stroke-width="2"/><text x="784" y="188" font-weight="bold">3 · Sustainability</text><text x="784" y="225">Regional: 109 t CO₂e/year</text><text x="784" y="256" fill="#ac4534">Evidence claims not verified</text>
<rect x="55" y="358" width="302" height="150" rx="16" fill="#e6f0fb" stroke="#326a85" stroke-width="2"/><text x="76" y="393" font-weight="bold">4 · Vendor gate</text><text x="76" y="430">B: $84k/year, protected</text><text x="76" y="461" fill="#ac4534">C: fails access → BLOCK</text>
<rect x="409" y="358" width="302" height="150" rx="16" fill="#f9e9e4" stroke="#b05342" stroke-width="2"/><text x="430" y="393" font-weight="bold">5 · Readiness gate</text><text x="430" y="430" fill="#ac4534">2 critical cutover defects</text><text x="430" y="461" fill="#ac4534">67% active &lt; 75% target</text>
<rect x="763" y="358" width="302" height="150" rx="16" fill="#e5f4ed" stroke="#326a85" stroke-width="2"/><text x="784" y="393" font-weight="bold">6 · Conditional case</text><text x="784" y="430">At 75%: +$35.8k NPV</text><text x="784" y="461">No full rollout until gates pass</text>
</g>
<g stroke="#37687a" stroke-width="4" fill="none"><path d="M357 224 H409"/><path d="M711 224 H763"/><path d="M914 295 V327 H206 V358"/><path d="M357 432 H409"/><path d="M711 432 H763"/></g><g font-family="Arial" font-size="18" fill="#37596b"><text x="560" y="577" text-anchor="middle">Funding limit: $185k ≤ $200k · New annual spend: $108k ≤ $110k</text><text x="560" y="614" text-anchor="middle">Stress: 1,200 units/week exceeds regional 1,100 — requalify capacity</text><text x="560" y="650" text-anchor="middle" font-weight="bold" fill="#a14736">Current decision: controlled design/pilot only, NOT production-ready automation</text></g></svg>