<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Segment demand variability: different operating policies</title><desc id="desc">Weekly stable-family demand mean 800 with standard deviation 60 gives coefficient of variation 0.075. Engineered repair mean 150 and deviation 90 gives CV 0.60. Do not directly convert CV into safety-stock multiplier.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff"/><rect x="0" y="0" width="1000" height="101" rx="0" fill="#173e55"/><text x="32" y="42" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Optimization and Strategy</text><text x="32" y="77" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff">Segment demand variability: different operating policies</text><text x="58" y="149" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193e51" font-weight="700">Coefficient of variation = standard deviation ÷ mean</text><text x="66" y="226" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193e51" font-weight="700">Stable family</text><rect x="278" y="190" width="608" height="37" rx="8" fill="#e7eef3"/><rect x="278" y="190" width="76" height="37" rx="8" fill="#9cb9d5"/><text x="897" y="225" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="end" fill="#28547a" font-weight="700">0.075</text><text x="66" y="325" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193e51" font-weight="700">Repair family</text><rect x="278" y="290" width="608" height="37" rx="8" fill="#e7eef3"/><rect x="278" y="290" width="608" height="37" rx="8" fill="#40947b"/><text x="897" y="325" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="end" fill="#286e55" font-weight="700">0.60</text><rect x="62" y="391" width="874" height="103" rx="12" fill="#e9f2f9"/><text x="86" y="432" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#265b7c" font-weight="700">Repair-family relative variability is 8× the stable family's</text><text x="86" y="466" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#9a4a39">This does NOT imply eight times as much safety stock</text><line x1="32" y1="560" x2="968" y2="560" stroke="#bdcdd7" stroke-width="2"/><text x="500" y="585" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#557083">AlderGate Motion Products · fictional scope and calculations</text></svg>