name: Content quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate learning content and assets
        run: python3 scripts/validate_repository.py
      - name: Validate Module 8 Section A (development branch only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/module-8-optimization-sustainability-technology'
        run: python3 scripts/validate_module8_section_a.py
      - name: Validate Module 8 Section B (development branch only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/module-8-optimization-sustainability-technology'
        run: python3 scripts/validate_module8_section_b.py
      - name: Validate Module 8 Section C (development branch only)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/module-8-optimization-sustainability-technology'
        run: python3 scripts/validate_module8_section_c.py
