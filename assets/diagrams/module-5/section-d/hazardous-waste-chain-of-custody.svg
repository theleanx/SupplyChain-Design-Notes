<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Hazardous waste chain of custody</title><desc id="desc">Control chain from waste characterization through an approved receiving destination.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#17324D">Hazardous-Waste Control Chain</text><rect x="38" y="245" width="180" height="130" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="128" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Characterize</text><text x="128" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="128" dy="0">what is it?</tspan></text><line x1="218" y1="310" x2="253" y2="310" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="260" y="245" width="180" height="130" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="350" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Package / label</text><text x="350" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="350" dy="0">safe + compliant</tspan></text><line x1="440" y1="310" x2="475" y2="310" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="482" y="245" width="180" height="130" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="572" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Authorize transporter</text><text x="572" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="572" dy="0">qualified handler</tspan></text><line x1="662" y1="310" x2="697" y2="310" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="704" y="245" width="180" height="130" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="794" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Manifest / evidence</text><text x="794" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="794" dy="0">track movement</tspan></text><line x1="884" y1="310" x2="919" y2="310" stroke="#0B7189" stroke-width="4" marker-end="url(#arrow)"/><rect x="926" y="245" width="180" height="130" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="1016" y="286" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">Approved destination</text><text x="1016" y="320" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#17324D"><tspan x="1016" dy="0">receive + confirm</tspan></text><rect x="300" y="470" width="560" height="95" rx="16" fill="#FFF4D8" stroke="#C98516" stroke-width="2"/><text x="580" y="505" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#17324D"><tspan x="580" dy="0">Never infer legal waste status from the training label:</tspan><tspan x="580" dy="26">jurisdiction, composition, quantity, and activity control the rule</tspan></text></svg>