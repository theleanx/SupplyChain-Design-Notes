<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc"><title id="title">Known, Emerging, and Unknown Risks: Preparing Without False Precision</title><desc id="desc">Known, emerging, and unforeseen events use different controls but feed the same learning register.</desc><rect width="1160" height="690" fill="#ffffff"/><rect width="1160" height="12" fill="#0b6a89"/><text x="56" y="54" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">Known, Emerging, and Unknown Risks: Preparing Without</text><text x="56" y="86" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">False Precision</text><text x="56" y="118" fill="#647786" font-size="16" font-family="Arial,sans-serif">Known, emerging, and unforeseen events use different controls but feed the same learning register.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#50889b" stroke-width="1.5"/></marker></defs><text x="56" y="660" fill="#607481" font-size="15" font-family="Arial,sans-serif">Stonebridge Industrial Components  ·  Original fictional risk-control model  ·  Module 7 / A04</text><rect x="50" y="184" width="338" height="170" rx="17" fill="#e8f3f9" stroke="#0b7189" stroke-width="2.3"/><text x="219.0" y="261.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Known risk</text><text x="219.0" y="290.105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">controlled trigger</text><path d="M217,358 L217,420" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="437" y="184" width="338" height="170" rx="17" fill="#fff3dc" stroke="#0b7189" stroke-width="2.3"/><text x="606.0" y="261.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Emerging risk</text><text x="606.0" y="290.105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">validating signal</text><path d="M604,358 L604,420" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="824" y="184" width="338" height="170" rx="17" fill="#fbe8e5" stroke="#0b7189" stroke-width="2.3"/><text x="993.0" y="261.755" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Unforeseen shock</text><text x="993.0" y="290.105" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">flexible capacity</text><path d="M991,358 L991,420" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="290" y="423" width="580" height="105" rx="17" fill="#e4f2ee" stroke="#0b7189" stroke-width="2.3"/><text x="580.0" y="468.255" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">Incident lesson</text><text x="580.0" y="496.605" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#17324d">new evidence</text><path d="M580,530 L580,554" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="344" y="557" width="472" height="72" rx="17" fill="#e8edfb" stroke="#0b7189" stroke-width="2.3"/><text x="580.0" y="586.7900000000001" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">Reclassify and</text><text x="580.0" y="611.09" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324d">refresh register</text></svg>