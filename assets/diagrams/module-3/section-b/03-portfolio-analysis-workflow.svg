<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Supply Portfolio Analysis</title>
  <desc id="desc">Segment categories using profit impact and supply risk—not spend alone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc" />
      <stop offset="1" stop-color="#eaf3f7" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#486581" />
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102a43}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#176b87}.subtitle{font-size:16px;fill:#486581}.label{font-size:19px;font-weight:700;fill:#102a43}.barlabel{font-size:15px;font-weight:700;fill:#fff}.body{font-size:16px;fill:#243b53}.small{font-size:14px;fill:#486581}.metric{font-size:24px;font-weight:700;fill:#176b87}.white{fill:#fff}.line{fill:none;stroke:#587d96;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#486581;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)" />
  <text x="60" y="43" class="eyebrow" text-anchor="start">
    <tspan x="60" y="43">PORTFOLIO MATRIX</tspan>
  </text>
  <text x="60" y="80" class="title" text-anchor="start">
    <tspan x="60" y="80">Supply Portfolio Analysis</tspan>
  </text>
  <text x="60" y="109" class="subtitle" text-anchor="start">
    <tspan x="60" y="109">Segment categories using profit impact and supply risk—not spend alone.</tspan>
  </text>
  <rect x="245" y="185" width="420" height="205" fill="#edf7f6" stroke="#ffffff" stroke-width="8" />
  <text x="269" y="227" class="label" text-anchor="start">
    <tspan x="269" y="227">Bottleneck</tspan>
  </text>
  <text x="269" y="267" class="body" text-anchor="start">
    <tspan x="269" y="267">Secure supply, reduce dependency, carry</tspan>
    <tspan x="269" y="290">options.</tspan>
  </text>
  <rect x="665" y="185" width="420" height="205" fill="#fff7df" stroke="#ffffff" stroke-width="8" />
  <text x="689" y="227" class="label" text-anchor="start">
    <tspan x="689" y="227">Strategic</tspan>
  </text>
  <text x="689" y="267" class="body" text-anchor="start">
    <tspan x="689" y="267">Collaborate, govern jointly, protect</tspan>
    <tspan x="689" y="290">continuity.</tspan>
  </text>
  <rect x="245" y="390" width="420" height="205" fill="#eef3fa" stroke="#ffffff" stroke-width="8" />
  <text x="269" y="432" class="label" text-anchor="start">
    <tspan x="269" y="432">Noncritical</tspan>
  </text>
  <text x="269" y="472" class="body" text-anchor="start">
    <tspan x="269" y="472">Simplify, automate, standardize demand.</tspan>
  </text>
  <rect x="665" y="390" width="420" height="205" fill="#fdeeea" stroke="#ffffff" stroke-width="8" />
  <text x="689" y="432" class="label" text-anchor="start">
    <tspan x="689" y="432">Leverage</tspan>
  </text>
  <text x="689" y="472" class="body" text-anchor="start">
    <tspan x="689" y="472">Aggregate volume and use market</tspan>
    <tspan x="689" y="495">competition.</tspan>
  </text>
  <line x1="245" y1="613" x2="1085" y2="613" stroke="#102a43" stroke-width="3" />
  <line x1="227" y1="595" x2="227" y2="185" stroke="#102a43" stroke-width="3" />
  <text x="665" y="651" class="label" text-anchor="middle">
    <tspan x="665" y="651">Profit impact</tspan>
  </text>
  <text x="85" y="390" class="label" text-anchor="middle">
    <tspan x="85" y="390">Supply risk</tspan>
  </text>
  <text x="245" y="637" class="small" text-anchor="start">
    <tspan x="245" y="637">LOW</tspan>
  </text>
  <text x="1085" y="637" class="small" text-anchor="end">
    <tspan x="1085" y="637">HIGH</tspan>
  </text>
  <text x="203" y="595" class="small" text-anchor="end">
    <tspan x="203" y="595">LOW</tspan>
  </text>
  <text x="203" y="199" class="small" text-anchor="end">
    <tspan x="203" y="199">HIGH</tspan>
  </text>
</svg>
