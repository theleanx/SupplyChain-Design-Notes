<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Operations Strategies</title><desc id="desc">Original comparison chart of level, chase, and hybrid production responses to variable demand.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">Three ways to respond to changing demand</text>
<g transform="translate(70,95)"><rect class="box" width="300" height="450" rx="14"/><text class="h" x="150" y="35" text-anchor="middle">LEVEL</text><polyline points="30,170 80,120 130,185 180,95 230,160 270,125" fill="none" stroke="#d59898" stroke-width="3"/><line x1="30" y1="130" x2="270" y2="130" stroke="#86b8a8" stroke-width="5"/><text class="s" x="35" y="215">Production stays stable.</text><text class="s" x="35" y="242">Inventory/backlog absorbs variation.</text><text class="s" x="35" y="300">+ predictable operations</text><text class="s" x="35" y="328">− inventory / stockout risk</text></g>
<g transform="translate(400,95)"><rect class="box" width="300" height="450" rx="14"/><text class="h" x="150" y="35" text-anchor="middle">CHASE</text><polyline points="30,170 80,120 130,185 180,95 230,160 270,125" fill="none" stroke="#d59898" stroke-width="3"/><polyline points="30,170 80,120 130,185 180,95 230,160 270,125" fill="none" stroke="#86b8a8" stroke-width="5"/><text class="s" x="35" y="215">Production follows demand.</text><text class="s" x="35" y="242">Inventory stays lower.</text><text class="s" x="35" y="300">+ less finished-goods inventory</text><text class="s" x="35" y="328">− capacity-change cost / risk</text></g>
<g transform="translate(730,95)"><rect class="box" width="300" height="450" rx="14"/><text class="h" x="150" y="35" text-anchor="middle">HYBRID</text><polyline points="30,170 80,120 130,185 180,95 230,160 270,125" fill="none" stroke="#d59898" stroke-width="3"/><polyline points="30,155 80,145 130,155 180,125 230,145 270,135" fill="none" stroke="#86b8a8" stroke-width="5"/><text class="s" x="35" y="215">Stable base + selective flex.</text><text class="s" x="35" y="242">Balances inventory and capacity.</text><text class="s" x="35" y="300">+ practical trade-off</text><text class="s" x="35" y="328">− requires disciplined planning</text></g>
<text class="s" x="70" y="600">Red = demand pattern • Green = production response</text>
</svg>
