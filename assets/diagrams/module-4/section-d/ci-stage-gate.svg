<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Continuous Improvement Model, Initiatives, and People</title><desc id="desc">Original decision visual for continuous improvement model, initiatives, and people, using fictional Pinehaven Motion Systems data where applicable.</desc>
