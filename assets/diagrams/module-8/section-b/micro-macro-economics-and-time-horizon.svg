<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">One-quarter view versus five-year effects</title><desc id="desc">A short-term period sits above a five-year timeline with a 250,000 dollar investment and five annual 85,000 dollar benefit periods; 175,000 dollars is undiscounted.</desc><rect x="0" y="0" width="1000" height="100" fill="#173d55" stroke="#173d55" stroke-width="2" rx="0"/><text x="35" y="45" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="26" font-weight="700">CSCP Module 8 · Section B</text><text x="35" y="79" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="23" font-weight="400">One-quarter view versus five-year effects</text><g><rect x="80" y="150" width="840" height="75" fill="#f5e8e4" stroke="#245f77" stroke-width="2" rx="15"/><text x="100" y="181" fill="#64352c" font-family="Arial, sans-serif" text-anchor="start" font-size="23" font-weight="700">Quarter-end pressure</text><text x="100" y="211" fill="#15374c" font-family="Arial, sans-serif" text-anchor="start" font-size="20" font-weight="400">Deferred maintenance can shift costs into the future</text><line x1="100" y1="317" x2="900" y2="317" stroke="#2a6b80" stroke-width="4"/><circle cx="115" cy="317" r="11" fill="#f7d1c4" fill-opacity=".78" stroke="#245f77" stroke-width="3"/><text x="115" y="288" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="21" font-weight="400">Y0</text><text x="115" y="361" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="400">-$250k</text><circle cx="270" cy="317" r="11" fill="#c5e9e1" fill-opacity=".78" stroke="#245f77" stroke-width="3"/><text x="270" y="288" fill="#17374b" font-family="Arial, sans-serif" text-anchor="middle" font-size="21" font-weight="400">Y1</text><text x="270" y="361" fill="#17374b" font-family="Arial, sans-serif" text-ancho