<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Waste hierarchy</title><desc id="desc">Hierarchy prioritizing reduction and reuse before recycling, energy recovery, and disposal.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0B7189"/></marker></defs>
<rect width="1160" height="696" fill="#FFFFFF"/><text x="580" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#17324D">Waste Hierarchy</text><rect x="180" y="135" width="800" height="70" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="580" y="165" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">REDUCE</text><text x="580" y="189" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">prevent material / energy use</text><rect x="240" y="230" width="680" height="70" rx="16" fill="#EAF6EE" stroke="#17324D" stroke-width="2"/><text x="580" y="260" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">REUSE</text><text x="580" y="284" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">extend product or component life</text><rect x="300" y="325" width="560" height="70" rx="16" fill="#EAF4F8" stroke="#17324D" stroke-width="2"/><text x="580" y="355" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">RECYCLE</text><text x="580" y="379" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">recover materials</text><rect x="360" y="420" width="440" height="70" rx="16" fill="#FFF4D8" stroke="#17324D" stroke-width="2"/><text x="580" y="450" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">RECOVER ENERGY</text><text x="580" y="474" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">recover usable energy</text><rect x="420" y="515" width="320" height="70" rx="16" fill="#FCEBEC" stroke="#17324D" stroke-width="2"/><text x="580" y="545" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#17324D">DISPOSE</text><text x="580" y="569" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#17324D">controlled last resort</text></svg>