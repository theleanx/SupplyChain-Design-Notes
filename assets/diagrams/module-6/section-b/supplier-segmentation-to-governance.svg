<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Supplier segmentation to relationship governance</title><desc id="desc">Supplier characteristics are converted into differentiated governance intensity rather than redoing sourcing award logic.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Supplier segmentation to relationship governance</text><polygon points="130.0,145 1030.0,145 960.0,230 200.0,230" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="179" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Supplier / category facts</tspan></text><text x="580.0" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">capability + innovation + lead time</tspan></text><polygon points="220.0,270 940.0,270 870.0,355 290.0,355" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Relationship segment</tspan></text><text x="580.0" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">routine / important / strategic</tspan></text><polygon points="310.0,395 850.0,395 780.0,480 380.0,480" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Governance design</tspan></text><text x="580.0" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">contact + cadence + development</tspan></text><polygon points="400.0,520 760.0,520 690.0,605 470.0,605" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Re-segment</tspan></text><text x="580.0" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">performance + dependency change</tspan></text><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">Segmentation has value only when it changes relationship treatment and is reviewed over time.</text></svg>
