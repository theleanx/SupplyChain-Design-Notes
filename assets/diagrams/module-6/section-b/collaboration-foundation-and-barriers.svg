<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Collaboration foundation and barriers</title><desc id="desc">A collaboration bridge is supported by shared goals, roles, information, incentives, and governance while common barriers erode the span.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Collaboration foundation and barriers</text><path d="M80 520 C230 455, 360 585, 520 515 C690 440, 840 590, 1080 500 L1080 610 L80 610 Z" fill="#eaf4f8" opacity="0.7"/><rect x="105" y="515" width="175" height="60" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="192.5" y="550.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d"><tspan x="192.5" dy="0">suboptimization</tspan></text><rect x="305" y="515" width="175" height="60" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="392.5" y="550.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d"><tspan x="392.5" dy="0">power imbalance</tspan></text><rect x="505" y="515" width="175" height="60" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="592.5" y="550.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d"><tspan x="592.5" dy="0">weak technology</tspan></text><rect x="705" y="515" width="175" height="60" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="792.5" y="550.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#17324d"><tspan x="792.5" dy="0">local incentives</tspan></text><rect x="90