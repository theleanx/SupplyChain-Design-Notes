<text x="55" y="82" class="title" text-anchor="start"><tspan x="55" y="82">Inventory Management Roles and Policy</tspan></text>
<text x="55" y="111" class="subtitle" text-anchor="start"><tspan x="55" y="111">Original decision visual for inventory management roles and policy, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
<text x="55" y="150" class="h" text-anchor="start"><tspan x="55" y="150">Inventory policy is cross-functional governance, not a warehouse-only decision</tspan></text>
