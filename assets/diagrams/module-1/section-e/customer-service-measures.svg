<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Customer Service Measures</title><desc id="desc">Original metric map linking fill rate, lead time, availability, order status, flexibility and recovery to customer service.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">Prioritization choices should be tested against customer-service outcomes</text>
<circle cx="550" cy="300" r="105" fill="#f3eefb" stroke="#aa95d4" stroke-width="2"/><text class="h" x="550" y="285" text-anchor="middle">CUSTOMER</text><text class="h" x="550" y="312" text-anchor="middle">SERVICE</text><text class="s" x="550" y="340" text-anchor="middle">expectations vs. performance</text>
<rect class="blue" x="70" y="90" width="260" height="100" rx="12"/><text class="h" x="200" y="125" text-anchor="middle">Fill rates</text><text class="s" x="200" y="150" text-anchor="middle">unit • line • value</text>
<rect class="green" x="770" y="90" width="260" height="100" rx="12"/><text class="h" x="900" y="125" text-anchor="middle">Lead time</text><text class="s" x="900" y="150" text-anchor="middle">speed • consistency</text>
<rect class="gold" x="70" y="410" width="260" height="100" rx="12"/><text class="h" x="200" y="445" text-anchor="middle">Availability</text><text class="s" x="200" y="470" text-anchor="middle">stockout frequency</text>
<rect class="red" x="770" y="410" width="260" height="100" rx="12"/><text class="h" x="900" y="445" text-anchor="middle">Experience</text><text class="s" x="900" y="470" text-anchor="middle">status • flexibility • recovery</text>
<path class="dash" d="M330 150L480 240 M770 150L620 240 M330 455L480 360 M770 455L620 360"/><text class="s" x="70" y="590">Use the metric that reflects what the customer actually values; no single fill-rate measure tells the whole story.</text>
</svg>
