<text x="112" y="436" class="h" text-anchor="start"><tspan x="112" y="436">Lot-for-lot</tspan></text>
<text x="112" y="465" class="small" text-anchor="start"><tspan x="112" y="465">Order exactly the net requirement each period.</tspan><tspan x="112" y="483">Low cycle stock · more orders</tspan></text>
