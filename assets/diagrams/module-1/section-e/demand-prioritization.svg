<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">Demand Prioritization</title><desc id="desc">Original decision framework for when demand prioritization is needed and how enterprise criteria should guide the response.</desc><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.m{font-family:Arial,Helvetica,sans-serif;fill:#596579}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.h{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.s{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:7 6}</style><rect width="1100" height="650" fill="white"/>
<text class="title" x="50" y="45">Demand prioritization is triggered when a mismatch has real consequences</text>
<rect class="blue" x="70" y="95" width="300" height="90" rx="12"/><text class="h" x="220" y="130" text-anchor="middle">Supply can adapt in time</text><text class="s" x="220" y="155" text-anchor="middle">without material cost/disruption</text>
<rect class="green" x="730" y="95" width="300" height="90" rx="12"/><text class="h" x="880" y="130" text-anchor="middle">Manage supply normally</text><text class="s" x="880" y="155" text-anchor="middle">formal prioritization may not be needed</text><path class="line" d="M370 140H730"/>
<rect class="red" x="70" y="255" width="300" height="105" rx="12"/><text class="h" x="220" y="290" text-anchor="middle">Mismatch is constrained</text><text class="s" x="220" y="318" text-anchor="middle">materials/WIP/capacity/customer</text><text class="s" x="220" y="340" text-anchor="middle">commitments create consequences</text>
<rect class="gold" x="430" y="255" width="240" height="105" rx="12"/><text class="h" x="550" y="290" text-anchor="middle">Apply policy</text><text class="s" x="550" y="318" text-anchor="middle">authority + criteria + data</text><text class="s" x="550" y="340" text-anchor="middle">time fences / allocation</text>
<rect class="purple" x="730" y="255" width="300" height="105" rx="12"/><text class="h" x="880" y="290" text-anchor="middle">Choose enterprise action</text><text class="s" x="880" y="318" text-anchor="middle">serve • delay • substitute</text><text class="s" x="880" y="340" text-anchor="middle">ration • reject • add capacity</text><path class="line" d="M370 307H430 M670 307H730"/>
<rect class="box" x="235" y="465" width="630" height="100" rx="12"/><text class="h" x="550" y="500" text-anchor="middle">Evaluate total impact</text><text class="s" x="550" y="527" text-anchor="middle">profit • revenue • customer service • strategic value • future relationship</text><path class="dash" d="M880 360 C850 430 740 460 690 465"/>
</svg>
