<text x="55" y="82" class="title" text-anchor="start"><tspan x="55" y="82">TQM and Continuous Improvement Foundations</tspan></text>
<text x="55" y="111" class="subtitleSm" text-anchor="start"><tspan x="55" y="111">Original decision visual for tqm and continuous improvement foundations, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
