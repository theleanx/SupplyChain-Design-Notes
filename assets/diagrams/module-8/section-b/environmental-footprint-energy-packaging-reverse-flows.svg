<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Freight footprint is a bounded estimate</title><desc id="desc">Two bar lengths compare fictional baseline transport emissions of 1860 kg CO2e versus alternative 1200 kg CO2e; difference 660 kg CO2e.</desc><rect x="0" y="0" width="1000" height="100" fill="#173d55" stroke="#173d55" stroke-width="2" rx="0"/><text x="35" y="45" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="26" font-weight="700">CSCP Module 8 · Section B</text><text x="35" y="79" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="start" font-size="23" font-weight="400">Freight footprint is a bounded estimate</text><g><text x="100" y="172" fill="#15374c" font-family="Arial, sans-serif" text-anchor="start" font-size="21" font-weight="400">Baseline transport (same tonne-km)</text><rect x="100" y="192" width="780" height="78" fill="#d9e8fa" stroke="#245f77" stroke-width="2" rx="15"/><text x="865" y="241" fill="#17374b" font-family="Arial, sans-serif" text-anchor="end" font-size="26" font-weight="700">1,860 kg</text><text x="100" y="329" fill="#15374c" font-family="Arial, sans-serif" text-anchor="start" font-size="21" font-weight="400">Alternative transport</text><rect x="100" y="351" width="503" height="78" fill="#d8efe1" stroke="#245f77" stroke-width="2" rx="15"/><text x="589" y="402" fill="#245e50" font-family="Arial, sans-serif" text-anchor="end" font-size="25" font-weight="700">1,200 kg</text><line x1="603" y1="458" x2="880" y2="458" stroke="#2a6b80" stroke-width="4"/><text x="740" y="490" fill="#245e50" font-family="Arial, sans-serif" text-anchor="middle" font-size="22" font-weight="700">660 kg CO2e modeled</text><text x="100" y="531" fill="#15374c" font-family="Arial, sans-serif" text-anchor="start" font-size="17" font-weight="400">Factors and boundary fictional; returns and damage not included</text></g></svg>