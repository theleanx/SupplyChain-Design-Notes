<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">Cross-cultural relationship adaptation loop</title><desc id="desc">Cultural models are used as hypotheses that trigger inquiry, adaptation, verification, and learning rather than deterministic national stereotypes.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Cross-cultural relationship adaptation loop</text><rect x="65" y="240" width="170" height="135" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="150.0" y="291.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="150.0" dy="0">Observe context</tspan></text><text x="150.0" y="323.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="150.0" dy="0">hierarchy + group norms</tspan><tspan x="150.0" dy="16">+ uncertainty + time</tspan></text><line x1="235" y1="307" x2="270" y2="307" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="240" width="170" height="135" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="355.0" y="289.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="355.0" dy="0">Form a tentative</tspan><tspan x="355.0" dy="20">hypothesis</tspan></text><text x="355.0" y="341.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="355.0" dy="0">lens, not label</tspan></text><line x1="440" y1="307" x2="475" y2="307" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="475" y="240" width="170" height="135" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="560.0" y="281.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="560.0" dy="0">Ask + research</tspan><tspan x="560.0" dy="20">locally</tspan></text><text x="560.0" y="333.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="560.0" dy="0">direct evidence + local</tspan><tspan x="560.0" dy="16">expertise</tspan></text><line x1="645" y1="307" x2="680" y2="307" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="240" width="170" height="135" rx="14" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><text x="765.0" y="281.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="765.0" dy="0">Adapt communication</tspan><tspan x="765.0" dy="20">/ governance</tspan></text><text x="765.0" y="333.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="765.0" dy="0">channel + tone +</tspan><tspan x="765.0" dy="16">decision process</tspan></text><line x1="850" y1="307" x2="885" y2="307" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><rect x="885" y="240" width="170" height="135" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="970.0" y="279.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d"><tspan x="970.0" dy="0">Verify with</tspan><tspan x="970.0" dy="20">stakeholder</tspan><tspan x="970.0" dy="20">feedback</tspan></text><text x="970.0" y="351.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#4f6475"><tspan x="970.0" dy="0">revise assumptions</tspan></text><rect x="290" y="465" width="580" height="80" rx="14" fill="#fdecec" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="487.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Guardrail</tspan></text><text x="580.0" y="523.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">Treat cultural frameworks as prompts for questions—not</tspan><tspan x="580.0" dy="19">as predictions about an individual stakeholder.</tspan></text></svg>
