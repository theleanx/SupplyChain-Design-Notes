<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc"><title id="title">AlderGate modeled five-year NPV sensitivity to benefit realization</title><desc id="desc">At a 10 percent discount rate, with 185000 dollars time zero capex and annual net equal to 155000 dollars times realized benefit minus 58000 dollars: 60 percent NPV negative 52322; 67 percent negative 11192; 75 percent positive 35813; 100 percent positive 182706. Break-even about 68.90 percent.</desc><rect width="1120" height="690" fill="#fff"/><rect width="1120" height="106" fill="#183d56"/><text x="37" y="44" fill="#fff" font-family="Arial" font-size="28" font-weight="bold">AlderGate · five-year NPV sensitivity</text><text x="37" y="80" fill="#fff" font-family="Arial" font-size="21">Year-end cash flows · 10% discount · $185k t0 · fictional scenario</text>
<g font-family="Arial" font-size="20" fill="#254a5e"><text x="42" y="151">Five-year NPV (USD thousands)</text><text x="120" y="227" text-anchor="end">+200</text><text x="120" y="326" text-anchor="end">+100</text><text x="120" y="426" text-anchor="end">0</text><text x="120" y="526" text-anchor="end">−100</text></g>
