<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc"><title id="title">CRM-SRM end-to-end relationship model</title><desc id="desc">Customer needs and supplier capability converge through enterprise coordination to support the end customer and feed learning back both directions.</desc><rect width="1160" height="696" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">CRM-SRM end-to-end relationship model</text><rect x="70" y="210" width="260" height="180" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="200.0" y="292.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d"><tspan x="200.0" dy="0">Customer / CRM</tspan></text><text x="200.0" y="331.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4f6475"><tspan x="200.0" dy="0">needs + promises + feedback</tspan></text><rect x="830" y="210" width="260" height="180" rx="14" fill="#edf6ed" stroke="#0b7189" stroke-width="2"/><text x="960.0" y="282.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d"><tspan x="960.0" dy="0">Supplier / SRM</tspan></text><text x="960.0" y="321.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#4f6475"><tspan x="960.0" dy="0">capacity + quality +</tspan><tspan x="960.0" dy="20">innovation + risk</tspan></text><polygon points="330,240 520,300 520,420 330,360" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><polygon points="830,240 640,300 640,420 830,360" fill="#f2eefb" stroke="#0b7189" stroke-width="2"/><rect x="500" y="285" width="160" height="150" rx="14" fill="#ffffff" stroke="#0b7189" stroke-width="2"/><text x="580.0" y="323.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d"><tspan x="580.0" dy="0">Enterprise</tspan><tspan x="580.0" dy="23">coordination</tspan></text><text x="580.0" y="380.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#4f6475"><tspan x="580.0" dy="0">planning + operations</tspan><tspan x="580.0" dy="17">+ logistics +</tspan><tspan x="580.0" dy="17">decisions</tspan></text><line x1="330" y1="300" x2="500" y2="330" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><line x1="660" y1="330" x2="830" y2="300" stroke="#6d7e8e" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 365 C700 540, 450 540, 330 365" fill="none" stroke="#0b7189" stroke-width="3" marker-end="url(#arrow)"/><text x="580" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">The end-customer outcome improves only when sell-side and buy-side relationship signals are coordinated.</text></svg>
