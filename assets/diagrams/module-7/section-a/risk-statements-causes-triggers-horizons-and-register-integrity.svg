<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc"><title id="title">Risk Statements and the Register: Causes, Triggers, Horizons, and Integrity</title><desc id="desc">An owned register keeps source evidence, assessment state, response, and review history distinct.</desc><rect width="1160" height="690" fill="#ffffff"/><rect width="1160" height="12" fill="#0b6a89"/><text x="56" y="54" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">Risk Statements and the Register: Causes, Triggers,</text><text x="56" y="86" fill="#19334a" font-family="Arial,sans-serif" font-size="27" font-weight="700">Horizons, and Integrity</text><text x="56" y="118" fill="#647786" font-size="16" font-family="Arial,sans-serif">An owned register keeps source evidence, assessment state, response, and review history distinct.</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#50889b" stroke-width="1.5"/></marker></defs><text x="56" y="660" fill="#607481" font-size="15" font-family="Arial,sans-serif">Stonebridge Industrial Components  ·  Original fictional risk-control model  ·  Module 7 / A10</text><rect x="50" y="255" width="194" height="150" rx="17" fill="#eaf4f8" stroke="#0b7189" stroke-width="2.3"/><text x="147.0" y="309.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">Risk statement</text><text x="147.0" y="336.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">objective &amp;</text><text x="147.0" y="363.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#17324d">boundary</text><path d="M248,330 L275,330" fill="none" stroke="#50889b" stroke-width="3" marker-end="url(#a)"/><rect x="278" y="255" width="194" height="150" rx="17" fill="#e5f4ef" stroke="#0b7189"