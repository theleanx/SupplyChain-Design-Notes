<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc"><title id="title">Procure-to-pay control flow</title><desc id="desc">Authorization, order, receipt, match, and payment create traceability.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#406b8b"/></marker></defs><rect width="960" height="260" fill="#f7fafc"/><text x="480" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#102a43">Procure-to-pay control flow</text><g transform="translate(30,75)"><rect width="180" height="90" rx="12" fill="#eadfff" stroke="#15324a" stroke-width="2"/><text x="90" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">Authorize</text><path d="M 185 45 H 215" stroke="#406b8b" stroke-width="4" marker-end="url(#a)"/></g><g transform="translate(255,75)"><rect width="180" height="90" rx="12" fill="#d9f0ff" stroke="#15324a" stroke-width="2"/><text x="90" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">Order</text><path d="M 185 45 H 215" stroke="#406b8b" stroke-width="4" marker-end="url(#a)"/></g><g transform="translate(480,75)"><rect width="180" height="90" rx="12" fill="#dff7e5" stroke="#15324a" stroke-width="2"/><text x="90" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">Receive</text><path d="M 185 45 H 215" stroke="#406b8b" stroke-width="4" marker-end="url(#a)"/></g><g transform="translate(705,75)"><rect width="180" height="90" rx="12" fill="#fff1c9" stroke="#15324a" stroke-width="2"/><text x="90" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#102a43">Settle</text></g><text x="480" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#486581">Original instructional diagram — fictional decision flow</text></svg>