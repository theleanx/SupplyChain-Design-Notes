<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">MRP Evolution: Closed-Loop MRP, MRP II, ERP, and DDMRP Context</title><desc id="desc">Original decision visual for mrp evolution: closed-loop mrp, mrp ii, erp, and ddmrp context, using fictional Pinehaven Motion Systems data where applicable.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F9FBFD"/><stop offset="1" stop-color="#EEF5F7"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B7184"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B7189"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102A43}.titleSm{font-size:23px;font-weight:700;fill:#102A43}.titleXs{font-size:19px;font-weight:700;fill:#102A43}.subtitleSm{font-size:12px;fill:#5B7184}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.1px;fill:#0B7189}.subtitle{font-size:16px;fill:#5B7184}.h{font-size:20px;font-weight:700;fill:#17324D}.body{font-size:16px;fill:#17324D}.small{font-size:13px;fill:#5B7184}.tiny{font-size:11px;fill:#5B7184}.metric{font-size:26px;font-weight:700;fill:#0B7189}.white{fill:#fff}.axis{stroke:#5B7184;stroke-width:2}.grid{stroke:#D4E0E8;stroke-width:1}.arrow{stroke:#5B7184;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrowt{stroke:#0B7189;stroke-width:3;fill:none;marker-end:url(#arrowTeal)}
</style>
<rect width="1200" height="720" rx="22" fill="url(#bg)"/>
<text x="55" y="42" class="eyebrow" text-anchor="start"><tspan x="55" y="42">MODULE 4 · INTERNAL OPERATIONS &amp; INVENTORY</tspan></text>
<text x="55" y="82" class="title" text-anchor="start"><tspan x="55" y="82">MRP Evolution: Closed-Loop MRP, MRP II, ERP, and DDMRP Context</tspan></text>
<text x="55" y="111" class="subtitleSm" text-anchor="start"><tspan x="55" y="111">Original decision visual for mrp evolution: closed-loop mrp, mrp ii, erp, and ddmrp context, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
<rect x="70" y="500" width="190" height="105" rx="14" fill="#FFFFFF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="70" y="500" width="8" height="105" rx="14" fill="#3A7CA5" opacity="1"/>
<text x="92" y="531" class="h" text-anchor="start"><tspan x="92" y="531">MRP</tspan></text>
<text x="92" y="560" class="small" text-anchor="start"><tspan x="92" y="560">Material timing</tspan></text>
<line x1="260" y1="552" x2="290" y2="487" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="290" y="435" width="190" height="105" rx="14" fill="#EAF4F8" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="290" y="435" width="8" height="105" rx="14" fill="#3A7CA5" opacity="1"/>
<text x="312" y="466" class="h" text-anchor="start"><tspan x="312" y="466">Closed-loop MRP</tspan></text>
<text x="312" y="495" class="small" text-anchor="start"><tspan x="312" y="495">Feedback + capacity</tspan></text>
<line x1="480" y1="487" x2="510" y2="422" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="510" y="370" width="190" height="105" rx="14" fill="#E8F5EF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="510" y="370" width="8" height="105" rx="14" fill="#2F7D65" opacity="1"/>
<text x="532" y="401" class="h" text-anchor="start"><tspan x="532" y="401">MRP II</tspan></text>
<text x="532" y="430" class="small" text-anchor="start"><tspan x="532" y="430">Integrated</tspan><tspan x="532" y="448">manufacturing</tspan><tspan x="532" y="466">resources</tspan></text>
<line x1="700" y1="422" x2="730" y2="357" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="730" y="305" width="190" height="105" rx="14" fill="#FFF4D8" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="730" y="305" width="8" height="105" rx="14" fill="#C98516" opacity="1"/>
<text x="752" y="336" class="h" text-anchor="start"><tspan x="752" y="336">ERP</tspan></text>
<text x="752" y="365" class="small" text-anchor="start"><tspan x="752" y="365">Enterprise-wide</tspan><tspan x="752" y="383">processes</tspan></text>
<line x1="920" y1="357" x2="950" y2="292" stroke="#0B7189" stroke-width="3" marker-end="url(#arrowTeal)"/>
<rect x="950" y="240" width="190" height="105" rx="14" fill="#F1EEFA" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="950" y="240" width="8" height="105" rx="14" fill="#6C5B9A" opacity="1"/>
<text x="972" y="271" class="h" text-anchor="start"><tspan x="972" y="271">DDMRP context</tspan></text>
<text x="972" y="300" class="small" text-anchor="start"><tspan x="972" y="300">Strategic decoupling</tspan><tspan x="972" y="318">+ buffers</tspan></text>
<text x="55" y="160" class="h" text-anchor="start"><tspan x="55" y="160">Each step adds scope or feedback; none removes the need for accurate data and disciplined</tspan><tspan x="55" y="181">decisions.</tspan></text>
</svg>