<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Inventory and the Financial Statements</title><desc id="desc">Original decision visual for inventory and the financial statements, using fictional Pinehaven Motion Systems data where applicable.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F9FBFD"/><stop offset="1" stop-color="#EEF5F7"/></linearGradient>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5B7184"/></marker>
<marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0B7189"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}.title{font-size:30px;font-weight:700;fill:#102A43}.titleSm{font-size:23px;font-weight:700;fill:#102A43}.titleXs{font-size:19px;font-weight:700;fill:#102A43}.subtitleSm{font-size:12px;fill:#5B7184}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.1px;fill:#0B7189}.subtitle{font-size:16px;fill:#5B7184}.h{font-size:20px;font-weight:700;fill:#17324D}.body{font-size:16px;fill:#17324D}.small{font-size:13px;fill:#5B7184}.tiny{font-size:11px;fill:#5B7184}.metric{font-size:26px;font-weight:700;fill:#0B7189}.white{fill:#fff}.axis{stroke:#5B7184;stroke-width:2}.grid{stroke:#D4E0E8;stroke-width:1}.arrow{stroke:#5B7184;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrowt{stroke:#0B7189;stroke-width:3;fill:none;marker-end:url(#arrowTeal)}
</style>
<rect width="1200" height="720" rx="22" fill="url(#bg)"/>
<text x="55" y="42" class="eyebrow" text-anchor="start"><tspan x="55" y="42">MODULE 4 · INTERNAL OPERATIONS &amp; INVENTORY</tspan></text>
<text x="55" y="82" class="title" text-anchor="start"><tspan x="55" y="82">Inventory and the Financial Statements</tspan></text>
<text x="55" y="111" class="subtitle" text-anchor="start"><tspan x="55" y="111">Original decision visual for inventory and the financial statements, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
<text x="55" y="150" class="h" text-anchor="start"><tspan x="55" y="150">Inventory affects all three core financial views</tspan></text>
<rect x="80" y="220" width="315" height="140" rx="14" fill="#FFFFFF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="80" y="220" width="8" height="140" rx="14" fill="#3A7CA5" opacity="1"/>
<text x="102" y="251" class="h" text-anchor="start"><tspan x="102" y="251">Balance sheet</tspan></text>
<text x="102" y="280" class="small" text-anchor="start"><tspan x="102" y="280">Ending inventory $4.8M → $3.9M</tspan></text>
<rect x="445" y="220" width="315" height="140" rx="14" fill="#FFFFFF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="445" y="220" width="8" height="140" rx="14" fill="#6C5B9A" opacity="1"/>
<text x="467" y="251" class="h" text-anchor="start"><tspan x="467" y="251">Income statement</tspan></text>
<text x="467" y="280" class="small" text-anchor="start"><tspan x="467" y="280">COGS $19.6M → $20.8M</tspan></text>
<rect x="810" y="220" width="315" height="140" rx="14" fill="#FFFFFF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="810" y="220" width="8" height="140" rx="14" fill="#2F7D65" opacity="1"/>
<text x="832" y="251" class="h" text-anchor="start"><tspan x="832" y="251">Cash flow</tspan></text>
<text x="832" y="280" class="small" text-anchor="start"><tspan x="832" y="280">Cash released $900k</tspan></text>
<rect x="175" y="445" width="360" height="105" rx="14" fill="#EAF4F8" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="175" y="445" width="8" height="105" rx="14" fill="#0B7189" opacity="1"/>
<text x="197" y="476" class="h" text-anchor="start"><tspan x="197" y="476">Inventory turns</tspan></text>
<text x="197" y="505" class="small" text-anchor="start"><tspan x="197" y="505">4.36 → 4.78 turns/year</tspan></text>
<rect x="665" y="445" width="360" height="105" rx="14" fill="#E8F5EF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="665" y="445" width="8" height="105" rx="14" fill="#2F7D65" opacity="1"/>
<text x="687" y="476" class="h" text-anchor="start"><tspan x="687" y="476">Accounting equation</tspan></text>
<text x="687" y="505" class="small" text-anchor="start"><tspan x="687" y="505">Assets = liabilities + equity check =</tspan><tspan x="687" y="523">$0</tspan></text>
</svg>