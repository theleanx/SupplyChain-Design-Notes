<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Strategy gap: keep separate order populations</title><desc id="desc">Separate population tests: target 95 percent versus actual 88 percent gives 7 percentage point gap. A different sample of 4000 orders with 350 failures yields 91.25 percent attainment and a separate 3.75 point gap.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff"/><rect x="0" y="0" width="1000" height="101" rx="0" fill="#173e55"/><text x="32" y="42" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Optimization and Strategy</text><text x="32" y="77" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff">Strategy gap: keep separate order populations</text><text x="56" y="148" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#173c50" font-weight="700">One target · two independent observation populations</text><rect x="60" y="193" width="425" height="252" rx="12" fill="#e8f0f9"/><text x="83" y="236" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#1c5476" font-weight="700">Service population A</text><text x="83" y="293" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">Target 95% · Actual 88%</text><text x="83" y="349" font-size="26" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#a04e3c" font-weight="700">Gap: 7.00 points</text><rect x="517" y="193" width="425" height="252" rx="12" fill="#e5f3e9"/><text x="540" y="236" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#22684e" font-weight="700">Service population B</text><text x="540" y="293" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">3,650 / 4,000 = 91.25%</text><text x="540" y="349" font-size="26" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#a04e3c" font-weight="700">Gap: 3.75 points</text><text x="503" y="490" font-size="20" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#2e647d" font-weight="700">Do not mix different order populations or measurement windows</text><line x1="32" y1="560" x2="968" y2="560" stroke="#bdcdd7" stroke-width="2"/><text x="500" y="585" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#557083">AlderGate Motion Products · fictional scope and calculations</text></svg>