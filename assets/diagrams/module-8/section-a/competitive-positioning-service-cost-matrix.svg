<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Competitive positioning: total and per-unit contribution</title><desc id="desc">Standard couplings 6000 units times 37 dollar unit contribution yields 222000 USD per month. Engineered assemblies 3300 times 55 yield 181500 total, despite higher unit contribution.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff"/><rect x="0" y="0" width="1000" height="101" rx="0" fill="#173e55"/><text x="32" y="42" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Optimization and Strategy</text><text x="32" y="77" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff">Competitive positioning: total and per-unit contribution</text><text x="55" y="148" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#153c52" font-weight="700">Monthly contribution depends on volume and unit economics</text><rect x="57" y="179" width="426" height="264" rx="12" fill="#e4f0fb"/><text x="83" y="222" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#214d72" font-weight="700">Standardized couplings</text><text x="83" y="270" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">6,000 × $37/unit</text><text x="83" y="324" font-size="29" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#214d72" font-weight="700">$222,000 total</text><rect x="83" y="368" width="305" height="38" rx="18" fill="#d6e8f6"/><text x="235.5" y="394" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#275779" font-weight="700">Lower contribution per unit</text><rect x="514" y="179" width="426" height="264" rx="12" fill="#e5f4eb"/><text x="542" y="222" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#21684e" font-weight="700">Engineered assemblies</text><text x="542" y="270" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">3,300 × $55/unit</text><text x="542" y="324" font-size="29" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#236d53" font-weight="700">$181,500 total</text><rect x="542" y="368" width="310" height="38" rx="18" fill="#d7eee0"/><text x="697" y="394" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#266b51" font-weight="700">Higher contribution per unit</text><text x="500" y="503" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#3c5f71" font-weight="700">Capacity-hour and service constraints still govern the product mix</text><line x1="32" y1="560" x2="968" y2="560" stroke="#bdcdd7" stroke-width="2"/><text x="500" y="585" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#557083">AlderGate Motion Products · fictional scope and calculations</text></svg>