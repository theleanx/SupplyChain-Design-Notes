<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc"><title id="title">MAD versus MSE penalty</title><desc id="desc">Original bar comparison showing how squared error grows faster than absolute error as forecast misses get larger.</desc><style>
.text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.muted{font-family:Arial,Helvetica,sans-serif;fill:#596579}.small{font-family:Arial,Helvetica,sans-serif;fill:#596579;font-size:13px}.title{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:24px;font-weight:700}.sub{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:16px;font-weight:700}.box{fill:#f7f9fc;stroke:#cbd3df;stroke-width:1.6}.blue{fill:#eaf2fb;stroke:#8fb3da;stroke-width:1.6}.green{fill:#ebf6f1;stroke:#86b8a8;stroke-width:1.6}.gold{fill:#fff6df;stroke:#d7b363;stroke-width:1.6}.purple{fill:#f3eefb;stroke:#aa95d4;stroke-width:1.6}.red{fill:#faeeee;stroke:#d59898;stroke-width:1.6}.line{stroke:#526172;stroke-width:2.2;fill:none}.dash{stroke:#7b8799;stroke-width:2;fill:none;stroke-dasharray:8 7}.axis{stroke:#606b7d;stroke-width:2}</style><rect width="980" height="560" fill="white"/><text class="title" x="50" y="45">MSE penalizes large misses more strongly than absolute error</text><rect class="blue" x="100" y="405" width="60" height="35" rx="4"/><rect class="red" x="175" y="430" width="60" height="10" rx="4"/><text class="small" x="167" y="470" text-anchor="middle">Error = 1</text><rect class="blue" x="300" y="370" width="60" height="70" rx="4"/><rect class="red" x="375" y="400" width="60" height="40" rx="4"/><text class="small" x="367" y="470" text-anchor="middle">Error = 2</text><rect class="blue" x="500" y="335" width="60" height="105" rx="4"/><rect class="red" x="575" y="350" width="60" height="90" rx="4"/><text class="small" x="567" y="470" text-anchor="middle">Error = 3</text><rect class="blue" x="700" y="230" width="60" height="210" rx="4"/><rect class="red" x="775" y="80" width="60" height="360" rx="4"/><text class="small" x="767" y="470" text-anchor="middle">Error = 6</text><rect class="blue" x="620" y="95" width="18" height="18"/><text class="small" x="646" y="109">Absolute error |e|</text><rect class="red" x="620" y="125" width="18" height="18"/><text class="small" x="646" y="139">Squared error e²</text><text class="small" x="100" y="520">This visual compares the penalty applied to each miss, not a full MAD or MSE calculation.</text></svg>