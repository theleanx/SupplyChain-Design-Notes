<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Return-on-operating-assets decision tree</title>
  <desc id="desc">Return on operating assets is decomposed into operating margin and operating asset turnover, with supply-chain levers connected to revenue, cost, inventory, receivables, and fixed assets.</desc>
  <rect width="960" height="470" rx="24" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Supply-chain decisions change both profit and assets</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="330" y="78" width="300" height="70" rx="14" fill="#0f766e"/><text x="480" y="107" font-size="19" fill="white">Return on operating assets</text><text x="480" y="132" font-size="15" fill="#ccfbf1">operating profit ÷ average operating assets</text>
    <rect x="100" y="215" width="300" height="75" rx="14" fill="#1d4ed8"/><text x="250" y="246" font-size="19" fill="white">Operating margin</text><text x="250" y="272" font-size="15" fill="#dbeafe">operating profit ÷ revenue</text>
    <rect x="560" y="215" width="300" height="75" rx="14" fill="#7c3aed"/><text x="710" y="246" font-size="19" fill="white">Operating-asset turnover</text><text x="710" y="272" font-size="15" fill="#ede9fe">revenue ÷ average operating assets</text>
    <rect x="55" y="350" width="180" height="60" rx="12" fill="#0369a1"/><text x="145" y="386" font-size="16" fill="white">Revenue and service</text>
    <rect x="265" y="350" width="180" height="60" rx="12" fill="#b45309"/><text x="355" y="386" font-size="16" fill="white">Operating cost</text>
    <rect x="515" y="350" width="180" height="60" rx="12" fill="#be123c"/><text x="605" y="386" font-size="16" fill="white">Inventory and cash</text>
    <rect x="725" y="350" width="180" height="60" rx="12" fill="#475569"/><text x="815" y="386" font-size="16" fill="white">Fixed assets</text>
  </g>
  <g stroke="#64748b" stroke-width="4" fill="none"><path d="M480 148 V180 L250 215"/><path d="M480 180 L710 215"/><path d="M250 290 V320 L145 350"/><path d="M250 320 L355 350"/><path d="M710 290 V320 L605 350"/><path d="M710 320 L815 350"/></g>
</svg>
