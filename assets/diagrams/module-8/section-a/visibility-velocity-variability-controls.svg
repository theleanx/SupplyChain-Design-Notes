<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Three V measures: different denominators and units</title><desc id="desc">Different strategic measures: status visibility 70 to 92.5 percent, order-promise update cycle 12 to 9 hours, demand CV 0.40 to 0.25. Do not aggregate their denominators into one score.</desc><rect x="0" y="0" width="1000" height="600" rx="0" fill="#fff"/><rect x="0" y="0" width="1000" height="101" rx="0" fill="#173e55"/><text x="32" y="42" font-size="24" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff" font-weight="700">CSCP Module 8 · Optimization and Strategy</text><text x="32" y="77" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#fff">Three V measures: different denominators and units</text><text x="58" y="150" font-size="22" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#1b3e52" font-weight="700">Three different metrics need three different denominators</text><rect x="58" y="186" width="280" height="248" rx="12" fill="#dfeefa"/><text x="76" y="229" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52" font-weight="700">Visibility</text><text x="76" y="267" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">70% → 92.5%</text><text x="82" y="318" font-size="20" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#22587b" font-weight="700">+22.5 percentage points</text><rect x="362" y="186" width="280" height="248" rx="12" fill="#e5f4e9"/><text x="380" y="229" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52" font-weight="700">Velocity</text><text x="380" y="267" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">12 h → 9 h</text><text x="384" y="318" font-size="20" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#266d53" font-weight="700">−25% cycle time</text><rect x="668" y="186" width="280" height="248" rx="12" fill="#fff0e3"/><text x="686" y="229" font-size="23" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52" font-weight="700">Variability</text><text x="686" y="267" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#193c52">CV 0.40 → 0.25</text><text x="688" y="318" font-size="20" font-family="Arial,Helvetica,sans-serif" text-anchor="start" fill="#96613b" font-weight="700">−37.5% relative CV</text><text x="505" y="491" font-size="19" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#475f70" font-weight="700">Visibility, delay and variability are not interchangeable outcome units</text><line x1="32" y1="560" x2="968" y2="560" stroke="#bdcdd7" stroke-width="2"/><text x="500" y="585" font-size="17" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#557083">AlderGate Motion Products · fictional scope and calculations</text></svg>