<text x="55" y="42" class="eyebrow" text-anchor="start"><tspan x="55" y="42">MODULE 4 · INTERNAL OPERATIONS &amp; INVENTORY</tspan></text>
<text x="55" y="82" class="title" text-anchor="start"><tspan x="55" y="82">Order Quantities: Lot-for-Lot, FOQ, and EOQ</tspan></text>
<text x="55" y="111" class="subtitleSm" text-anchor="start"><tspan x="55" y="111">Original decision visual for order quantities: lot-for-lot, foq, and eoq, using fictional Pinehaven Motion Systems data where applicable.</tspan></text>
<text x="55" y="150" class="h" text-anchor="start"><tspan x="55" y="150">Three order-quantity logics solve different trade-offs</tspan></text>
<rect x="65" y="210" width="300" height="155" rx="14" fill="#E8F5EF" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="65" y="210" width="8" height="155" rx="14" fill="#2F7D65" opacity="1"/>
<text x="87" y="241" class="h" text-anchor="start"><tspan x="87" y="241">Lot-for-lot</tspan></text>
<text x="87" y="270" class="small" text-anchor="start"><tspan x="87" y="270">Quantity equals each period net</tspan><tspan x="87" y="288">requirement. Low cycle stock ·</tspan><tspan x="87" y="306">frequent orders</tspan></text>
<rect x="450" y="210" width="300" height="155" rx="14" fill="#EAF4F8" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="450" y="210" width="8" height="155" rx="14" fill="#3A7CA5" opacity="1"/>
<text x="472" y="241" class="h" text-anchor="start"><tspan x="472" y="241">Fixed order quantity</tspan></text>
<text x="472" y="270" class="small" text-anchor="start"><tspan x="472" y="270">Use a predetermined batch or</tspan><tspan x="472" y="288">multiple. Simple · may carry</tspan><tspan x="472" y="306">leftovers</tspan></text>
<rect x="835" y="210" width="300" height="155" rx="14" fill="#FFF4D8" stroke="#D4E0E8" stroke-width="1" opacity="1"/>
<rect x="835" y="210" width="8" height="155" rx="14" fill="#C98516" opacity="1"/>
<text x="857" y="241" class="h" text-anchor="start"><tspan x="857" y="241">EOQ</tspan></text>
<text x="857" y="270" class="small" text-anchor="start"><tspan x="857" y="270">Balances ordering and carrying</tspan><tspan x="857" y="288">cost. PH-PWR220 ≈ 307 units</tspan></text>
