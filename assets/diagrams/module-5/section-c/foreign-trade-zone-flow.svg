<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="696" viewBox="0 0 1160 696" role="img" aria-labelledby="title desc">
<title id="title">Foreign-trade zone operating flow</title><desc id="desc">Goods are admitted, stored or processed under authorization, then re-exported or entered into U.S. commerce.</desc>
<rect width="1160" height="696" fill="#ffffff"/>
<text x="48" y="64" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17324d">Foreign-trade zone operating flow</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6d7e8e"/></marker></defs><rect x="70" y="285" width="210" height="110" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="175.0" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Admit to zone</text><text x="175.0" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">foreign status</text><rect x="350" y="145" width="230" height="110" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="465.0" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Store / inspect</text><text x="465.0" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">duty deferred</text><rect x="350" y="425" width="230" height="110" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="465.0" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Authorized</text><text x="465.0" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">production</text><text x="465.0" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">approval required</text><rect x="650" y="285" width="220" height="110" rx="14" fill="#eaf4f8" stroke="#0b7189" stroke-width="2"/><text x="760.0" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Choose exit</text><text x="760.0" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">reexport or domestic</text><rect x="930" y="155" width="180" height="100" rx="14" fill="#e9f6ec" stroke="#0b7189" stroke-width="2"/><text x="1020.0" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">Reexport</text><text x="1020.0" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">no U.S. duty in model</text><rect x="930" y="415" width="180" height="100" rx="14" fill="#fff4d8" stroke="#0b7189" stroke-width="2"/><text x="1020.0" y="461" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#17324d">U.S. entry</text><text x="1020.0" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4f6475">duty due</text><line x1="280" y1="340" x2="350" y2="200" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="280" y1="340" x2="350" y2="480" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="580" y1="200" x2="650" y2="340" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="580" y1="480" x2="650" y2="340" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="870" y1="340" x2="930" y2="205" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/><line x1="870" y1="340" x2="930" y2="465" stroke="#6d7e8e" stroke-width="3" marker-end="url(#a)"/>
</svg>