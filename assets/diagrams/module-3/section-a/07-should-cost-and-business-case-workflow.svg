<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Should-Cost and Business-Case Bridge</title>
  <desc id="desc">Reconcile technical cost drivers with risk-adjusted commercial value.</desc>
  <defs>
