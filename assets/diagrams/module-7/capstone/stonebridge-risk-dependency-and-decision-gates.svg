<text x="844" y="616" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#14324c" text-anchor="start">Customer allocation</text>
<text x="844" y="643" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#435869" text-anchor="start">approved promise</text>
<line x1="1066" y1="607" x2="1086" y2="607" stroke="#6d7d89" stroke-width="3" marker-end="url(#a)"/>
